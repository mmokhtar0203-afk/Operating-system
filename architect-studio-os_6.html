<script>
  // Catches anything that happens before React ever takes over — a CDN
  // script failing to load, a syntax error in the inline Babel script, or
  // any other early exception. Without this, any of those failures leaves
  // the page completely blank with zero indication of what went wrong.
  window.__STUDIO_BOOT_FAILED = false;
  window.addEventListener("error", function (e) {
    if (window.__STUDIO_BOOT_OK) return; // app already mounted successfully — ignore later runtime noise here
    window.__STUDIO_BOOT_FAILED = true;
    showBootError((e && e.message) || "An unknown error occurred while loading the app.");
  });
  window.addEventListener("unhandledrejection", function (e) {
    if (window.__STUDIO_BOOT_OK) return;
    window.__STUDIO_BOOT_FAILED = true;
    showBootError((e && e.reason && e.reason.message) || "An unknown error occurred while loading the app.");
  });
  function showBootError(message) {
    var root = document.getElementById("root");
    if (!root) return;
    root.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b0c;color:#e9e5dc;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">' +
        '<div style="max-width:480px;">' +
          '<div style="font-size:18px;font-weight:600;margin-bottom:10px;">Architect Studio OS couldn\'t start</div>' +
          '<div style="font-size:13.5px;color:#918d84;line-height:1.6;margin-bottom:16px;">' +
            "This usually means a required script failed to load — often a temporary network issue. Reloading the page fixes it in most cases." +
          "</div>" +
          '<div style="font-size:11.5px;color:#5c5953;font-family:monospace;background:#141416;border:1px solid #28282c;border-radius:8px;padding:10px 12px;margin-bottom:16px;word-break:break-word;">' + escapeHtml(message) + "</div>" +
          '<button onclick="location.reload()" style="background:#c8a96e;color:#171310;border:none;border-radius:8px;padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;">Reload</button>' +
        "</div>" +
      "</div>";
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
</script>

<script>
  // Local-storage backed shim mirroring the window.storage API used by
  // claude.ai artifacts, so this file runs standalone in any browser.
  if (!window.storage) {
    window.storage = {
      async get(key) {
        try {
          const v = localStorage.getItem('studioos:' + key);
          if (v === null) return null;
          return { key, value: v, shared: false };
        } catch (e) { return null; }
      },
      async set(key, value) {
        try {
          localStorage.setItem('studioos:' + key, value);
          return { key, value, shared: false };
        } catch (e) { return null; }
      },
      async delete(key) {
        try {
          localStorage.removeItem('studioos:' + key);
          return { key, deleted: true, shared: false };
        } catch (e) { return null; }
      },
      async list(prefix) {
        try {
          const keys = Object.keys(localStorage).filter(k => k.startsWith('studioos:' + (prefix || ''))).map(k => k.replace('studioos:', ''));
          return { keys, prefix, shared: false };
        } catch (e) { return null; }
      }
    };
  }
</script>

/* ── Shared financial calculations ────────────────────────────────
   Three genuinely independent metrics, computed separately and never mixed:

   1. Cash Flow    — "how much money do I currently have from this project?"
                      Received Payments − Expenses Paid. Pure bookkeeping.
   2. Receivables  — "how much does the client still owe me?"
                      Contract Value − Received Payments.

  // the user as "Cash Balance" anymore; every user-facing balance display
  // now uses computeAvailableProjectBalance instead.
  const cashBalance = totalReceived - totalExpensesPaid;

  const total = ordered.length;
  const completed = ordered.filter(s => s.effectiveStatus === "Completed");
  const cancelled = ordered.filter(s => s.effectiveStatus === "Cancelled");
  // Cancelled stages don't count toward "remaining work" or the progress
  // denominator the same way active ones do — but they're not silently
  // dropped either; they're reported separately so nothing goes missing.
  const activeTotal = total - cancelled.length;
  const progressPct = activeTotal > 0 ? Math.round((completed.length / activeTotal) * 100) : 0;

  // Current Stage: the first non-completed, non-cancelled stage in order —
  // this is "the stage currently driving the project," per the spec.
  const currentStage = ordered.find(s => s.effectiveStatus !== "Completed" && s.effectiveStatus !== "Cancelled") || null;
  const currentIndex = currentStage ? ordered.findIndex(s => s.id === currentStage.id) : -1;
  const nextStage = currentIndex >= 0 ? (ordered.slice(currentIndex + 1).find(s => s.effectiveStatus !== "Cancelled") || null) : null;

  // Blocked stages: anything genuinely waiting on an incomplete dependency —
  // and for the Current Stage banner, name which specific unmet dependency
  // is the reason (the first one found), so "Blocked By" reads concretely.
  const blockedStages = ordered.filter(s => s.effectiveStatus === "Waiting For Dependency").map(s => {
    const unmetDep = (s.dependsOn || []).map(id => statusById[id]).find(d => d && d.effectiveStatus !== "Completed");
    return { ...s, blockedByName: unmetDep ? unmetDep.name : null };
  });

  const overdue = ordered.filter(s => {
    if (s.effectiveStatus === "Completed" || s.effectiveStatus === "Cancelled") return false;
    if (!s.plannedFinishDate) return false;
    const planned = toDate(s.plannedFinishDate);
    return planned && planned < new Date(new Date().toDateString());
  }).map(s => {
    const planned = toDate(s.plannedFinishDate);
    const days = Math.max(0, Math.floor((new Date(new Date().toDateString()) - planned) / 86400000));
    return { ...s, overdueDays: days };
  });

  return {
    stages: ordered, total, completed, cancelled, activeTotal, progressPct,
    currentStage, nextStage, blockedStages, overdue,
    remaining: activeTotal - completed.length,
  };
}

/* Instantiates the default finishing template into real stage records for a
   project — resolves the template's index-based `deps` into actual stage
   ids, since those don't exist until this runs. Purely additive: returns a
   new stages array, never mutates anything, so the caller decides whether
   to replace or merge with any existing stages. */
function instantiateStageTemplate(template) {
  const ids = template.map(() => uid());
  return template.map((t, i) => ({
    id: ids[i],
    name: t.name,
    description: "",
    color: STAGE_COLORS[i % STAGE_COLORS.length],
    duration: "",
    notes: "",
    order: i,
    dependsOn: (t.deps || []).map(depIndex => ids[depIndex]),
    status: "Not Started",
    locked: false,
    startDate: "", plannedFinishDate: "", actualFinishDate: "",
    assignedTeam: "", assignedSupplierId: "",
    attachments: [], photos: [],
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
  }));
}

/* Deletes a stage and safely recalculates every other stage's dependsOn so
   nothing is left pointing at a stage that no longer exists — exactly the
   "system must automatically recalculate dependencies" requirement. Locked
   stages cannot be deleted; the caller is expected to have already checked
   this, but it's enforced here too as a hard guarantee. */
function removeStageSafely(stages, stageId) {
  const target = stages.find(s => s.id === stageId);
  if (!target || target.locked) return stages;
  return stages
    .filter(s => s.id !== stageId)
    .map(s => ({ ...s, dependsOn: (s.dependsOn || []).filter(id => id !== stageId) }));
}

/* Reorders stages via drag-and-drop, updating each stage's `order` field.
   This never touches explicit dependsOn edges — moving a stage's position
   in the list does not silently rewire what it depends on, since those are
   two genuinely different concepts (display/default order vs. real
   dependency gating). Locked stages cannot be moved. */
function reorderStagesSafely(stages, fromId, toIndex) {
  const moving = stages.find(s => s.id === fromId);
  if (!moving || moving.locked) return stages;
  const ordered = [...stages].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  const fromIndex = ordered.findIndex(s => s.id === fromId);
  if (fromIndex === -1) return stages;
  const [item] = ordered.splice(fromIndex, 1);
  ordered.splice(toIndex, 0, item);
  return ordered.map((s, i) => ({ ...s, order: i }));
}

/* Duplicates a stage and its settings (per spec) — a fresh id, "(Copy)"
   appended to the name so it's visibly distinct, reset to Not Started/
   unlocked/no actual dates, and placed immediately after the original.
   Dependencies are NOT copied verbatim onto the duplicate by default (a
   duplicate depending on the same predecessors as its source is a
   reasonable default), but the duplicate starts unlocked so the user can
   freely adjust it. */
function duplicateStage(stages, stageId) {
  const source = stages.find(s => s.id === stageId);
  if (!source) return stages;
  const newStage = {
    ...source, id: uid(), name: `${source.name} (Copy)`, locked: false,
    status: "Not Started", actualFinishDate: "",
    actions: (source.actions || []).map(a => ({ ...a, id: uid(), done: false })),
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
  };
  const ordered = [...stages].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  const sourceIndex = ordered.findIndex(s => s.id === stageId);
  ordered.splice(sourceIndex + 1, 0, newStage);
  return ordered.map((s, i) => ({ ...s, order: i }));
}

function computeProjectProfit(project) {
  const revenue = project.revenue || [];
  const expenses = project.expenses || [];
  // Legacy support: older projects stored Unit Price line items in a wholly
  // separate project.unitPriceItems[] array. Fold those in here (tagged with
  // billingMethod: "Unit Price") so profit math sees one unified item list —
  // this never mutates the project, it's a read-time merge only.
  const legacyUnitPriceItems = (project.unitPriceItems || []).map(r => ({ ...r, billingMethod: "Unit Price", billable: r.billable !== false }));
  const allItems = [...expenses, ...legacyUnitPriceItems];

  // Design Fee: its own item profit is simply Revenue − Outsource Cost
  // (Outsource Cost is 0 whenever Outsourced is off, so the whole fee is profit).
  // This is genuinely revenue booked for design work, not a cash-received figure.
  const designFeeRecords = revenue.filter(r => r.revenueType === "Design Fee");
  const designFeeRevenue = designFeeRecords.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  const designOutsourceCost = designFeeRecords.reduce((s, r) => s + (r.outsourced ? (Number(r.outsourceCost) || 0) : 0), 0);
  const designProfit = designFeeRevenue - designOutsourceCost;

  // Billing method is now selected per item, not per project — a single
  // project can mix Cost Plus and Unit Price items freely. Each billable
  // item computes its own Client Price and Item Profit via the single
  // shared computeItemBilling formula, and Project Profit sums every item's
  // profit regardless of which method it used.
  const billableItems = allItems.filter(e => e.billable !== false);

  const costPlusRows = billableItems.filter(e => (e.billingMethod || "Cost Plus") === "Cost Plus").map(computeItemBilling);
  const costPlusSellingPrice = costPlusRows.reduce((s, r) => s + r.clientPrice, 0);
  const costPlusActualCost = costPlusRows.reduce((s, r) => s + r.cost, 0);
  const costPlusProfit = costPlusRows.reduce((s, r) => s + r.itemProfit, 0); // == costPlusSellingPrice - costPlusActualCost

  const unitPriceRows = billableItems.filter(e => e.billingMethod === "Unit Price").map(computeItemBilling);
  const unitPriceSellingPrice = unitPriceRows.reduce((s, r) => s + r.clientPrice, 0);
  const unitPriceActualCost = unitPriceRows.reduce((s, r) => s + r.cost, 0);
  const unitPriceProfit = unitPriceRows.reduce((s, r) => s + r.itemProfit, 0);

  const otherRevenue = revenue.filter(r => r.revenueType === "Other Revenue").reduce((s, r) => s + (Number(r.amount) || 0), 0);

  // Selling Price and Actual Cost are reported studio-wide for the reporting
  // section's "Never use received payments" requirement — everything here is
  // priced/costed, never collected-cash.
  const sellingPrice = designFeeRevenue + costPlusSellingPrice + unitPriceSellingPrice + otherRevenue;
  const actualCost = designOutsourceCost + costPlusActualCost + unitPriceActualCost;
  const totalProjectExpenses = allItems.reduce((s, e) => s + (Number(e.amount ?? e.actualCost) || 0), 0);
  const projectProfit = designProfit + costPlusProfit + unitPriceProfit + otherRevenue;

  const contractValue = Number(project.fee) || 0;
  const profitMargin = contractValue > 0 ? (projectProfit / contractValue) * 100 : 0;

  const revenueByType = {
    "Design Fee": designFeeRevenue,
    "Cost Plus Markup": costPlusProfit,
    "Unit Price Contract Revenue": unitPriceSellingPrice,
    "Other Revenue": otherRevenue,
  };

  return {
    designFeeRevenue, designOutsourceCost, designProfit,
    costPlusSellingPrice, costPlusActualCost, costPlusProfit,
    unitPriceSellingPrice, unitPriceActualCost, unitPriceProfit,
    otherRevenue,
    sellingPrice, actualCost, totalExpenses: totalProjectExpenses,
    projectProfit, contractValue, profitMargin,
    revenueByType,
    // Back-compat aliases used by a few older call sites' naming:
    totalRevenue: sellingPrice, totalProfit: projectProfit,
    unitPriceContractRevenue: unitPriceSellingPrice, markupProfit: costPlusProfit,
  };
}

/* Available Project Balance — replaces the old "Cash Balance = Received −
   Expenses" concept entirely. This studio operates on a project-funding
   model: money received from the client must cover the design fee already
   earned, the actual site costs already paid, and the markup/profit already
   booked on billable items. What's left over (or short) is what's actually
   still available to fund the rest of the project.

     AvailableProjectBalance =
       TotalReceivedPayments − DesignRevenue − ActualExpenseCosts − MarkupProfit

   Equivalently: TotalReceivedPayments − TotalProjectValue, where
   TotalProjectValue = DesignRevenue + ActualExpenseCosts + MarkupProfit.
   Built directly from computeProjectCashFlow (for TotalReceivedPayments) and
   computeProjectProfit (for DesignRevenue, ActualExpenseCosts, MarkupProfit)
   rather than recomputing any of those figures — same single-source-of-truth
   principle as everywhere else in the finance system. */
function computeAvailableProjectBalance(project) {
  const cashFlow = computeProjectCashFlow(project);
  const profit = computeProjectProfit(project);

  const designRevenue = profit.designFeeRevenue;
  const actualExpenseCosts = profit.costPlusActualCost + profit.unitPriceActualCost;
  const markupProfit = profit.costPlusProfit + profit.unitPriceProfit;
  const totalProjectValue = designRevenue + actualExpenseCosts + markupProfit;
  const availableProjectBalance = cashFlow.totalReceived - totalProjectValue;

  return {
    totalReceivedPayments: cashFlow.totalReceived,
    designRevenue, actualExpenseCosts, markupProfit, totalProjectValue,
    availableProjectBalance,
  };
}

/* Auto-generates the next sequential receipt number for a project, scoped by
   calendar year: RCP-2026-001, RCP-2026-002, ... Looks at every payment on
   the project that already has a receiptNumber for the same year and picks
   one past the highest — so numbers are never reused even if an earlier
   receipt's payment is later deleted, and a new year always restarts at 001. */
function nextReceiptNumber(project, year) {
  const payments = project.payments || [];
  const prefix = `RCP-${year}-`;
  const usedNumbers = payments
    .map(p => p.receiptNumber)
    .filter(n => typeof n === "string" && n.startsWith(prefix))
    .map(n => parseInt(n.slice(prefix.length), 10))
    .filter(n => !isNaN(n));
  const next = (usedNumbers.length ? Math.max(...usedNumbers) : 0) + 1;
  return `${prefix}${String(next).padStart(3, "0")}`;
}

/* Green when funded, red when underfunded, neutral exactly at zero — the
   color rule the task specifies, kept in one place so every card/chart that
   shows Available Project Balance colors it identically. */
function availableBalanceColor(value) {
  if (value > 0) return C.green;
  if (value < 0) return C.red;
  return C.muted;
}

const STORAGE_KEY = "architect-studio-os-v1";
const BACKUP_PREFIX = "architect-studio-os-autobackup-";
const MAX_AUTO_BACKUPS = 5;

/* Rotates automatic backups, keeping only the most recent MAX_AUTO_BACKUPS. */
async function rotateAutoBackup(data) {
  try {
    const stamp = new Date().toISOString();
    const key = BACKUP_PREFIX + stamp;
    await window.storage.set(key, JSON.stringify({ savedAt: stamp, data }));
    const listed = await window.storage.list(BACKUP_PREFIX);
    const keys = (listed && listed.keys) ? listed.keys.slice().sort() : [];
    if (keys.length > MAX_AUTO_BACKUPS) {
      const toRemove = keys.slice(0, keys.length - MAX_AUTO_BACKUPS);
      for (const k of toRemove) { try { await window.storage.delete(k); } catch (e) { /* noop */ } }
    }
  } catch (e) { /* noop — backup rotation is best-effort */ }
}

async function listAutoBackups() {
  try {
    const listed = await window.storage.list(BACKUP_PREFIX);
    const keys = (listed && listed.keys) ? listed.keys.slice().sort().reverse() : [];
    const backups = [];
    for (const k of keys) {
      try {
        const res = await window.storage.get(k);
        if (res && res.value) { const parsed = JSON.parse(res.value); backups.push({ key: k, savedAt: parsed.savedAt, data: parsed.data }); }
      } catch (e) { /* skip unreadable backup */ }
    }
    return backups;
  } catch (e) { return []; }
}

// Save status: "saved" | "saving" | "unsaved"
function useStudioData() {
  const [data, setData] = useState(emptyData());
  const [loaded, setLoaded] = useState(false);
  const [saveStatus, setSaveStatus] = useState("saved");
  const saveTimer = useRef(null);
  const backupTimer = useRef(null);
  const dirtyRef = useRef(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setData({ ...emptyData(), ...parsed });
        }
      } catch (e) { /* first run, no data yet */ }
      setLoaded(true);
    })();
  }, []);

  const persistNow = useCallback(async (nextData) => {
    setSaveStatus("saving");
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(nextData));
      setSaveStatus("saved");
      dirtyRef.current = false;
      if (backupTimer.current) clearTimeout(backupTimer.current);
      backupTimer.current = setTimeout(() => rotateAutoBackup(nextData), 2000);
    } catch (e) {
      setSaveStatus("unsaved");
    }
  }, []);

  useEffect(() => {
    if (!loaded) return;
    dirtyRef.current = true;
    setSaveStatus("unsaved");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => { persistNow(data); }, 1000);
    return () => clearTimeout(saveTimer.current);
  }, [data, loaded, persistNow]);

  const saveNow = useCallback(() => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    persistNow(data);
  }, [data, persistNow]);

  return { data, setData, loaded, saveStatus, saveNow };
}

/* ── Follow-up engine ─────────────────────────────────────────── */
// Central logic: surfaces anything overdue, waiting, or approaching so nothing is forgotten.
function useFollowUps(data) {
  return useMemo(() => {
    const today = TODAY();
    const items = [];

    data.actions.forEach(a => {
      if (a.status === "Completed" || a.status === "Cancelled") return;
      if (a.dueDate) {
        const d = toDate(a.dueDate);
        const diff = daysBetween(today, d);
        if (diff < 0) items.push({ id: "act-" + a.id, type: "action-overdue", severity: "high", title: a.title, detail: `${-diff} day${-diff === 1 ? "" : "s"} overdue`, projectId: a.projectId, stageId: a.stageId, contactId: a.contactId, refId: a.id, refType: "action", days: diff });
      }
      if (a.status === "Waiting") {
        items.push({ id: "act-wait-" + a.id, type: "waiting", severity: "medium", title: a.title, detail: "Waiting for response", projectId: a.projectId, stageId: a.stageId, contactId: a.contactId, refId: a.id, refType: "action", days: 0 });
      }
    });

    data.supplierItems.forEach(s => {
      if (s.stage === "Completed") return;
      if (s.submissionDate) {
        const diff = daysBetween(today, toDate(s.submissionDate));
        if (diff < 0 && !["Material Approved", "In Progress", "Installation Day"].includes(s.stage)) {
          items.push({ id: "sup-sub-" + s.id, type: "supplier-overdue", severity: "high", title: `${s.itemName} — submission overdue`, detail: `${-diff} day${-diff === 1 ? "" : "s"} overdue`, projectId: s.projectId, contactId: s.supplierId, refId: s.id, refType: "supplier", days: diff });
        }
      }
      if (s.installationDate) {
        const diff = daysBetween(today, toDate(s.installationDate));
        if (diff >= 0 && diff <= 7 && s.stage !== "Installation Day") {
          items.push({ id: "sup-install-" + s.id, type: "installation-approaching", severity: "medium", title: `${s.itemName} — installation approaching`, detail: relDay(s.installationDate), projectId: s.projectId, contactId: s.supplierId, refId: s.id, refType: "supplier", days: diff });
        }
      }
      if (["Quotation", "Material Selection"].includes(s.stage) && s.updatedAt) {
        const diff = daysBetween(toDate(s.updatedAt.slice(0, 10)), today);
        if (diff >= 7) {
          items.push({ id: "sup-stale-" + s.id, type: "stale", severity: "low", title: `${s.itemName} — no activity ${diff} days`, detail: `Stuck at "${s.stage}"`, projectId: s.projectId, contactId: s.supplierId, refId: s.id, refType: "supplier", days: diff });
        }
      }
    });

    data.actions.forEach(a => {
      if (a.category === "Need Resource" && a.resourceStage && a.resourceStage !== "Completed" && !["Completed", "Cancelled"].includes(a.status)) {
        const staleDays = a.updatedAt ? daysBetween(toDate(a.updatedAt.slice(0, 10)), today) : 0;
        if (staleDays >= 5) items.push({ id: "need-" + a.id, type: "need-resource-stale", severity: "low", title: `${a.title} — no movement ${staleDays} days`, detail: `Stuck at "${a.resourceStage}"`, projectId: a.projectId, contactId: a.contactId, refId: a.id, refType: "action", days: staleDays });
      }
    });

    data.meetings.forEach(m => {
      if (m.nextMeetingDate) {
        const diff = daysBetween(today, toDate(m.nextMeetingDate));
        if (diff < 0) items.push({ id: "meet-next-" + m.id, type: "meeting-followup", severity: "medium", title: `Follow-up meeting needed — ${m.title || m.type}`, detail: `Planned for ${fmt(m.nextMeetingDate)}`, projectId: m.projectId, refId: m.id, refType: "meeting", days: diff });
      }
    });

    return items.sort((a, b) => {
      const sevOrder = { high: 0, medium: 1, low: 2 };
      if (sevOrder[a.severity] !== sevOrder[b.severity]) return sevOrder[a.severity] - sevOrder[b.severity];
      return a.days - b.days;
    });
  }, [data]);
}

/* ── Derived selectors ────────────────────────────────────────── */
function useDerived(data) {
  const followUps = useFollowUps(data);
  return useMemo(() => {
    const today = TODAY();
    const projectById = Object.fromEntries(data.projects.map(p => [p.id, p]));
    const contactById = Object.fromEntries(data.contacts.map(c => [c.id, c]));

    const todaysActions = data.actions.filter(a => a.dueDate === todayISO() && !["Completed", "Cancelled"].includes(a.status))
      .sort((a, b) => (ACTION_PRIORITIES.indexOf(b.priority) - ACTION_PRIORITIES.indexOf(a.priority)));

    const overdueActions = data.actions.filter(a => {
      if (["Completed", "Cancelled"].includes(a.status) || !a.dueDate) return false;
      return toDate(a.dueDate) < today;
    }).sort((a, b) => toDate(a.dueDate) - toDate(b.dueDate));

    const upcomingMeetings = data.meetings.filter(m => m.date && toDate(m.date) >= today)
      .sort((a, b) => toDate(a.date) - toDate(b.date)).slice(0, 8);

    const todaysMeetings = data.meetings.filter(m => m.date === todayISO())
      .sort((a, b) => (a.time || "").localeCompare(b.time || ""));

    const waitingItems = data.actions.filter(a => a.status === "Waiting");

    const activeProjects = data.projects.filter(p => p.status === "Active");
    const onHoldProjects = data.projects.filter(p => p.status === "On Hold");

    const openActionsCount = data.actions.filter(a => !["Completed", "Cancelled"].includes(a.status)).length;

    // Daily Focus: every open action, sorted by due date (soonest/overdue first, undated last), then priority.
    const dailyFocusActions = data.actions.filter(a => !["Completed", "Cancelled"].includes(a.status))
      .sort((a, b) => {
        const ad = a.dueDate ? toDate(a.dueDate).getTime() : Infinity;
        const bd = b.dueDate ? toDate(b.dueDate).getTime() : Infinity;
        if (ad !== bd) return ad - bd;
        return ACTION_PRIORITIES.indexOf(b.priority) - ACTION_PRIORITIES.indexOf(a.priority);
      });

    return {
      followUps, projectById, contactById, todaysActions, overdueActions, upcomingMeetings, todaysMeetings,
      waitingItems, activeProjects, onHoldProjects, openActionsCount, dailyFocusActions,
    };
  }, [data, followUps]);
}

/* ── Global Finance Dashboard aggregation ─────────────────────────
   Everything here is derived, read-only math over data.projects — no new
   records are ever created or stored. Each project's own payments[] and
   expenses[] (already used by its Finance tab) are the single source of
   truth; this just sums and groups them across the whole studio. */
function useFinanceRollup(data) {
  return useMemo(() => {
    const perProject = data.projects.map(p => {
      const payments = p.payments || [];
      const expenses = p.expenses || [];
      const revenue = p.revenue || [];
      const fee = Number(p.fee) || 0;
      const received = payments.reduce((s, pay) => s + (Number(pay.amount) || 0), 0);
      const spent = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const outstanding = fee - received;
      // Same computeProjectProfit used by the project's own Finance tab —
      // the dashboard and the project page can never show different numbers.
      const profit = computeProjectProfit(p);
      // Available Project Balance replaces the old "Received − Expenses"
      // cash balance concept everywhere — see computeAvailableProjectBalance
      // for the full formula and reasoning.
      const availableBalance = computeAvailableProjectBalance(p);
      return { project: p, fee, received, spent, outstanding, availableBalance, payments, expenses, revenue, profit };
    });

    const totalContractValue = perProject.reduce((s, r) => s + r.fee, 0);
    const totalReceived = perProject.reduce((s, r) => s + r.received, 0);
    const totalExpenses = perProject.reduce((s, r) => s + r.spent, 0);
    // Studio-wide profit metrics — every figure sums the identical per-project
    // computeProjectProfit results used on each project's own Finance tab.
    // Total Studio Profit is the direct sum of each project's own profit —
    // never recomputed as revenue-minus-expenses at the studio level, which
    // would risk exactly the double-counting this system is built to avoid.
    const totalStudioProfit = perProject.reduce((s, r) => s + r.profit.projectProfit, 0);
    const totalStudioSellingPrice = perProject.reduce((s, r) => s + r.profit.sellingPrice, 0);
    const totalStudioActualCost = perProject.reduce((s, r) => s + r.profit.actualCost, 0);
    const totalDesignProfit = perProject.reduce((s, r) => s + r.profit.designProfit, 0);
    const totalMarkupProfit = perProject.reduce((s, r) => s + r.profit.costPlusProfit, 0);
    const totalUnitPriceRevenue = perProject.reduce((s, r) => s + r.profit.unitPriceSellingPrice, 0);

    // Outstanding Receivables — unchanged per this task's explicit "Do NOT
    // Change" instruction: Total Contract Value − Total Received, exactly as
    // established and tested in the earlier Finance Dashboard and Profit
    // Calculation Refactor work (see computeProjectReceivables for the
    // matching project-level formula).
    const totalOutstanding = totalContractValue - totalReceived;
    // StudioAvailableBalance = Sum(All Project Available Project Balances) —
    // a direct sum of each project's own figure, never recomputed at the
    // studio level, so it can never drift from what each project shows.
    const studioAvailableBalance = perProject.reduce((s, r) => s + r.availableBalance.availableProjectBalance, 0);

    const projectsWithActivity = perProject.filter(r => r.profit.sellingPrice > 0 || r.profit.actualCost > 0);
    const mostProfitableProject = projectsWithActivity.length
      ? projectsWithActivity.reduce((best, r) => r.profit.projectProfit > best.profit.projectProfit ? r : best)
      : null;
    const leastProfitableProject = projectsWithActivity.length
      ? projectsWithActivity.reduce((worst, r) => r.profit.projectProfit < worst.profit.projectProfit ? r : worst)
      : null;

    const projectRanking = perProject
      .slice()
      .sort((a, b) => b.profit.projectProfit - a.profit.projectProfit);

    // Category breakdown across every project's expenses, not just one.
    const categoryTotals = {};
    perProject.forEach(r => {
      r.expenses.forEach(e => {
        const cat = e.category || "Other";
        categoryTotals[cat] = (categoryTotals[cat] || 0) + (Number(e.amount) || 0);
      });
    });
    const categoryBreakdown = Object.entries(categoryTotals)
      .map(([category, amount]) => ({ category, amount, pct: totalExpenses > 0 ? (amount / totalExpenses) * 100 : 0 }))
      .sort((a, b) => b.amount - a.amount);

    // Monthly cash-flow series: every payment and expense bucketed by its own
    // date's year-month, across all projects — this is Income vs Expenses in
    // cash terms, used by the Monthly Financial Report's cash flow filter.
    const monthlyMap = {}; // "2026-07" -> { income, expenses }
    perProject.forEach(r => {
      r.payments.forEach(pay => {
        if (!pay.date) return;
        const key = pay.date.slice(0, 7);
        monthlyMap[key] = monthlyMap[key] || { income: 0, expenses: 0 };
        monthlyMap[key].income += Number(pay.amount) || 0;
      });
      r.expenses.forEach(e => {
        if (!e.date) return;
        const key = e.date.slice(0, 7);
        monthlyMap[key] = monthlyMap[key] || { income: 0, expenses: 0 };
        monthlyMap[key].expenses += Number(e.amount) || 0;
      });
    });
    const monthlySeries = Object.entries(monthlyMap)
      .map(([month, v]) => ({ month, income: v.income, expenses: v.expenses, net: v.income - v.expenses }))
      .sort((a, b) => a.month.localeCompare(b.month));

    // Monthly PROFIT series — genuinely distinct from the cash-flow series
    // above. Buckets every profit-contributing record (Design Revenue, each
    // billable Cost Plus item, each billable Unit Price item, Other Revenue)
    // by its own date, so Design Revenue finally shows up in Profit Charts
    // and Monthly Reports exactly as it already does in the top-line Project
    // Profit figure. Never reads payments[] — profit is priced, not collected.
    const monthlyProfitMap = {}; // "2026-07" -> { profit }
    const addToProfitMonth = (dateStr, amount) => {
      if (!dateStr || !amount) return;
      const key = dateStr.slice(0, 7);
      monthlyProfitMap[key] = (monthlyProfitMap[key] || 0) + amount;
    };
    perProject.forEach(r => {
      (r.project.revenue || []).forEach(rev => {
        if (rev.revenueType === "Design Fee") {
          const outsourceCost = rev.outsourced ? (Number(rev.outsourceCost) || 0) : 0;
          addToProfitMonth(rev.date, (Number(rev.amount) || 0) - outsourceCost);
        } else if (rev.revenueType === "Other Revenue") {
          addToProfitMonth(rev.date, Number(rev.amount) || 0);
        }
      });
      const legacyUnitPriceItems = (r.project.unitPriceItems || []).map(u => ({ ...u, billingMethod: "Unit Price", billable: u.billable !== false }));
      [...r.expenses, ...legacyUnitPriceItems].forEach(e => {
        if (e.billable === false) return;
        addToProfitMonth(e.date, computeItemBilling(e).itemProfit);
      });
    });
    const monthlyProfitSeries = Object.entries(monthlyProfitMap)
      .map(([month, profitValue]) => ({ month, profit: profitValue }))
      .sort((a, b) => a.month.localeCompare(b.month));

    const outstandingReceivables = perProject
      .filter(r => r.outstanding > 0)
      .map(r => ({ project: r.project, fee: r.fee, received: r.received, remaining: r.outstanding }))
      .sort((a, b) => b.remaining - a.remaining);

    return {
      perProject, totalContractValue, totalReceived, totalExpenses, totalOutstanding, studioAvailableBalance,
      categoryBreakdown, monthlySeries, monthlyProfitSeries, outstandingReceivables,
      totalStudioProfit, totalStudioSellingPrice, totalStudioActualCost,
      totalDesignProfit, totalMarkupProfit, totalUnitPriceRevenue,
      mostProfitableProject, leastProfitableProject, projectRanking,
      // Back-compat aliases for existing dashboard labels ("Total Studio
      // Revenue" / "Total Studio Expenses" in the profitability sense mean
      // Selling Price / Actual Cost, never received payments or cash-flow expenses).
      totalStudioRevenue: totalStudioSellingPrice, totalStudioExpenses: totalStudioActualCost,
    };
  }, [data.projects]);
}

/* ── Supplier Database aggregation ────────────────────────────────
   Suppliers are Contacts with type "Supplier" — no separate/duplicate
   collection is created. This hook derives every financial figure (Total
   Paid, transaction history, top suppliers, monthly/category spending)
   purely from expenses across all projects that reference a supplierId,
   recomputed fresh every time so it can never drift from the source data. */
function useSupplierRollup(data) {
  return useMemo(() => {
    const suppliers = data.contacts.filter(c => c.type === "Supplier");

    // Every expense across every project that references a supplier, each
    // annotated with which project it came from (for the transactions table).
    const allSupplierExpenses = [];
    data.projects.forEach(p => {
      (p.expenses || []).forEach(e => {
        if (e.supplierId) allSupplierExpenses.push({ ...e, projectId: p.id, projectName: p.name });
      });
    });

    const perSupplier = suppliers.map(s => {
      const transactions = allSupplierExpenses.filter(e => e.supplierId === s.id)
        .sort((a, b) => (toDate(b.date)?.getTime() ?? 0) - (toDate(a.date)?.getTime() ?? 0));
      const totalPaid = transactions.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
      const projectIds = new Set(transactions.map(e => e.projectId));
      const lastPaymentDate = transactions.length ? transactions[0].date : null;
      return { supplier: s, transactions, totalPaid, transactionCount: transactions.length, projectsCount: projectIds.size, lastPaymentDate };
    });

    const topSuppliersBySpending = perSupplier.slice().sort((a, b) => b.totalPaid - a.totalPaid).filter(r => r.totalPaid > 0);

    // Monthly supplier spending — every supplier-linked expense bucketed by
    // its own date's year-month, across the whole studio.
    const monthlyMap = {};
    allSupplierExpenses.forEach(e => {
      if (!e.date) return;
      const key = e.date.slice(0, 7);
      monthlyMap[key] = (monthlyMap[key] || 0) + (Number(e.amount) || 0);
    });
    const monthlySupplierSpending = Object.entries(monthlyMap)
      .map(([month, amount]) => ({ month, amount }))
      .sort((a, b) => a.month.localeCompare(b.month));

    // Supplier spending by category — uses each supplier's own category,
    // not the expense's category, since the question is "which trade am I
    // paying the most into," not "which line-item category costs the most."
    const categoryMap = {};
    perSupplier.forEach(r => {
      if (r.totalPaid <= 0) return;
      const cat = r.supplier.category || "Other";
      categoryMap[cat] = (categoryMap[cat] || 0) + r.totalPaid;
    });
    const spendingByCategory = Object.entries(categoryMap)
      .map(([category, amount]) => ({ category, amount }))
      .sort((a, b) => b.amount - a.amount);

    return { suppliers, perSupplier, topSuppliersBySpending, monthlySupplierSpending, spendingByCategory };
  }, [data.contacts, data.projects]);
}

/* ── Global search ────────────────────────────────────────────── */
function globalSearch(data, query) {
  const q = query.trim().toLowerCase();
  if (!q) return null;
  const hit = (s) => (s || "").toLowerCase().includes(q);
  return {
    projects: data.projects.filter(p => hit(p.name) || hit(p.client) || hit(p.notes)),
    actions: data.actions.filter(a => hit(a.title) || hit(a.description) || hit(a.notes)),
    meetings: data.meetings.filter(m => hit(m.title) || hit(m.notes) || hit(m.decisions) || hit(m.location)),
    contacts: data.contacts.filter(c => hit(c.name) || hit(c.company) || hit(c.category) || hit(c.notes) || (c.tags || []).some(hit)),
    suppliers: data.supplierItems.filter(s => hit(s.itemName) || hit(s.notes) || hit(s.comments)),
  };
}

/* ── Save status indicator ────────────────────────────────────── */
function SaveStatus({ status, onSave }) {
  const cfg = {
    saved: { label: "Saved", color: C.green, icon: <Icon.check size={13} /> },
    saving: { label: "Saving…", color: C.yellow, icon: <Icon.clock size={13} /> },
    unsaved: { label: "Unsaved changes", color: C.muted, icon: <Icon.alert size={13} /> },
  }[status] || { label: "Saved", color: C.green, icon: <Icon.check size={13} /> };

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: cfg.color, fontFamily: FONT, fontWeight: 500 }}>
        <span style={{ display: "flex" }}>{cfg.icon}</span>
        {cfg.label}
      </div>
      <Btn size="sm" variant="subtle" onClick={onSave} disabled={status === "saving"}>Save</Btn>

}

/* ── Top bar with global search ───────────────────────────────── */
function TopBar({ data, onOpenResult, onQuickAdd, saveStatus, onSaveNow }) {
  const [q, setQ] = useState("");
  const [focused, setFocused] = useState(false);
  const results = q.trim() ? globalSearch(data, q) : null;
  const totalHits = results ? Object.values(results).reduce((s, arr) => s + arr.length, 0) : 0;

  return (
    <div className="studio-topbar" style={{ position: "sticky", top: 0, zIndex: 20, background: "rgba(11,11,12,.92)", backdropFilter: "blur(8px)", borderBottom: `1px solid ${C.border}`, padding: "14px 28px", display: "flex", alignItems: "center", gap: 16 }}>
      <div className="topbar-search" style={{ position: "relative", flex: 1, maxWidth: 460 }}>
        <div style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: C.dim, display: "flex" }}><Icon.search size={15} /></div>
        <input value={q} onChange={(e) => setQ(e.target.value)} onFocus={() => setFocused(true)} onBlur={() => setTimeout(() => setFocused(false), 150)}
          placeholder="Search projects, actions, contacts, suppliers..."
          style={{ ...inputStyle, paddingLeft: 36, background: C.surface2 }} />
        {focused && q.trim() && (
          <div style={{ position: "absolute", top: "110%", left: 0, right: 0, background: C.surface3, border: `1px solid ${C.border2}`, borderRadius: 10, boxShadow: "0 12px 32px rgba(0,0,0,.5)", maxHeight: 360, overflowY: "auto", zIndex: 30 }}>
            {totalHits === 0 ? (
              <div style={{ padding: 18, fontSize: 13, color: C.muted, textAlign: "center" }}>No results for "{q}"</div>
            ) : (
              Object.entries(results).map(([cat, arr]) => arr.length > 0 && (
                <div key={cat} style={{ padding: "8px 0" }}>
                  <div style={{ fontSize: 10.5, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".06em", padding: "4px 14px" }}>{cat}</div>
                  {arr.slice(0, 5).map(item => {
                    const project = cat === "actions" ? data.projects.find(p => p.id === item.projectId) : null;
                    const stage = project && item.stageId ? (project.stages || []).find(s => s.id === item.stageId) : null;
                    return (
                      <div key={item.id} onMouseDown={() => onOpenResult(cat, item)} style={{ padding: "8px 14px", cursor: "pointer", fontSize: 13, color: C.text }}
                        onMouseEnter={(e) => e.currentTarget.style.background = C.surface4} onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                        <div>{item.title || item.name || item.itemName}</div>
                        {cat === "actions" && (project || stage) && (
                          <div style={{ fontSize: 11, color: C.dim, marginTop: 1 }}>
                            {project ? project.name : "No project"}{stage ? ` · ${stage.name}` : ""}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              ))
            )}
          </div>
        )}
      </div>
      <div style={{ flex: 1 }} />
      <SaveStatus status={saveStatus} onSave={onSaveNow} />
      <div style={{ position: "relative" }}>
        <Btn variant="primary" size="md" icon={<Icon.plus size={15} />} onClick={onQuickAdd}>Quick add</Btn>
      </div>
    </div>
  );
}

/* ── Quick add modal ──────────────────────────────────────────── */
function QuickAddModal({ open, onClose, data, addAction, addMeeting, addContact, addSupplierItem }) {
  const [kind, setKind] = useState("action");
  const kinds = [
    { key: "action", label: "Action", icon: Icon.actions },
    { key: "meeting", label: "Meeting", icon: Icon.meetings },
    { key: "contact", label: "Contact", icon: Icon.contacts },
    { key: "supplier", label: "Supplier Item", icon: Icon.suppliers },
  ];
  const [f, setF] = useState({});
  useEffect(() => { if (open) setF({}); }, [open, kind]);
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));

  const submit = () => {
    if (kind === "action") { if (!f.title) return; addAction({ title: f.title, projectId: f.projectId || "", category: f.category || "Design", priority: f.priority || "Medium", dueDate: f.dueDate || "", status: "Open", description: "", contactId: "", notes: "", resourceStage: f.category === "Need Resource" ? "Searching" : "" }); }
    if (kind === "meeting") { if (!f.title) return; addMeeting({ title: f.title, type: f.type || "Client Meeting", projectId: f.projectId || "", date: f.date || todayISO(), time: "", location: "", attendees: "", notes: "", decisions: "", nextMeetingDate: "" }); }
    if (kind === "contact") { if (!f.name) return; addContact({ name: f.name, type: f.type || "Contractor", company: "", phone: "", email: "", category: "", notes: "", tags: [], status: "Active" }); }
    if (kind === "supplier") { if (!f.itemName) return; addSupplierItem({ itemName: f.itemName, projectId: f.projectId || "", category: f.category || "Custom", stage: "Meeting", comments: "", submissionDate: "", installationDate: "", notes: "" }); }
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title="Quick add" width={520}
      footer={<><Btn onClick={onClose}>Cancel</Btn><Btn variant="primary" onClick={submit}>Create</Btn></>}>
      <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
        {kinds.map(k => {
          const Ic = k.icon; const active = kind === k.key;
          return (
            <button key={k.key} onClick={() => setKind(k.key)} style={{
              display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, cursor: "pointer",
              background: active ? C.brassDim : C.surface2, border: `1px solid ${active ? C.brassLine : C.border2}`,
              color: active ? C.brass : C.muted, fontSize: 12.5, fontWeight: 600, fontFamily: FONT,
            }}><Ic size={14} />{k.label}</button>
          );
        })}
      </div>

      {kind === "action" && (<>
        <Field label="Title" required><TInput autoFocus value={f.title || ""} onChange={e => set("title", e.target.value)} placeholder="e.g. Follow up curtains contractor" /></Field>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <Field label="Project"><TSelect value={f.projectId || ""} onChange={e => set("projectId", e.target.value)}><option value="">No project</option>{data.projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</TSelect></Field>
          <Field label="Category"><TSelect value={f.category || "Design"} onChange={e => set("category", e.target.value)}>{ACTION_CATEGORIES.map(c => <option key={c}>{c}</option>)}</TSelect></Field>
          <Field label="Priority"><TSelect value={f.priority || "Medium"} onChange={e => set("priority", e.target.value)}>{ACTION_PRIORITIES.map(p => <option key={p}>{p}</option>)}</TSelect></Field>
          <Field label="Due date"><TInput type="date" value={f.dueDate || ""} onChange={e => set("dueDate", e.target.value)} /></Field>
        </div>
      </>)}

      {kind === "meeting" && (<>
        <Field label="Title" required><TInput autoFocus value={f.title || ""} onChange={e => set("title", e.target.value)} placeholder="e.g. ZED East — client review" /></Field>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <Field label="Type"><TSelect value={f.type || "Client Meeting"} onChange={e => set("type", e.target.value)}>{MEETING_TYPES.map(t => <option key={t}>{t}</option>)}</TSelect></Field>
          <Field label="Project"><TSelect value={f.projectId || ""} onChange={e => set("projectId", e.target.value)}><option value="">No project</option>{data.projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</TSelect></Field>
          <Field label="Date"><TInput type="date" value={f.date || todayISO()} onChange={e => set("date", e.target.value)} /></Field>
        </div>
      </>)}

      {kind === "contact" && (<>
        <Field label="Name" required><TInput autoFocus value={f.name || ""} onChange={e => set("name", e.target.value)} placeholder="e.g. Mahmoud — Electrician" /></Field>
        <Field label="Type"><TSelect value={f.type || "Contractor"} onChange={e => set("type", e.target.value)}>{CONTACT_TYPES.map(t => <option key={t}>{t}</option>)}</TSelect></Field>
      </>)}

      {kind === "supplier" && (<>
        <Field label="Item name" required><TInput autoFocus value={f.itemName || ""} onChange={e => set("itemName", e.target.value)} placeholder="e.g. Living room curtains" /></Field>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <Field label="Project"><TSelect value={f.projectId || ""} onChange={e => set("projectId", e.target.value)}><option value="">No project</option>{data.projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</TSelect></Field>
          <Field label="Category"><TSelect value={f.category || "Custom"} onChange={e => set("category", e.target.value)}>{SUPPLIER_CATEGORIES.map(c => <option key={c}>{c}</option>)}</TSelect></Field>
        </div>
      </>)}
    </Modal>
  );
}

/* ── Dashboard ─────────────────────────────────────────────────── */
function StatChip({ label, value, color }) {
  const isLong = typeof value === "string" && value.length > 8;
  return (
    <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: "16px 18px" }}>
      <div style={{ fontSize: isLong ? 18 : 26, fontWeight: 700, fontFamily: SERIF, color: color || C.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{value}</div>
      <div style={{ fontSize: 12, color: C.muted, marginTop: 4 }}>{label}</div>
    </div>
  );
}

/* Checkbox used across dashboard rows — checking marks the underlying record completed and saves immediately. */
function CheckCircle({ checked, onToggle, color }) {
  const [hover, setHover] = useState(false);
  return (
    <button onClick={(e) => { e.stopPropagation(); onToggle(); }}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      aria-label={checked ? "Mark incomplete" : "Mark complete"}
      style={{
        width: 19, height: 19, borderRadius: "50%", flexShrink: 0, cursor: "pointer", padding: 0,
        border: `1.5px solid ${checked ? (color || C.green) : (hover ? C.brass : C.border3)}`,
        background: checked ? (color || C.green) : "transparent",
        display: "flex", alignItems: "center", justifyContent: "center", transition: "all .12s ease",
      }}>
      {checked && <Icon.check size={11} style={{ color: "#0b0b0c" }} />}
    </button>
  );
}

function ActionRow({ a, project, stage, contact, onOpen, onToggleComplete }) {
  const done = a.status === "Completed";
  return (
    <div onClick={onOpen} style={{ display: "flex", alignItems: "center", gap: 12, padding: "11px 4px", borderBottom: `1px solid ${C.border}`, cursor: "pointer" }}>
      <CheckCircle checked={done} onToggle={() => onToggleComplete(a)} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13.5, color: done ? C.dim : C.text, fontWeight: 500, textDecoration: done ? "line-through" : "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.title}</div>
        <div style={{ fontSize: 11.5, color: C.dim, marginTop: 2 }}>
          {project ? project.name : "No project"}{stage ? ` · ${stage.name}` : ""}{contact ? ` · ${contact.name}` : ""}
        </div>
      </div>
      <Badge color={PRIORITY_COLOR[a.priority]}>{a.priority}</Badge>
      {a.dueDate && <div style={{ fontSize: 11.5, color: C.muted, fontFamily: MONO, minWidth: 64, textAlign: "right" }}>{relDay(a.dueDate)}</div>}
    </div>
  );
}

/* Daily Focus — the first thing seen each morning: quick add + a sorted, checkable task list. */
function DailyFocus({ actions, projectById, contactById, onOpen, onToggleComplete, onQuickAddAction }) {
  const [text, setText] = useState("");
  const submit = () => {
    if (!text.trim()) return;
    onQuickAddAction(text.trim());
    setText("");
  };
  return (
    <Card style={{ marginBottom: 24, borderColor: C.brassLine }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <div style={{ fontSize: 16, fontWeight: 600, fontFamily: SERIF, color: C.brass }}>Daily focus</div>
        <Badge color={C.brass}>{actions.length} open</Badge>
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <TInput value={text} onChange={e => setText(e.target.value)} placeholder="Quick add an action for today..."
          onKeyDown={e => { if (e.key === "Enter") submit(); }} />
        <Btn variant="primary" icon={<Icon.plus size={14} />} onClick={submit}>Add</Btn>
      </div>
      {actions.length === 0 ? (
        <div style={{ padding: "20px 4px", fontSize: 13, color: C.dim }}>Nothing on your plate. Add a task above or enjoy the clear runway.</div>
      ) : (
        <div>
          {actions.slice(0, 12).map(a => (
            <ActionRow key={a.id} a={a} project={projectById[a.projectId]} stage={resolveActionStage(a, projectById)} contact={contactById[a.contactId]} onOpen={() => onOpen(a)} onToggleComplete={onToggleComplete} />
          ))}
        </div>
      )}
    </Card>
  );
}

function DashboardView({ data, derived, openEntity, onQuickAdd, addAction, updateAction, updateMeeting }) {
  const { todaysActions, overdueActions, upcomingMeetings, todaysMeetings, waitingItems, followUps, projectById, contactById, onHoldProjects, dailyFocusActions } = derived;
  const hasAnyData = data.projects.length + data.actions.length + data.meetings.length + data.contacts.length > 0;

  const toggleActionComplete = (a) => updateAction(a.id, { status: a.status === "Completed" ? "Open" : "Completed" });

  const quickAddDailyAction = (title) => addAction({ title, projectId: "", category: "Design", priority: "Medium", dueDate: todayISO(), status: "Open", description: "", contactId: "", notes: "", resourceStage: "" });

  if (!hasAnyData) {
    return (
      <div className="studio-content" style={{ padding: "28px" }}>
        <SectionHead title="Dashboard" subtitle="What do you need to do today?" />
        <EmptyState icon={<Icon.dashboard size={20} />} title="Your studio brain is empty"
          body="Add your first project, then start logging actions, meetings, and suppliers. Nothing here is invented — everything comes from what you enter."
          action={<Btn variant="primary" icon={<Icon.plus size={15} />} onClick={onQuickAdd}>Quick add</Btn>} />

    <div className="studio-content" style={{ padding: "28px", maxWidth: 1180 }}>

        <StatChip label="Overdue" value={overdueActions.length} color={overdueActions.length ? C.red : C.text} />

      </div>

      <div className="responsive-grid-2" style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 20 }}>
        <div>
          <Card style={{ marginBottom: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <div style={{ fontSize: 14.5, fontWeight: 600, color: C.text }}>Today's actions</div>
              <Badge color={C.muted}>{todaysActions.length}</Badge>

              <div style={{ fontSize: 14.5, fontWeight: 600, color: overdueActions.length ? C.red : C.text }}>Delayed items</div>
              <Badge color={overdueActions.length ? C.red : C.muted}>{overdueActions.length}</Badge>

              <div style={{ padding: "24px 4px", fontSize: 13, color: C.dim }}>Nothing overdue. Clean slate.</div>

              <div style={{ padding: "16px 4px", fontSize: 13, color: C.dim }}>No meetings today.</div>

const MONTH_LABEL_FMT = (ym) => {
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("en-GB", { month: "short", year: "numeric" });
};

// Simple hand-rolled SVG bar chart — no external charting library is loaded
// in this single-file app, and a bar chart is all three "Financial Trends"
// series need. Renders income/expense/net as grouped or single bars per month.
function TrendBarChart({ series, mode }) {
  const W = 720, H = 220, PAD_L = 56, PAD_B = 28, PAD_T = 14, PAD_R = 12;
  const plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;

  if (series.length === 0) {
    return <div style={{ padding: "32px 0", textAlign: "center", fontSize: 13, color: C.dim }}>No dated records yet to chart.</div>;
  }

  const isSingleBarMode = mode === "net" || mode === "profit";
  const singleBarKey = mode === "profit" ? "profit" : "net";
  const values = isSingleBarMode ? series.map(s => s[singleBarKey]) : series.flatMap(s => [s.income, s.expenses]);
  const maxAbs = Math.max(1, ...values.map(v => Math.abs(v)));
  const hasNegative = isSingleBarMode && values.some(v => v < 0);
  const zeroY = hasNegative ? PAD_T + plotH / 2 : PAD_T + plotH;
  const scale = (hasNegative ? plotH / 2 : plotH) / maxAbs;

  const bandW = plotW / series.length;
  const barW = isSingleBarMode ? Math.min(28, bandW * 0.5) : Math.min(14, bandW * 0.28);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
      <line x1={PAD_L} y1={zeroY} x2={W - PAD_R} y2={zeroY} stroke={C.border2} strokeWidth="1" />
      {[0.25, 0.5, 0.75, 1].map(f => (
        <line key={f} x1={PAD_L} y1={PAD_T + plotH * (1 - f) * (hasNegative ? 0.5 : 1)} x2={W - PAD_R} y2={PAD_T + plotH * (1 - f) * (hasNegative ? 0.5 : 1)} stroke={C.border} strokeWidth="0.5" />
      ))}
      {series.map((s, i) => {
        const cx = PAD_L + bandW * i + bandW / 2;
        const label = MONTH_LABEL_FMT(s.month);
        if (isSingleBarMode) {
          const value = s[singleBarKey];
          const h = Math.abs(value) * scale;
          const barY = value >= 0 ? zeroY - h : zeroY;
          return (
            <g key={s.month}>
              <rect x={cx - barW / 2} y={barY} width={barW} height={Math.max(1, h)} rx="2" fill={value >= 0 ? C.green : C.red} opacity="0.85" />
              <text x={cx} y={H - 8} fontSize="8.5" fill={C.dim} textAnchor="middle">{label}</text>
            </g>
          );
        }
        const incH = s.income * scale, expH = s.expenses * scale;
        return (
          <g key={s.month}>
            <rect x={cx - barW - 2} y={zeroY - incH} width={barW} height={Math.max(1, incH)} rx="2" fill={C.green} opacity="0.85" />
            <rect x={cx + 2} y={zeroY - expH} width={barW} height={Math.max(1, expH)} rx="2" fill={C.red} opacity="0.85" />
            <text x={cx} y={H - 8} fontSize="8.5" fill={C.dim} textAnchor="middle">{label}</text>
          </g>
        );
      })}
    </svg>
  );
}

const DATE_RANGE_PRESETS = ["Current Month", "Last Month", "Last 3 Months", "Last 6 Months", "Current Year", "Custom Range"];

function resolveDateRange(preset, customFrom, customTo) {
  const now = new Date();
  const startOfMonth = (y, m) => new Date(y, m, 1);
  const endOfMonth = (y, m) => new Date(y, m + 1, 0);
  switch (preset) {
    case "Current Month": return { from: startOfMonth(now.getFullYear(), now.getMonth()), to: endOfMonth(now.getFullYear(), now.getMonth()) };
    case "Last Month": { const d = new Date(now.getFullYear(), now.getMonth() - 1, 1); return { from: startOfMonth(d.getFullYear(), d.getMonth()), to: endOfMonth(d.getFullYear(), d.getMonth()) }; }
    case "Last 3 Months": { const d = new Date(now.getFullYear(), now.getMonth() - 2, 1); return { from: startOfMonth(d.getFullYear(), d.getMonth()), to: endOfMonth(now.getFullYear(), now.getMonth()) }; }
    case "Last 6 Months": { const d = new Date(now.getFullYear(), now.getMonth() - 5, 1); return { from: startOfMonth(d.getFullYear(), d.getMonth()), to: endOfMonth(now.getFullYear(), now.getMonth()) }; }
    case "Current Year": return { from: new Date(now.getFullYear(), 0, 1), to: new Date(now.getFullYear(), 11, 31) };
    case "Custom Range": return { from: customFrom ? toDate(customFrom) : null, to: customTo ? toDate(customTo) : null };
    default: return { from: startOfMonth(now.getFullYear(), now.getMonth()), to: endOfMonth(now.getFullYear(), now.getMonth()) };
  }
}

function FinanceDashboardView({ data, rollup, openEntity }) {
  const [sortKey, setSortKey] = useState("outstanding");
  const [sortDir, setSortDir] = useState("desc");
  const [rangePreset, setRangePreset] = useState("Current Month");
  const [customFrom, setCustomFrom] = useState("");
  const [customTo, setCustomTo] = useState("");
  const [trendMode, setTrendMode] = useState("split");

  const {
    perProject, totalContractValue, totalReceived, totalExpenses, totalOutstanding, studioAvailableBalance,
    categoryBreakdown, monthlySeries, monthlyProfitSeries, outstandingReceivables,
    totalStudioRevenue, totalStudioExpenses, totalStudioProfit,
    totalDesignProfit, totalMarkupProfit, totalUnitPriceRevenue,
    mostProfitableProject, leastProfitableProject, projectRanking,
  } = rollup;

  const hasAnyProjects = data.projects.length > 0;

  const sortedProjects = useMemo(() => {
    const list = perProject.slice();
    const keyFn = {
      outstanding: r => r.outstanding,
      contractValue: r => r.fee,
      received: r => r.received,
      name: r => (r.project.name || "").toLowerCase(),
    }[sortKey];
    list.sort((a, b) => {
      const av = keyFn(a), bv = keyFn(b);
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return list;
  }, [perProject, sortKey, sortDir]);

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir(d => d === "asc" ? "desc" : "asc");
    else { setSortKey(key); setSortDir("desc"); }
  };

  const { from, to } = resolveDateRange(rangePreset, customFrom, customTo);
  const monthIncomeExpense = useMemo(() => {
    let income = 0, expenses = 0;
    perProject.forEach(r => {
      r.payments.forEach(p => { if (p.date && inRange(toDate(p.date), from, to)) income += Number(p.amount) || 0; });
      r.expenses.forEach(e => { if (e.date && inRange(toDate(e.date), from, to)) expenses += Number(e.amount) || 0; });
    });
    return { income, expenses, net: income - expenses };
  }, [perProject, from, to]);

  // A genuinely separate figure from the cash-flow trio above: profit earned
  // within the selected range, priced from Design Revenue and each billable
  // item's Client Price − Cost — never derived from received payments.
  const monthProfit = useMemo(() => {
    let profitValue = 0;
    perProject.forEach(r => {
      (r.project.revenue || []).forEach(rev => {
        if (!rev.date || !inRange(toDate(rev.date), from, to)) return;
        if (rev.revenueType === "Design Fee") {
          const outsourceCost = rev.outsourced ? (Number(rev.outsourceCost) || 0) : 0;
          profitValue += (Number(rev.amount) || 0) - outsourceCost;
        } else if (rev.revenueType === "Other Revenue") {
          profitValue += Number(rev.amount) || 0;
        }
      });
      const legacyUnitPriceItems = (r.project.unitPriceItems || []).map(u => ({ ...u, billingMethod: "Unit Price", billable: u.billable !== false }));
      [...r.expenses, ...legacyUnitPriceItems].forEach(e => {
        if (e.billable === false || !e.date || !inRange(toDate(e.date), from, to)) return;
        profitValue += computeItemBilling(e).itemProfit;
      });
    });
    return profitValue;
  }, [perProject, from, to]);

  if (!hasAnyProjects) {
    return (
      <div className="studio-content" style={{ padding: 28 }}>

function SortableTh({ label, align = "left", active, dir, onClick }) {
  return (
    <th onClick={onClick} style={{ padding: "10px 16px", fontSize: 11, fontWeight: 700, color: active ? C.brass : C.dim, textTransform: "uppercase", letterSpacing: ".04em", textAlign: align, cursor: "pointer", userSelect: "none", whiteSpace: "nowrap" }}>
      {label}{active && <span style={{ marginLeft: 4 }}>{dir === "asc" ? "↑" : "↓"}</span>}
    </th>
  );
}

function inRange(date, from, to) {
  if (!date) return false;
  if (from && date < from) return false;
  if (to && date > to) return false;
  return true;
}

/* ── Actions module ───────────────────────────────────────────────
   Single global action database — data.actions[]. Every action optionally
   belongs to a Project Stage via stageId; projectId is required. The Stage
   dropdown always reflects only the stages that belong to whichever project
   is currently selected, and changing the project clears any stage
   selection that no longer applies — this cascading relationship is the
   same logic used at both the Create and Edit action forms, and again on
   the Stage page's own inline "Add Action" flow, so it can never drift
   between the two entry points. */
function ActionModal({ open, onClose, action, data, save, remove, defaultProjectId, defaultStageId }) {
  const [f, setF] = useState({});
  useEffect(() => {
    if (open) {
      setF(action ? { ...action } : {
        title: "", description: "", projectId: defaultProjectId || "", stageId: defaultStageId || "",
        category: "Design", priority: "Medium", dueDate: "", status: "Open",
        contactId: "", assignedTo: "", notes: "", resourceStage: "",
      });
    }
  }, [open, action]);
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const setStatus = (status) => setF(prev => ({ ...prev, status, completedAt: status === "Completed" ? (prev.completedAt || new Date().toISOString()) : "" }));
  const setProject = (projectId) => {
    // Changing the project invalidates any stage selection that belonged to
    // the old project — a stage can't be "kept" across an unrelated project,
    // so it's cleared rather than left silently pointing at the wrong project.
    setF(prev => ({ ...prev, projectId, stageId: "" }));
  };
  const submit = () => { if (!f.title || !f.projectId) return; save(f); onClose(); };
  const isNeedResource = f.category === "Need Resource";

  // Only stages belonging to the currently-selected project ever appear —
  // this is recomputed on every render from the live project list, so it
  // can never show a stage from the wrong project even if data changes
  // underneath an already-open form.
  const project = data.projects.find(p => p.id === f.projectId);
  const availableStages = (project?.stages || []).slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

  return (
    <Modal open={open} onClose={onClose} title={action ? "Edit action" : "New action"} width={560}
      footer={<>
        {action && <Btn variant="danger" icon={<Icon.trash size={14} />} onClick={() => { remove(action.id); onClose(); }} style={{ marginRight: "auto" }}>Delete</Btn>}
        <Btn onClick={onClose}>Cancel</Btn>
        <Btn variant="primary" onClick={submit} disabled={!f.title || !f.projectId}>{action ? "Save changes" : "Create action"}</Btn>
      </>}>
      <Field label="Title" required><TInput autoFocus value={f.title || ""} onChange={e => set("title", e.target.value)} /></Field>
      <Field label="Description"><TArea value={f.description || ""} onChange={e => set("description", e.target.value)} /></Field>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Project" required hint="Every action must belong to a project.">
          <TSelect value={f.projectId || ""} onChange={e => setProject(e.target.value)}>
            <option value="">Select a project…</option>
            {data.projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
          </TSelect>
        </Field>
        <Field label="Stage" hint={f.projectId ? "Optional, but recommended — links this action to the project's workflow." : "Select a project first"}>
          <TSelect value={f.stageId || ""} onChange={e => set("stageId", e.target.value)} disabled={!f.projectId}>
            <option value="">No stage</option>
            {availableStages.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </TSelect>
        </Field>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Related contact"><TSelect value={f.contactId || ""} onChange={e => set("contactId", e.target.value)}><option value="">None</option>{data.contacts.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</TSelect></Field>
        <Field label="Assigned to"><TInput value={f.assignedTo || ""} onChange={e => set("assignedTo", e.target.value)} placeholder="e.g. Mahmoud" /></Field>
        <Field label="Category"><TSelect value={f.category || "Design"} onChange={e => { set("category", e.target.value); if (e.target.value === "Need Resource" && !f.resourceStage) set("resourceStage", "Searching"); }}>{ACTION_CATEGORIES.map(c => <option key={c}>{c}</option>)}</TSelect></Field>
        <Field label="Priority"><TSelect value={f.priority || "Medium"} onChange={e => set("priority", e.target.value)}>{ACTION_PRIORITIES.map(p => <option key={p}>{p}</option>)}</TSelect></Field>
        <Field label="Status"><TSelect value={f.status || "Open"} onChange={e => setStatus(e.target.value)}>{ACTION_STATUSES.map(s => <option key={s}>{s}</option>)}</TSelect></Field>
        <Field label="Due date"><TInput type="date" value={f.dueDate || ""} onChange={e => set("dueDate", e.target.value)} /></Field>
        {isNeedResource && (
          <Field label="Resource workflow stage" hint="Unrelated to Project Stages — this tracks sourcing progress for a needed resource."><TSelect value={f.resourceStage || "Searching"} onChange={e => set("resourceStage", e.target.value)}>{NEED_RESOURCE_STAGES.map(s => <option key={s}>{s}</option>)}</TSelect></Field>
        )}
      </div>
      <Field label="Notes"><TArea value={f.notes || ""} onChange={e => set("notes", e.target.value)} placeholder="Any extra context..." /></Field>
    </Modal>
  );
}

/* Small helper: given an action, resolve its stage name from the owning
   project's stages[] array — actions only store stageId, never a stage
   name, so this lookup keeps the two always in sync (a renamed stage is
   instantly reflected everywhere an action displays it, with nothing to
   update on the action record itself). */
function resolveActionStage(action, projectById) {
  const project = projectById[action.projectId];
  if (!project || !action.stageId) return null;
  return (project.stages || []).find(s => s.id === action.stageId) || null;
}
