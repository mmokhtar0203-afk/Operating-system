  const done = a.status === "Completed";
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "13px 18px", borderBottom: `1px solid ${C.border}` }}
      onMouseEnter={e => e.currentTarget.style.background = C.surface2} onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
      <CheckCircle checked={done} onToggle={onToggleComplete} />
      <div onClick={onOpen} style={{ flex: 1, minWidth: 0, cursor: "pointer" }}>
        <div style={{ fontSize: 13.5, color: done ? C.dim : C.text, fontWeight: 500, textDecoration: done ? "line-through" : "none" }}>{a.title}</div>
        <div style={{ fontSize: 11.5, color: C.dim, marginTop: 2, display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap" }}>
          <span>{project?.name || "No project"}</span>
          {stage && <><Icon.chevRight size={9} /><span style={{ color: C.brass }}>{stage.name}</span></>}
          {contact ? ` · ${contact.name}` : ""} · {a.category}
        </div>
      </div>
      {a.category === "Need Resource" && a.resourceStage && <Badge color={NEED_RESOURCE_COLOR[a.resourceStage] || C.muted}>{a.resourceStage}</Badge>}
      <Badge color={PRIORITY_COLOR[a.priority]}>{a.priority}</Badge>
      <Badge color={STATUS_COLOR[a.status]}>{a.status}</Badge>
      <div style={{ fontSize: 12, color: C.muted, fontFamily: MONO, minWidth: 78, textAlign: "right" }}>{a.dueDate ? relDay(a.dueDate) : "—"}</div>
    </div>
  );
}

function ActionsView({ data, derived, addAction, updateAction, removeAction }) {
  const [filterStatus, setFilterStatus] = useState("All");
  const [filterProject, setFilterProject] = useState("All");
  const [filterStage, setFilterStage] = useState("All");
  const [filterPriority, setFilterPriority] = useState("All");
  const [dateFilter, setDateFilter] = useState("All"); // All | Due Today | Overdue | Completed
  const [q, setQ] = useState("");
  const [editing, setEditing] = useState(null);
  const [modalOpen, setModalOpen] = useState(false);
  const [defaultProjectId, setDefaultProjectId] = useState("");
  const { projectById, contactById } = derived;

  // Stage filter options are scoped to the selected project — same
  // cascading rule as the create/edit form, applied here to the filter too,
  // since "all stages across every project" would be a meaningless flat list.
  const stageOptions = useMemo(() => {
    if (filterProject === "All") return [];
    const project = projectById[filterProject];
    return (project?.stages || []).slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  }, [filterProject, projectById]);

  const today = TODAY();
  const in7Days = new Date(today); in7Days.setDate(in7Days.getDate() + 7);

  const filtered = useMemo(() => {
    return data.actions.filter(a => {
      if (filterStatus !== "All" && a.status !== filterStatus) return false;
      if (filterProject !== "All" && a.projectId !== filterProject) return false;
      if (filterStage !== "All" && a.stageId !== filterStage) return false;
      if (filterPriority !== "All" && a.priority !== filterPriority) return false;
      if (dateFilter === "Due Today") { if (!a.dueDate || toDate(a.dueDate).toDateString() !== today.toDateString()) return false; }
      if (dateFilter === "Overdue") { if (!a.dueDate || !(toDate(a.dueDate) < today) || ["Completed", "Cancelled"].includes(a.status)) return false; }
      if (dateFilter === "Completed") { if (a.status !== "Completed") return false; }
      if (q.trim() && !a.title.toLowerCase().includes(q.toLowerCase())) return false;
      return true;
    }).sort((a, b) => {
      const ad = a.dueDate ? toDate(a.dueDate).getTime() : Infinity;
      const bd = b.dueDate ? toDate(b.dueDate).getTime() : Infinity;
      return ad - bd;
    });
  }, [data.actions, filterStatus, filterProject, filterStage, filterPriority, dateFilter, q]);

  // ── Dashboard widgets ──
  const todaysActions = useMemo(() => data.actions.filter(a =>
    a.dueDate && toDate(a.dueDate).toDateString() === today.toDateString() && !["Completed", "Cancelled"].includes(a.status)
  ).sort((a, b) => (PRIORITY_ORDER[b.priority] ?? 0) - (PRIORITY_ORDER[a.priority] ?? 0)), [data.actions]);

  const overdueActions = useMemo(() => data.actions.filter(a =>
    a.dueDate && toDate(a.dueDate) < today && !["Completed", "Cancelled"].includes(a.status)
  ), [data.actions]);
  const overdueByProject = useMemo(() => {
    const groups = {};
    overdueActions.forEach(a => {
      const key = a.projectId || "none";
      (groups[key] = groups[key] || []).push(a);
    });
    return Object.entries(groups).map(([projectId, list]) => ({ project: projectById[projectId] || null, actions: list }))
      .sort((a, b) => b.actions.length - a.actions.length);
  }, [overdueActions, projectById]);

  const upcomingActions = useMemo(() => data.actions.filter(a => {
    if (!a.dueDate || ["Completed", "Cancelled"].includes(a.status)) return false;
    const d = toDate(a.dueDate);
    return d >= today && d <= in7Days;
  }).sort((a, b) => toDate(a.dueDate) - toDate(b.dueDate)), [data.actions]);

  const openNew = (projectId) => { setEditing(null); setDefaultProjectId(projectId || ""); setModalOpen(true); };
  const openEdit = (a) => { setEditing(a); setDefaultProjectId(""); setModalOpen(true); };
  const toggleComplete = (a) => {
    const done = a.status === "Completed";
    updateAction(a.id, { status: done ? "Open" : "Completed", completedAt: done ? "" : new Date().toISOString() });
  };

  return (
    <div className="studio-content" style={{ padding: 28, maxWidth: 1180 }}>
      <SectionHead title="Actions" subtitle={`${data.actions.length} total · ${derived.openActionsCount} open — every action across every project and stage`}
        right={<Btn variant="primary" icon={<Icon.plus size={15} />} onClick={() => openNew()}>New action</Btn>} />

      {(todaysActions.length > 0 || overdueActions.length > 0 || upcomingActions.length > 0) && (
        <div className="responsive-grid-3" style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 14, marginBottom: 24 }}>
          <Card>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 10 }}>My Actions Today</div>
            {todaysActions.length === 0 ? <div style={{ fontSize: 12.5, color: C.dim }}>Nothing due today.</div> : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {todaysActions.slice(0, 5).map(a => (
                  <div key={a.id} onClick={() => openEdit(a)} style={{ cursor: "pointer" }}>
                    <div style={{ fontSize: 12.5, color: C.text, fontWeight: 500 }}>{a.title}</div>
                    <div style={{ fontSize: 10.5, color: C.dim, marginTop: 1 }}>{projectById[a.projectId]?.name || "No project"}{resolveActionStage(a, projectById) ? ` · ${resolveActionStage(a, projectById).name}` : ""}</div>
                  </div>
                ))}
              </div>
            )}
          </Card>
          <Card>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 10 }}>Overdue Actions</div>
            {overdueByProject.length === 0 ? <div style={{ fontSize: 12.5, color: C.dim }}>Nothing overdue.</div> : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {overdueByProject.slice(0, 4).map(g => (
                  <div key={g.project?.id || "none"}>
                    <div style={{ fontSize: 11.5, fontWeight: 600, color: C.red }}>{g.project?.name || "No project"} ({g.actions.length})</div>
                    {g.actions.slice(0, 3).map(a => <div key={a.id} onClick={() => openEdit(a)} style={{ fontSize: 12, color: C.muted, cursor: "pointer", marginTop: 2 }}>{a.title}</div>)}
                  </div>
                ))}
              </div>
            )}
          </Card>
          <Card>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 10 }}>Upcoming Actions (7 days)</div>
            {upcomingActions.length === 0 ? <div style={{ fontSize: 12.5, color: C.dim }}>Nothing coming up.</div> : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {upcomingActions.slice(0, 5).map(a => (
                  <div key={a.id} onClick={() => openEdit(a)} style={{ display: "flex", justifyContent: "space-between", gap: 8, cursor: "pointer" }}>
                    <span style={{ fontSize: 12.5, color: C.text }}>{a.title}</span>
                    <span style={{ fontSize: 11, color: C.dim, fontFamily: MONO, whiteSpace: "nowrap" }}>{relDay(a.dueDate)}</span>
                  </div>
                ))}
              </div>
            )}
          </Card>
        </div>
      )}

      <div style={{ display: "flex", gap: 10, marginBottom: 18, flexWrap: "wrap" }}>
        <TInput placeholder="Search actions..." value={q} onChange={e => setQ(e.target.value)} style={{ width: 200 }} />
        <TSelect value={filterProject} onChange={e => { setFilterProject(e.target.value); setFilterStage("All"); }} style={{ width: 170 }}>
          <option value="All">All projects</option>{data.projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
        </TSelect>
        <TSelect value={filterStage} onChange={e => setFilterStage(e.target.value)} style={{ width: 170 }} disabled={filterProject === "All"}>
          <option value="All">{filterProject === "All" ? "All stages" : "All stages in project"}</option>
          {stageOptions.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
        </TSelect>
        <TSelect value={filterPriority} onChange={e => setFilterPriority(e.target.value)} style={{ width: 140 }}>
          <option value="All">All priorities</option>{ACTION_PRIORITIES.map(p => <option key={p}>{p}</option>)}
        </TSelect>
        <TSelect value={filterStatus} onChange={e => setFilterStatus(e.target.value)} style={{ width: 150 }}>
          <option>All</option>{ACTION_STATUSES.map(s => <option key={s}>{s}</option>)}
        </TSelect>
        <TSelect value={dateFilter} onChange={e => setDateFilter(e.target.value)} style={{ width: 150 }}>
          {["All", "Due Today", "Overdue", "Completed"].map(d => <option key={d}>{d}</option>)}
        </TSelect>
      </div>

      {data.actions.length === 0 ? (
        <EmptyState icon={<Icon.actions size={20} />} title="No actions yet"
          body="Actions are the heart of Studio OS — every follow-up, task, and to-do lives here, optionally linked to a project stage."
          action={<Btn variant="primary" icon={<Icon.plus size={15} />} onClick={() => openNew()}>Create your first action</Btn>} />
      ) : filtered.length === 0 ? (
        <EmptyState icon={<Icon.search size={20} />} title="No matches" body="Try adjusting your filters." />
      ) : (
        <Card style={{ padding: 0 }}>
          {filtered.map(a => (
            <ActionListRow key={a.id} a={a} project={projectById[a.projectId]} stage={resolveActionStage(a, projectById)}
              contact={contactById[a.contactId]} onOpen={() => openEdit(a)} onToggleComplete={() => toggleComplete(a)} />
          ))}
        </Card>
      )}

      <ActionModal open={modalOpen} onClose={() => setModalOpen(false)} action={editing} data={data}
        save={(f) => editing ? updateAction(editing.id, f) : addAction(f)} remove={removeAction}
        defaultProjectId={defaultProjectId} />
    </div>
  );
}

/* ── Projects module ──────────────────────────────────────────── */
function ProjectModal({ open, onClose, project, save, remove }) {
  const [f, setF] = useState({});
  useEffect(() => { if (open) setF(project ? { ...project } : { name: "", client: "", status: "Active", startDate: todayISO(), notes: "", fee: "" }); }, [open, project]);
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const submit = () => { if (!f.name) return; save(f); onClose(); };
  return (
    <Modal open={open} onClose={onClose} title={project ? "Edit project" : "New project"} width={520}
      footer={<>
        {project && <Btn variant="danger" icon={<Icon.trash size={14} />} onClick={() => { remove(project.id); onClose(); }} style={{ marginRight: "auto" }}>Delete</Btn>}
        <Btn onClick={onClose}>Cancel</Btn><Btn variant="primary" onClick={submit}>{project ? "Save changes" : "Create project"}</Btn>
      </>}>
      <Field label="Project name" required><TInput autoFocus value={f.name || ""} onChange={e => set("name", e.target.value)} placeholder="e.g. ZED East Residence" /></Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Client"><TInput value={f.client || ""} onChange={e => set("client", e.target.value)} placeholder="e.g. Dr. Ahmed Mokhtar" /></Field>
        <Field label="Status"><TSelect value={f.status || "Active"} onChange={e => set("status", e.target.value)}>{PROJECT_STATUSES.map(s => <option key={s}>{s}</option>)}</TSelect></Field>
        <Field label="Start date"><TInput type="date" value={f.startDate || ""} onChange={e => set("startDate", e.target.value)} /></Field>
        <Field label="Project fee (EGP)" hint="Used on the Finance tab"><TInput type="number" min="0" step="1" value={f.fee ?? ""} onChange={e => set("fee", e.target.value)} placeholder="0" /></Field>
      </div>
      <Field label="Notes"><TArea value={f.notes || ""} onChange={e => set("notes", e.target.value)} /></Field>
    </Modal>

/* Sorts date-string records ascending or descending by a given date key. */
function sortByDate(list, key, dir) {
  return list.slice().sort((a, b) => {
    const ad = a[key] ? toDate(a[key]).getTime() : 0;
    const bd = b[key] ? toDate(b[key]).getTime() : 0;
    return dir === "asc" ? ad - bd : bd - ad;
  });
}

/* ── Client receipt PDF generation (print-to-PDF) ─────────────── */
/* Opens a dedicated print window with a professional A4 layout; the person uses the browser's
   "Save as PDF" print destination. This avoids bundling a PDF library into a single portable file
   and produces genuinely paginated, page-numbered output via standard @page CSS with repeating
   thead/tfoot, which real browsers honor across page breaks when printing. */
/* Draws a professional A4 client receipt PDF via pdf-lib and triggers a download.
   Paginates the table automatically and stamps accurate "Page X of Y" numbers,
   since CSS counter(pages) (used by print-to-PDF) cannot report a true total. */
/* Wraps `text` into lines that each fit within maxWidth at the given font/size.
   Wraps on word boundaries; only breaks a single word if it alone exceeds
   maxWidth (long unbroken strings like URLs), so ordinary text never gets cut. */
function wrapText(font, text, size, maxWidth) {
  const str = String(text ?? "").trim();
  if (!str) return ["—"];
  const words = str.split(/\s+/);
  const lines = [];
  let current = "";
  for (const word of words) {
    const candidate = current ? `${current} ${word}` : word;
    if (font.widthOfTextAtSize(candidate, size) <= maxWidth || !current) {
      // Word itself may still be too wide alone. Prefer breaking at a
      // natural boundary — after a hyphen — over an arbitrary character
      // count, so identifier-style values like "RCP-2026-001" wrap at
      // "RCP-2026-" / "001" instead of splitting mid-digit.
      if (font.widthOfTextAtSize(candidate, size) > maxWidth && !current) {
        const segments = word.split(/(?<=-)/); // keep the hyphen with the preceding chunk
        let chunk = "";
        for (const seg of segments) {
          const test = chunk + seg;
          if (font.widthOfTextAtSize(test, size) > maxWidth && chunk) {
            lines.push(chunk);
            chunk = seg;
          } else {
            chunk = test;
          }
          // A single segment between hyphens can still be too wide on its
          // own (e.g. no hyphens at all) — fall back to character splitting
          // for just that piece, same safety net as before.
          while (font.widthOfTextAtSize(chunk, size) > maxWidth && chunk.length > 1) {
            let sub = "";
            for (const ch of chunk) {
              const t2 = sub + ch;
              if (font.widthOfTextAtSize(t2, size) > maxWidth && sub) { lines.push(sub); sub = ch; }
              else sub = t2;
            }
            chunk = sub;
          }
        }
        current = chunk;
      } else {
        current = candidate;
      }
    } else {
      lines.push(current);
      current = word;
    }
  }
  if (current) lines.push(current);
  return lines.length ? lines : ["—"];
}

/* Generates a professional, fully-readable client receipt PDF: proportional
   column widths, word-wrapped cells with dynamic row height (no truncation,
   no ellipsis), repeated headers across page breaks, and automatic landscape
   orientation when the table is wide or content-heavy. */
/* Generates a professional, fully-readable client receipt PDF: proportional
   column widths with enforced minimums for financial columns, word-wrapped
   description cells with dynamic row height (no truncation, no ellipsis),
   monospace right-aligned monetary figures, a boxed totals summary, repeated
   headers across page breaks, and automatic landscape orientation when the
   table is wide or content-heavy. */
async function generateReceiptPDF({ studioName, logoDataUrl, projectName, clientName, contractType, documentTitle, documentSubtitle, extraMetaLines, columns, rows, summaryRows, statusSection, forceLandscape, filenameBase, filenameSuffix }) {
  if (!window.PDFLib) { alert("PDF engine failed to load. Please check your connection and try again."); return; }
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;

  const pdfDoc = await PDFDocument.create();
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
  // Courier is a true fixed-width font — used for every monetary/numeric cell
  // so digits line up vertically by column even across different values,
  // without needing visible grid lines to enforce that alignment visually.
  const fontMono = await pdfDoc.embedFont(StandardFonts.Courier);
  const fontMonoBold = await pdfDoc.embedFont(StandardFonts.CourierBold);

  // Auto landscape: many columns or a description-heavy table needs the extra
  // horizontal room so wrapped text and financial columns both stay readable.
  // forceLandscape (true/false) overrides the heuristic entirely when the
  // caller knows better — e.g. a 6-column payments statement reads fine in
  // portrait even though 6 columns would normally trigger landscape.
  const useLandscape = typeof forceLandscape === "boolean" ? forceLandscape : (columns.length >= 6 || rows.some(r => String(r.description ?? "").length > 60));
  const PAGE_W = useLandscape ? 841.89 : 595.28;
  const PAGE_H = useLandscape ? 595.28 : 841.89;
  const MARGIN = 50;
  const CONTENT_W = PAGE_W - MARGIN * 2;

  const brass = rgb(0.784, 0.663, 0.431);
  const ink = rgb(0.11, 0.095, 0.075);
  const muted = rgb(0.45, 0.43, 0.39);
  const hairline = rgb(0.85, 0.82, 0.75);
  const rowAlt = rgb(0.98, 0.973, 0.958);
  // Status-card palette, only used when the optional statusSection is passed.
  const green = rgb(0.29, 0.55, 0.36);
  const red = rgb(0.71, 0.29, 0.24);
  const softBg = rgb(0.976, 0.968, 0.95);

  let logoImage = null, logoDims = null;
  if (logoDataUrl) {
    try {
      const isPng = logoDataUrl.startsWith("data:image/png");
      const base64 = logoDataUrl.split(",")[1];
      const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      logoImage = isPng ? await pdfDoc.embedPng(bytes) : await pdfDoc.embedJpg(bytes);
      const scale = 32 / logoImage.height;
      logoDims = { width: logoImage.width * scale, height: 32 };
    } catch (e) { logoImage = null; } // unsupported format — proceed without the logo
  }

  // Column kinds drive formatting: "numeric" cells get right-aligned monospace
  // figures, "percent" cells get centered monospace, everything else is left.
  // Minimum widths (points; 1px ≈ 0.75pt at 96dpi) keep financial columns from
  // ever being crushed by a percentage split on a dense table.
  const MIN_WIDTH_PT = { cost: 90 * 0.75, clientPrice: 110 * 0.75, markup: 70 * 0.75 };
  const colKind = (c) => {
    if (c.kind) return c.kind;
    if (/markup/i.test(c.key) || /markup/i.test(c.label)) return "percent";
    if (/cost|price|total|amount|unitPrice/i.test(c.key)) return "numeric";
    return "text";
  };
  const colMinWidth = (c, kind) => {
    if (c.minWidth) return c.minWidth;
    if (kind === "percent") return MIN_WIDTH_PT.markup;
    if (kind === "numeric" && /clientprice/i.test(c.key)) return MIN_WIDTH_PT.clientPrice;
    if (kind === "numeric") return MIN_WIDTH_PT.cost;
    return 0;
  };
  const kinds = columns.map(colKind);
  const minWidths = columns.map((c, i) => colMinWidth(c, kinds[i]));

  // Start from each column's declared share of content width, then enforce
  // minimums by pulling the shortfall proportionally from flexible (text)
  // columns — so financial columns never shrink below a readable width and
  // the description column absorbs the adjustment instead of overlapping it.
  const hasPct = columns.some(c => c.pct);
  const rawShares = hasPct ? columns.map(c => c.pct || (100 / columns.length)) : columns.map(() => 100 / columns.length);
  const shareTotal = rawShares.reduce((a, b) => a + b, 0);
  let scaledWidths = rawShares.map(s => (s / shareTotal) * CONTENT_W);

  const deficits = scaledWidths.map((w, i) => Math.max(0, minWidths[i] - w));
  const totalDeficit = deficits.reduce((a, b) => a + b, 0);
  if (totalDeficit > 0) {
    const flexIndices = columns.map((c, i) => i).filter(i => kinds[i] === "text" && minWidths[i] === 0);
    const flexTotal = flexIndices.reduce((sum, i) => sum + scaledWidths[i], 0);
    scaledWidths = scaledWidths.map((w, i) => {
      if (deficits[i] > 0) return minWidths[i];
      if (flexIndices.includes(i) && flexTotal > 0) return Math.max(20, w - (totalDeficit * (w / flexTotal)));
      return w;
    });
  }

  const FONT_SIZE = 10; // within the required 9–11pt range, preferred size
  const HEADER_FONT_SIZE = 8.5;
  const LINE_H = 13.5; // line height for wrapped text at FONT_SIZE
  const CELL_GAP_X = 10; // horizontal breathing room instead of a bordered cell edge
  const CELL_PAD_Y = 9;
  const HEADER_H = 24;
  const MIN_ROW_H = 26; // slightly taller than before — whitespace does the separating work
  const WRAP_KEYS = new Set(["description", "category", "paidTo", "notes"]);

  const dateGenerated = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

  const pages = [];
  let page, y;

  const drawPageHeader = (isFirst) => {
    page = pdfDoc.addPage([PAGE_W, PAGE_H]);
    pages.push(page);
    y = PAGE_H - MARGIN;

    if (isFirst) {
      let textX = MARGIN;
      if (logoImage && logoDims) {
        page.drawImage(logoImage, { x: MARGIN, y: y - logoDims.height, width: logoDims.width, height: logoDims.height });
        textX = MARGIN + logoDims.width + 10;
      }
      page.drawText(studioName || "Studio", { x: textX, y: y - 20, size: 16, font: fontBold, color: ink });
      page.drawText("ARCHITECT STUDIO OS", { x: textX, y: y - 33, size: 7.5, font, color: muted });

      const metaLines = [
        `Project: ${projectName || "—"}`,
        `Client: ${clientName || "—"}`,
        `Date generated: ${dateGenerated}`,
        ...(contractType ? [`Contract type: ${contractType}`] : []),
        ...(extraMetaLines || []),
      ];
      metaLines.forEach((line, i) => {
        const w = font.widthOfTextAtSize(line, 9);
        page.drawText(line, { x: PAGE_W - MARGIN - w, y: y - 8 - i * 12, size: 9, font, color: muted });
      });

      y -= 50;
      page.drawLine({ start: { x: MARGIN, y }, end: { x: PAGE_W - MARGIN, y }, thickness: 1.2, color: brass });
      y -= 26;
      page.drawText(documentTitle || "Client Payment Summary", { x: MARGIN, y, size: 15, font: fontBold, color: ink });
      y -= 15;
      page.drawText(documentSubtitle || `${contractType} billing basis`, { x: MARGIN, y, size: 9, font, color: muted });
      y -= 26;
    } else {
      // Continuation pages: slim repeated header so the table resumes quickly.
      page.drawText(`${studioName || "Studio"} — ${projectName || "Project"} (continued)`, { x: MARGIN, y: y - 12, size: 9, font, color: muted });
      y -= 30;
    }

    drawTableHeaderRow();
  };

  // Header uses bold labels with generous column gaps and a single hairline
  // rule underneath — no shaded band, no cell borders, no vertical dividers.
  const drawTableHeaderRow = () => {
    let x = MARGIN;
    columns.forEach((c, i) => {
      const label = c.label.toUpperCase();
      const kind = kinds[i];
      const availableW = scaledWidths[i] - CELL_GAP_X;
      // Headers never wrap (they're one line by design), so if a label is
      // too wide for its column at the default size, shrink it just enough
      // to fit rather than letting it run into the next column — this is
      // the same "never truncate, never overlap" principle body cells get
      // via wrapping, applied to the one-line header instead.
      let headerSize = HEADER_FONT_SIZE;
      let w = fontBold.widthOfTextAtSize(label, headerSize);
      while (w > availableW && headerSize > 6.5) {
        headerSize -= 0.5;
        w = fontBold.widthOfTextAtSize(label, headerSize);
      }
      let tx;
      if (kind === "percent") tx = x + (scaledWidths[i] - w) / 2;
      else if (kind === "numeric") tx = x + scaledWidths[i] - w - CELL_GAP_X / 2;
      else tx = x + (i === 0 ? 0 : CELL_GAP_X / 2);
      page.drawText(label, { x: tx, y: y - HEADER_H + 10, size: headerSize, font: fontBold, color: muted });
      x += scaledWidths[i];
    });
    y -= HEADER_H;
    page.drawLine({ start: { x: MARGIN, y }, end: { x: PAGE_W - MARGIN, y }, thickness: 1, color: ink });
    y -= 6;
  };

  // Pre-compute each row's wrapped lines per column and its resulting height,
  // so nothing is measured against a fixed row height and nothing gets cut.
  // Every "text"-kind column wraps by default — this is always safe (a short
  // value simply never needs a second line), whereas *not* wrapping risks
  // silent overflow for any column whose key wasn't anticipated in advance.
  // Numeric/percent columns never wrap, since a split number would be
  // unreadable and misaligned. A column can opt out via c.noWrap if a
  // caller genuinely wants fixed single-line text (rare).
  const preparedRows = rows.map(r => {
    let maxLines = 1;
    const cellLines = columns.map((c, i) => {
      const raw = r[c.key];
      const availableW = scaledWidths[i] - CELL_GAP_X;
      const kind = kinds[i];
      const shouldWrap = !c.noWrap && (kind === "text" || WRAP_KEYS.has(c.key));
      if (shouldWrap) {
        const lines = wrapText(font, raw, FONT_SIZE, availableW);
        maxLines = Math.max(maxLines, lines.length);
        return lines;
      }
      return [String(raw ?? "—")];
    });
    const rowHeight = Math.max(MIN_ROW_H, maxLines * LINE_H + CELL_PAD_Y);
    return { cellLines, rowHeight };
  });

  drawPageHeader(true);

  preparedRows.forEach((pr, idx) => {
    // Page break: start a fresh page (with repeated header) if this row won't fit.
    if (y - pr.rowHeight < MARGIN + 110) { drawPageHeader(false); }

    // Subtle alternating tint instead of ruled borders — reads as gentle
    // separation, not a spreadsheet grid. Inset slightly from the margins
    // so it feels like a soft wash rather than a hard-edged cell block.
    if (idx % 2 === 0) {
      page.drawRectangle({ x: MARGIN - 6, y: y - pr.rowHeight + 4, width: CONTENT_W + 12, height: pr.rowHeight - 4, color: rowAlt });
    }

    let x = MARGIN;
    const textTopY = y - CELL_PAD_Y - FONT_SIZE * 0.72;
    columns.forEach((c, i) => {
      const lines = pr.cellLines[i];
      const kind = kinds[i];
      const cellFont = kind === "numeric" || kind === "percent" ? fontMono : font;
      lines.forEach((line, li) => {
        const w = cellFont.widthOfTextAtSize(line, FONT_SIZE);
        let tx;
        if (kind === "percent") tx = x + (scaledWidths[i] - w) / 2;
        else if (kind === "numeric") tx = x + scaledWidths[i] - w - CELL_GAP_X / 2;
        else tx = x + (i === 0 ? 0 : CELL_GAP_X / 2);
        page.drawText(line, { x: tx, y: textTopY - li * LINE_H, size: FONT_SIZE, font: cellFont, color: ink });
      });
      x += scaledWidths[i];
    });

    y -= pr.rowHeight;
  });

  if (rows.length === 0) {
    page.drawText("No billable items", { x: MARGIN, y: y - 16, size: FONT_SIZE, font, color: muted });
    y -= MIN_ROW_H;
  }

  // Totals: a clean right-aligned financial summary with typography and
  // spacing doing the work — a single elegant rule above it, no box, no
  // shading, no border. The grand total reads larger and bold as the
  // natural focal point.
  const SUMMARY_ROW_H = 20;
  const SUMMARY_TOTAL_ROW_H = 28;
  const summaryW = 300;
  // Pre-check which rows will need to stack (label + value too wide to sit
  // on one line at this width) so the page-break decision below accounts
  // for the real height, not an underestimate that could overflow the page.
  const summaryRowStacks = summaryRows.map(([label, value, isTotal]) => {
    const size = isTotal ? 13.5 : 10;
    const labelFont = isTotal ? fontBold : font;
    const valueFont = isTotal ? fontMonoBold : fontMono;
    const labelText = isTotal ? label.toUpperCase() : label;
    const labelW = labelFont.widthOfTextAtSize(labelText, size);
    const vw = valueFont.widthOfTextAtSize(value, size);
    return labelW + 12 + vw > summaryW;
  });
  const summaryInnerHeight = summaryRows.reduce((h, [, , isTotal], i) => {
    const rowH = isTotal ? SUMMARY_TOTAL_ROW_H : SUMMARY_ROW_H;
    const stackExtra = summaryRowStacks[i] ? (isTotal ? 13.5 : 10) + 5 : 0;
    return h + rowH + stackExtra;
  }, 0);
  const summaryTopGap = 34; // generous breathing room between the table and the totals

  if (y - summaryTopGap - summaryInnerHeight - 16 < MARGIN) { drawPageHeader(false); }
  y -= summaryTopGap;

  const summaryX = PAGE_W - MARGIN - summaryW;

  page.drawLine({ start: { x: summaryX, y }, end: { x: PAGE_W - MARGIN, y }, thickness: 0.8, color: hairline });
  y -= 20;

  summaryRows.forEach(([label, value, isTotal], i) => {
    const size = isTotal ? 13.5 : 10;
    const labelFont = isTotal ? fontBold : font;
    const valueFont = isTotal ? fontMonoBold : fontMono;
    if (isTotal) y -= 6; // a touch of extra air before the headline figure
    const labelText = isTotal ? label.toUpperCase() : label;
    const vw = valueFont.widthOfTextAtSize(value, size);
    // If the label and value would overlap in the available width, stack the
    // value on its own line below the label instead of letting them collide —
    // the same "never overlap" principle the table cells already follow.
    // Uses the same pre-computed stack decision the page-break estimate above
    // already used, so the two can never disagree.
    page.drawText(labelText, { x: summaryX, y, size, font: labelFont, color: isTotal ? ink : muted });
    if (summaryRowStacks[i]) y -= size + 5;
    page.drawText(value, { x: PAGE_W - MARGIN - vw, y, size, font: valueFont, color: isTotal ? ink : muted });
    y -= isTotal ? SUMMARY_TOTAL_ROW_H : SUMMARY_ROW_H;
  });

  // Optional funding-status card — same soft-background + left-accent-bar
  // design as the Payment Receipt PDF, reused here rather than duplicated so
  // every document that needs a status message renders it identically.
  if (statusSection) {
    const { label: statusLabel, body: statusBody, tone, extraLine } = statusSection;
    const statusColor = tone === "positive" ? green : tone === "negative" ? red : muted;
    const bodyLines = wrapText(font, statusBody, 10, CONTENT_W - 36);
    const boxH = 34 + bodyLines.length * 14.5 + (extraLine ? 20 : 0);

    if (y - 24 - boxH < MARGIN) { drawPageHeader(false); }
    y -= 24;

    page.drawRectangle({ x: MARGIN, y: y - boxH, width: CONTENT_W, height: boxH, color: softBg });
    page.drawRectangle({ x: MARGIN, y: y - boxH, width: 3, height: boxH, color: statusColor });

    let sy = y - 22;
    page.drawText(`Status: ${statusLabel}`, { x: MARGIN + 18, y: sy, size: 12.5, font: fontBold, color: statusColor });
    sy -= 20;
    bodyLines.forEach(line => {
      page.drawText(line, { x: MARGIN + 18, y: sy, size: 10, font, color: ink });
      sy -= 14.5;
    });
    if (extraLine) {
      sy -= 5.5;
      page.drawText(extraLine.label, { x: MARGIN + 18, y: sy, size: 10.5, font: fontBold, color: statusColor });
      const lw = fontBold.widthOfTextAtSize(extraLine.label, 10.5);
      page.drawText(extraLine.value, { x: MARGIN + 18 + lw + 8, y: sy, size: 10.5, font: fontMonoBold, color: statusColor });
    }
    y -= boxH;
  }

  // Footer + accurate page numbering, stamped after every page exists.
  const total = pages.length;
  pages.forEach((p, i) => {
    const label = `${studioName || "Studio"} · Generated by Architect Studio OS`;
    p.drawText(label, { x: MARGIN, y: 26, size: 7.5, font, color: muted });
    const pageLabel = `Page ${i + 1} of ${total}`;
    const pw = font.widthOfTextAtSize(pageLabel, 7.5);
    p.drawText(pageLabel, { x: PAGE_W - MARGIN - pw, y: 26, size: 7.5, font, color: muted });
  });

  const pdfBytes = await pdfDoc.save();
  const blob = new Blob([pdfBytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeProject = (projectName || "project").replace(/[^a-z0-9]+/gi, "-").toLowerCase();
  a.href = url; a.download = `${filenameBase || safeProject}${filenameSuffix !== undefined ? filenameSuffix : "-client-receipt"}.pdf`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Lets the studio add, rename, or remove expense categories for one project.
   The list itself (defaults + customizations) lives on project.expenseCategories,
   so changes here are scoped to this project only. */
function CategoryManagerModal({ open, onClose, categories, onAdd, onRename, onDelete }) {
  const [newName, setNewName] = useState("");
  const [renamingIndex, setRenamingIndex] = useState(null);
  const [renameValue, setRenameValue] = useState("");

  useEffect(() => { if (open) { setNewName(""); setRenamingIndex(null); setRenameValue(""); } }, [open]);

  const submitAdd = () => { if (newName.trim()) { onAdd(newName.trim()); setNewName(""); } };
  const startRename = (idx, current) => { setRenamingIndex(idx); setRenameValue(current); };
  const confirmRename = (oldName) => { if (renameValue.trim()) onRename(oldName, renameValue.trim()); setRenamingIndex(null); };

  return (
    <Modal open={open} onClose={onClose} title="Manage expense categories" width={460}
      footer={<Btn variant="primary" onClick={onClose}>Done</Btn>}>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <TInput autoFocus value={newName} onChange={e => setNewName(e.target.value)} placeholder="New category name"
          onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); submitAdd(); } }} />
        <Btn variant="primary" icon={<Icon.plus size={14} />} onClick={submitAdd}>Add</Btn>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 360, overflowY: "auto" }}>
        {categories.map((c, idx) => (
          <div key={c + idx} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", background: C.surface2, borderRadius: 8, border: `1px solid ${C.border}` }}>
            {renamingIndex === idx ? (
              <>
                <TInput autoFocus value={renameValue} onChange={e => setRenameValue(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); confirmRename(c); } }} style={{ flex: 1 }} />
                <Btn size="sm" variant="primary" onClick={() => confirmRename(c)}>Save</Btn>
                <Btn size="sm" onClick={() => setRenamingIndex(null)}>Cancel</Btn>
              </>
            ) : (
              <>
                <span style={{ flex: 1, fontSize: 13, color: C.text }}>{c}</span>
                <button onClick={() => startRename(idx, c)} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", padding: 4 }}><Icon.edit size={13} /></button>
                <button onClick={() => onDelete(c)} style={{ background: "none", border: "none", color: C.dim, cursor: "pointer", padding: 4 }}><Icon.trash size={13} /></button>
              </>
            )}
          </div>
        ))}
      </div>
    </Modal>
  );
}

function FinanceTab({ project, payments = [], expenses = [], revenue = [], addPayment, editPayment, removePayment, addExpense, editExpense, removeExpense, addRevenue, editRevenue, removeRevenue, updateProject, studioSettings, suppliers, onAddSupplier }) {
  const [paymentModalOpen, setPaymentModalOpen] = useState(false);
  const [editingPayment, setEditingPayment] = useState(null);
  const [expenseModalOpen, setExpenseModalOpen] = useState(false);
  const [editingExpense, setEditingExpense] = useState(null);
  const [revenueModalOpen, setRevenueModalOpen] = useState(false);
  const [editingRevenue, setEditingRevenue] = useState(null);
  const [paymentSort, setPaymentSort] = useState("desc");
  const [expenseSort, setExpenseSort] = useState("desc");
  const [revenueSort, setRevenueSort] = useState("desc");
  const [categoryManagerOpen, setCategoryManagerOpen] = useState(false);
  const [billingMethodFilter, setBillingMethodFilter] = useState("All");

  const fee = Number(project.fee) || 0;
  const supplierById = useMemo(() => Object.fromEntries((suppliers || []).map(s => [s.id, s])), [suppliers]);
  const filteredExpenses = billingMethodFilter === "All" ? expenses : expenses.filter(e => (e.billingMethod || "Cost Plus") === billingMethodFilter);
  const sortedPayments = sortByDate(payments, "date", paymentSort);
  const sortedExpenses = sortByDate(filteredExpenses, "date", expenseSort);
  const sortedRevenue = sortByDate(revenue, "date", revenueSort);

  // Genuinely independent metrics — see the comments above each shared
  // definition. Cash Flow never feeds into Profit; Profit never touches
  // Received Payments; Available Project Balance is its own formula (money
  // received minus what's already been earned/spent against the project),
  // not a recomputation of Cash Flow's Received − Expenses.
  const cashFlow = computeProjectCashFlow({ ...project, payments, expenses });
  const receivables = computeProjectReceivables({ ...project, payments });
  const profit = computeProjectProfit({ ...project, revenue, expenses });
  const availableBalance = computeAvailableProjectBalance({ ...project, payments, expenses, revenue });

  const [generatingStatement, setGeneratingStatement] = useState(false);
  const [statementError, setStatementError] = useState("");

  // Generates ONE consolidated PDF covering every payment on this project —
  // replaces the old per-payment receipt entirely. Any payment that doesn't
  // yet have a receiptNumber gets one assigned here (in date order, so
  // numbering reads sensibly), persisted via editPayment exactly once each;
  // payments that already have a number keep it. Every other figure —
  // Total Received, Available Project Balance, funding status — is
  // recomputed fresh from current project data at generation time.
  const generatePaymentsStatement = async () => {
    setStatementError("");
    setGeneratingStatement(true);
    try {
      const sortedByDateAsc = [...payments].sort((a, b) => (toDate(a.date)?.getTime() ?? 0) - (toDate(b.date)?.getTime() ?? 0));
      // Track receipt numbers assigned during this pass so multiple
      // un-numbered payments in the same year never collide with each
      // other — nextReceiptNumber only sees payments already persisted,
      // so a running project snapshot is threaded through the loop.
      let projectSnapshot = { ...project, payments };
      const withReceiptNumbers = sortedByDateAsc.map(p => {
        if (p.receiptNumber) return p;
        const year = (toDate(p.date) || new Date()).getFullYear();
        const receiptNumber = nextReceiptNumber(projectSnapshot, year);
        editPayment(p.id, { receiptNumber });
        projectSnapshot = { ...projectSnapshot, payments: projectSnapshot.payments.map(pp => pp.id === p.id ? { ...pp, receiptNumber } : pp) };
        return { ...p, receiptNumber };
      });

      const liveBalance = computeAvailableProjectBalance({ ...project, payments, expenses, revenue });
      const balance = liveBalance.availableProjectBalance;
      const isPositive = balance > 0, isZero = balance === 0;
      const statusLabel = isZero ? "Fully Allocated" : (isPositive ? "Sufficient Funding" : "Additional Funding Required");
      const statusBody = isZero
        ? "All received funds have been allocated."
        : (isPositive ? "Current project funding is sufficient for ongoing execution." : "Current project funding is insufficient to continue execution.");

      await generateReceiptPDF({
        studioName: studioSettings?.name || "Studio",
        logoDataUrl: studioSettings?.logoDataUrl || "",
        projectName: project.name,
        clientName: project.client,
        documentTitle: "Project Payments Statement",
        documentSubtitle: "All received payments for this project",
        forceLandscape: false,
        columns: [
          { key: "receiptNumber", label: "Receipt Number", pct: 17, kind: "text" },
          { key: "dateFmt", label: "Date", pct: 15, kind: "text" },
          { key: "amountFmt", label: "Received Amount", align: "right", pct: 15, kind: "numeric" },
          { key: "method", label: "Payment Method", pct: 16, kind: "text" },
          { key: "reference", label: "Reference Number", pct: 15, kind: "text" },
          { key: "notes", label: "Notes", pct: 22, kind: "text" },
        ],
        rows: withReceiptNumbers.map(p => ({
          receiptNumber: p.receiptNumber || "—", dateFmt: fmt(p.date), amountFmt: fmtEGP(p.amount),
          method: p.method || "—", reference: p.reference || "—", notes: p.notes || "—",
        })),
        summaryRows: [
          ["Total Received To Date", fmtEGP(liveBalance.totalReceivedPayments), true],
        ],
        statusSection: {
          tone: isZero ? "neutral" : (isPositive ? "positive" : "negative"),
          label: statusLabel,
          body: statusBody,
          extraLine: balance < 0 ? { label: "Additional Funding Required:", value: fmtEGP(Math.abs(balance)) } : null,
        },
        filenameBase: `${(project.name || "project").replace(/[^a-z0-9]+/gi, "-").toLowerCase()}-payments-statement`,
      });
    } catch (e) {
      setStatementError("Could not generate the payments statement PDF. Please try again.");
    } finally {
      setGeneratingStatement(false);
    }
  };

  // Categories are saved per project: project.expenseCategories holds the full
  // effective list (defaults + any custom additions), so add/edit/delete are
  // scoped to this project only, as required.
  const categories = project.expenseCategories || DEFAULT_EXPENSE_CATEGORIES;
  const setCategories = (next) => updateProject(project.id, { expenseCategories: next });
  const addCategory = (name) => { if (!categories.includes(name)) setCategories([...categories, name]); };
  const renameCategory = (oldName, newName) => {
    if (!newName.trim() || oldName === newName) return;
    setCategories(categories.map(c => c === oldName ? newName : c));
    // Keep existing expenses pointed at the renamed category.
    expenses.filter(e => e.category === oldName).forEach(e => editExpense(e.id, { category: newName }));
  };
  const deleteCategory = (name) => {
    setCategories(categories.filter(c => c !== name));
    // Expenses already using a deleted category keep their value (so nothing
    // silently disappears from the books); it just won't appear as a picker option anymore.
  };

  // Category breakdown: sum of expense amounts per category, recomputed on every render
  // so it always reflects the current expense list with no manual refresh needed.
  const categoryBreakdown = useMemo(() => {
    const totals = {};
    expenses.forEach(e => {
      const cat = e.category || "Other";
      totals[cat] = (totals[cat] || 0) + (Number(e.amount) || 0);
    });
    return Object.entries(totals).sort((a, b) => b[1] - a[1]);
  }, [expenses]);

  return (
    <div>
      {/* Project Summary Cards — six independent figures. Available Project
          Balance and Project Profit look similar but answer different
          questions and are computed from entirely separate formulas; see
          the two dedicated sections below for the full breakdown of each. */}
      <div className="responsive-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12, marginBottom: 12 }}>
        <StatChip label="Contract value" value={fmtEGP(receivables.contractValue)} />
        <StatChip label="Total received" value={fmtEGP(cashFlow.totalReceived)} color={C.green} />
        <StatChip label="Outstanding amount" value={fmtEGP(receivables.outstandingAmount)} color={receivables.outstandingAmount > 0 ? C.yellow : C.text} />
      </div>
      <div className="responsive-grid-3" style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12, marginBottom: 24 }}>
        <StatChip label="Total expenses" value={fmtEGP(cashFlow.totalExpensesPaid)} color={cashFlow.totalExpensesPaid ? C.red : C.text} />
        <StatChip label="Available project balance" value={fmtEGP(availableBalance.availableProjectBalance)} color={availableBalanceColor(availableBalance.availableProjectBalance)} />
        <StatChip label="Project profit" value={fmtEGP(profit.projectProfit)} color={profit.projectProfit < 0 ? C.red : C.brass} />
      </div>

      {/* CASH FLOW — "how much money do I currently have from this project?"
          Received Payments and Expenses Paid remain a straightforward cash
          ledger; the running balance at the bottom of it is now Available
          Project Balance, not the old Received − Expenses figure. */}
      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 12 }}>Cash flow</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <ProfitBreakdownRow label="Received payments" value={cashFlow.totalReceived} />
          <ProfitBreakdownRow label="Expenses paid" value={cashFlow.totalExpensesPaid} subtract />
          <div style={{ borderTop: `1px solid ${C.border2}`, marginTop: 4, paddingTop: 10 }}>
            <ProfitBreakdownRow label="Available project balance" value={availableBalance.availableProjectBalance} bold />
          </div>
        </div>
      </Card>

      {/* AVAILABLE PROJECT BALANCE — the studio's project-funding check:
          does what's been received still cover the design fee earned, the
          actual site costs paid, and the markup already booked? */}
      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 12 }}>Available project balance</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <ProfitBreakdownRow label="Total received payments" value={availableBalance.totalReceivedPayments} />
          <ProfitBreakdownRow label="Design revenue" value={availableBalance.designRevenue} subtract />
          <ProfitBreakdownRow label="Actual expense costs" value={availableBalance.actualExpenseCosts} subtract />
          <ProfitBreakdownRow label="Markup profit" value={availableBalance.markupProfit} subtract />
          <div style={{ borderTop: `1px solid ${C.border2}`, marginTop: 4, paddingTop: 10 }}>
            <ProfitBreakdownRow label="Available project balance" value={availableBalance.availableProjectBalance} bold />
          </div>
        </div>
        {availableBalance.availableProjectBalance < 0 && (
          <div style={{ fontSize: 11.5, color: C.red, marginTop: 10 }}>This project is underfunded by {fmtEGP(Math.abs(availableBalance.availableProjectBalance))} — received payments no longer cover the design fee, site costs, and markup already booked against it.</div>
        )}
      </Card>

      {/* RECEIVABLES — "how much does the client still owe me?" */}
      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 12 }}>Receivables</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <ProfitBreakdownRow label="Contract value" value={receivables.contractValue} />
          <ProfitBreakdownRow label="Total received" value={receivables.totalReceived} />
          <div style={{ borderTop: `1px solid ${C.border2}`, marginTop: 4, paddingTop: 10 }}>
            <ProfitBreakdownRow label="Outstanding amount" value={receivables.outstandingAmount} bold />
          </div>
        </div>
      </Card>

      {/* PROFITABILITY — Selling Price − Actual Cost. Never uses received
          payments; a project's profit does not depend on what's been collected. */}
      <div style={{ fontSize: 15, fontWeight: 600, color: C.text, fontFamily: SERIF, marginBottom: 12 }}>Profitability</div>
      <div className="responsive-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 12, marginBottom: 16 }}>
        <StatChip label="Selling price" value={fmtEGP(profit.sellingPrice)} color={C.green} />
        <StatChip label="Actual cost" value={fmtEGP(profit.actualCost)} color={profit.actualCost ? C.red : C.text} />
        <StatChip label="Project profit" value={fmtEGP(profit.projectProfit)} color={profit.projectProfit < 0 ? C.red : C.brass} />
        <StatChip label="Profit margin" value={`${profit.profitMargin.toFixed(1)}%`} color={profit.profitMargin < 0 ? C.red : C.brass} />
      </div>

      <Card style={{ marginBottom: 24 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 12 }}>Profit breakdown</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <ProfitBreakdownRow label="Design profit" value={profit.designProfit} />
          <ProfitBreakdownRow label="Cost Plus markup profit" value={profit.costPlusProfit} />
          <ProfitBreakdownRow label="Unit Price revenue profit" value={profit.unitPriceProfit} />
          <div style={{ borderTop: `1px solid ${C.border2}`, marginTop: 4, paddingTop: 10 }}>
            <ProfitBreakdownRow label="Total profit" value={profit.projectProfit} bold />
          </div>
        </div>
      </Card>

      {/* Revenue — a table entirely separate from Expenses; Design Fee, Unit
          Price Contract Revenue, and Other Revenue are logged here manually,
          while Cost Plus Markup is always auto-derived from expenses below. */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        <div style={{ fontSize: 15, fontWeight: 600, color: C.text, fontFamily: SERIF }}>Revenue</div>
        <div style={{ display: "flex", gap: 8 }}>
          <Btn size="sm" onClick={() => setRevenueSort(s => s === "desc" ? "asc" : "desc")}>Sort by date {revenueSort === "desc" ? "↓" : "↑"}</Btn>
          <Btn size="sm" variant="primary" icon={<Icon.plus size={14} />} onClick={() => { setEditingRevenue(null); setRevenueModalOpen(true); }}>Add revenue</Btn>
        </div>
      </div>

      <div className="responsive-grid-2" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
        <StatChip label="Total revenue" value={fmtEGP(profit.totalRevenue)} color={C.green} />
        <div />
      </div>

      {sortedRevenue.length === 0 && profit.costPlusMarkupRevenue === 0 ? (
        <Card style={{ marginBottom: 16 }}>
          <EmptyState icon={<Icon.chart size={20} />} title="No revenue recorded yet"
            body="Log Design Fee and Other Revenue here. Cost Plus Markup is calculated automatically once billable expenses have a markup %."
            action={<Btn variant="primary" icon={<Icon.plus size={15} />} onClick={() => { setEditingRevenue(null); setRevenueModalOpen(true); }}>Add your first revenue record</Btn>} />
        </Card>
      ) : (
        <Card className="scroll-table-wrap" style={{ padding: 0, marginBottom: 16, overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                {["Date", "Type", "Description", "Amount", "Notes", ""].map(h => (
                  <th key={h} style={{ textAlign: h === "Amount" ? "right" : "left", padding: "10px 16px", fontSize: 11, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".04em" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {sortedRevenue.map(r => (
                <tr key={r.id} style={{ borderBottom: `1px solid ${C.border}` }}
                  onMouseEnter={e => e.currentTarget.style.background = C.surface2} onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                  <td style={{ padding: "10px 16px", color: C.text, fontFamily: MONO, whiteSpace: "nowrap" }}>{fmt(r.date)}</td>
                  <td style={{ padding: "10px 16px" }}><Badge color={C.brass}>{r.revenueType}</Badge></td>
                  <td style={{ padding: "10px 16px", color: C.text, maxWidth: 220, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.description || "—"}</td>
                  <td style={{ padding: "10px 16px", color: C.green, fontWeight: 600, textAlign: "right", whiteSpace: "nowrap" }}>{fmtEGP(r.amount)}</td>
                  <td style={{ padding: "10px 16px", color: C.muted, maxWidth: 180, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.notes || "—"}</td>
                  <td style={{ padding: "10px 16px", textAlign: "right", whiteSpace: "nowrap" }}>
                    <button onClick={() => { setEditingRevenue(r); setRevenueModalOpen(true); }} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", padding: 4 }}><Icon.edit size={14} /></button>
                    <button onClick={() => removeRevenue(r.id)} style={{ background: "none", border: "none", color: C.dim, cursor: "pointer", padding: 4 }}><Icon.trash size={14} /></button>
                  </td>
                </tr>
              ))}
              {/* Cost Plus Markup is shown as a read-only synthetic row — never
                  editable here since it's fully derived from Expenses' markup %. */}
              {profit.costPlusMarkupRevenue !== 0 && (
                <tr style={{ borderBottom: `1px solid ${C.border}`, background: C.surface2 }}>
                  <td style={{ padding: "10px 16px", color: C.dim, fontFamily: MONO }}>—</td>
                  <td style={{ padding: "10px 16px" }}><Badge color={C.blue}>Cost Plus Markup</Badge></td>
                  <td style={{ padding: "10px 16px", color: C.muted, fontStyle: "italic" }}>Auto-calculated from billable expense markup</td>
                  <td style={{ padding: "10px 16px", color: C.green, fontWeight: 600, textAlign: "right", whiteSpace: "nowrap" }}>{fmtEGP(profit.costPlusMarkupRevenue)}</td>
                  <td style={{ padding: "10px 16px", color: C.dim }}>—</td>
                  <td style={{ padding: "10px 16px" }} />
                </tr>
              )}
            </tbody>
          </table>
        </Card>
      )}

      <Card style={{ marginBottom: 24 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, color: C.text, marginBottom: 12 }}>Revenue by type</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {REVENUE_TYPES.map(t => (
            <div key={t} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13 }}>
              <Badge color={t === "Cost Plus Markup" ? C.blue : C.brass}>{t}</Badge>
              <span style={{ color: C.text, fontFamily: MONO, fontWeight: 600 }}>{fmtEGP(profit.revenueByType[t] || 0)}</span>
            </div>
          ))}
        </div>
      </Card>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
        <div style={{ fontSize: 15, fontWeight: 600, color: C.text, fontFamily: SERIF }}>Received payments</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <Btn size="sm" onClick={() => setPaymentSort(s => s === "desc" ? "asc" : "desc")}>Sort by date {paymentSort === "desc" ? "↓" : "↑"}</Btn>

          <EmptyState icon={<Icon.suppliers size={20} />} title="No payments recorded yet"

              <tr style={{ borderBottom: `1px solid ${C.border}` }}>

                ))}
              </tr>
            </thead>
            <tbody>
              {sortedPayments.map(p => (
                <tr key={p.id} style={{ borderBottom: `1px solid ${C.border}` }}
                  onMouseEnter={e => e.currentTarget.style.background = C.surface2} onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                  <td style={{ padding: "10px 16px", color: C.dim, fontFamily: MONO, whiteSpace: "nowrap" }}>{p.receiptNumber || "—"}</td>
                  <td style={{ padding: "10px 16px", color: C.text, fontFamily: MONO, whiteSpace: "nowrap" }}>{fmt(p.date)}</td>
                  <td style={{ padding: "10px 16px", color: C.green, fontWeight: 600, textAlign: "right", whiteSpace: "nowrap" }}>{fmtEGP(p.amount)}</td>
                  <td style={{ padding: "10px 16px", color: C.text }}><Badge color={C.blue}>{p.method}</Badge></td>
                  <td style={{ padding: "10px 16px", color: C.muted, fontFamily: MONO }}>{p.reference || "—"}</td>
                  <td style={{ padding: "10px 16px", color: C.muted, maxWidth: 200, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.notes || "—"}</td>
                  <td style={{ padding: "10px 16px", textAlign: "right", whiteSpace: "nowrap" }}>
                    <button onClick={() => { setEditingPayment(p); setPaymentModalOpen(true); }} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", padding: 4 }}><Icon.edit size={14} /></button>
                    <button onClick={() => removePayment(p.id)} style={{ background: "none", border: "none", color: C.dim, cursor: "pointer", padding: 4 }}><Icon.trash size={14} /></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </Card>
      )}

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
        <div style={{ fontSize: 15, fontWeight: 600, color: C.text, fontFamily: SERIF }}>Expenses</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <TSelect value={billingMethodFilter} onChange={e => setBillingMethodFilter(e.target.value)} style={{ width: 160 }}>
            <option>All</option>
            {BILLING_METHODS.map(m => <option key={m}>{m}</option>)}
          </TSelect>
          <Btn size="sm" onClick={() => setCategoryManagerOpen(true)}>Manage categories</Btn>
          <Btn size="sm" onClick={() => setExpenseSort(s => s === "desc" ? "asc" : "desc")}>Sort by date {expenseSort === "desc" ? "↓" : "↑"}</Btn>
          <Btn size="sm" variant="primary" icon={<Icon.plus size={14} />} onClick={() => { setEditingExpense(null); setExpenseModalOpen(true); }}>Add expense</Btn>
        </div>
      </div>

      {sortedExpenses.length === 0 ? (
        <Card style={{ marginBottom: 24 }}>
          <EmptyState icon={<Icon.suppliers size={20} />} title={billingMethodFilter === "All" ? "No expenses recorded yet" : `No ${billingMethodFilter} expenses`}
            body="Log project spend — supplier payments, site costs, and anything paid out on this project. Each item can use Cost Plus or Unit Price billing independently."
            action={<Btn variant="primary" icon={<Icon.plus size={15} />} onClick={() => { setEditingExpense(null); setExpenseModalOpen(true); }}>Add your first expense</Btn>} />
        </Card>
      ) : (
        <Card className="scroll-table-wrap" style={{ padding: 0, marginBottom: 24, overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                {["Date", "Description", "Category", "Billing method", "Supplier", "Cost", "Qty × Unit", "Markup % / Unit Price", "Client price", "Profit", "Billable", ""].map(h => (
                  <th key={h} style={{ textAlign: (h === "Cost" || h === "Client price" || h === "Profit" || h === "Qty × Unit" || h === "Markup % / Unit Price") ? "right" : h === "Billable" ? "center" : "left", padding: "10px 16px", fontSize: 11, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".04em", whiteSpace: "nowrap" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {sortedExpenses.map(e => {
                const { isCostPlus, cost, clientPrice, itemProfit } = computeItemBilling(e);
                const markup = Number(e.markupPercent) || 0;
                const quantity = Number(e.quantity) || 0;
                const unitPrice = Number(e.unitPrice) || 0;
                return (
                  <tr key={e.id} style={{ borderBottom: `1px solid ${C.border}` }}
                    onMouseEnter={ev => ev.currentTarget.style.background = C.surface2} onMouseLeave={ev => ev.currentTarget.style.background = "transparent"}>
                    <td style={{ padding: "10px 16px", color: C.text, fontFamily: MONO, whiteSpace: "nowrap" }}>{fmt(e.date)}</td>
                    <td style={{ padding: "10px 16px", color: C.text, maxWidth: 160, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.description || "—"}</td>
                    <td style={{ padding: "10px 16px" }}><Badge color={C.purple}>{e.category || "Other"}</Badge></td>
                    <td style={{ padding: "10px 16px" }}><Badge color={isCostPlus ? C.blue : C.brass}>{e.billingMethod || "Cost Plus"}</Badge></td>
                    <td style={{ padding: "10px 16px", color: C.text, maxWidth: 140, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{(e.supplierId && supplierById[e.supplierId]?.name) || e.paidTo || "—"}</td>
                    <td style={{ padding: "10px 16px", color: C.red, fontWeight: 600, textAlign: "right", whiteSpace: "nowrap" }}>{fmtEGP(cost)}</td>
                    <td style={{ padding: "10px 16px", color: C.muted, textAlign: "right", whiteSpace: "nowrap" }}>{isCostPlus ? "—" : `${quantity} ${e.unit || ""}`.trim()}</td>
                    <td style={{ padding: "10px 16px", color: C.brass, textAlign: "right", whiteSpace: "nowrap" }}>{isCostPlus ? `${markup}%` : fmtEGP(unitPrice)}</td>
                    <td style={{ padding: "10px 16px", color: C.green, fontWeight: 600, textAlign: "right", whiteSpace: "nowrap" }}>{fmtEGP(clientPrice)}</td>
                    <td style={{ padding: "10px 16px", color: itemProfit < 0 ? C.red : C.brass, fontWeight: 600, textAlign: "right", whiteSpace: "nowrap" }}>{fmtEGP(itemProfit)}</td>
                    <td style={{ padding: "10px 16px", textAlign: "center" }}>{e.billable !== false ? <Icon.check size={14} style={{ color: C.green }} /> : <Icon.x size={14} style={{ color: C.dim }} />}</td>
                    <td style={{ padding: "10px 16px", textAlign: "right", whiteSpace: "nowrap" }}>
                      <button onClick={() => { setEditingExpense(e); setExpenseModalOpen(true); }} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", padding: 4 }}><Icon.edit size={14} /></button>
                      <button onClick={() => removeExpense(e.id)} style={{ background: "none", border: "none", color: C.dim, cursor: "pointer", padding: 4 }}><Icon.trash size={14} /></button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Card>
      )}

      {categoryBreakdown.length > 0 && (
        <Card style={{ marginBottom: 28 }}>
          <div style={{ fontSize: 13.5, fontWeight: 600, color: C.text, marginBottom: 12 }}>Category summary</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {categoryBreakdown.map(([cat, total]) => (
              <div key={cat} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13 }}>
                <Badge color={C.purple}>{cat}</Badge>
                <span style={{ color: C.text, fontFamily: MONO, fontWeight: 600 }}>{fmtEGP(total)}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      <PaymentModal open={paymentModalOpen} onClose={() => setPaymentModalOpen(false)} record={editingPayment}
        save={(f) => editingPayment ? editPayment(editingPayment.id, f) : addPayment(f)} remove={removePayment} />
      <ExpenseModal open={expenseModalOpen} onClose={() => setExpenseModalOpen(false)} record={editingExpense}
        save={(f) => editingExpense ? editExpense(editingExpense.id, f) : addExpense(f)} remove={removeExpense}
        categories={categories} onAddCategory={addCategory} suppliers={suppliers} onAddSupplier={onAddSupplier} />
      <RevenueModal open={revenueModalOpen} onClose={() => setRevenueModalOpen(false)} record={editingRevenue}
        save={(f) => editingRevenue ? editRevenue(editingRevenue.id, f) : addRevenue(f)} remove={removeRevenue} />
      <CategoryManagerModal open={categoryManagerOpen} onClose={() => setCategoryManagerOpen(false)}
        categories={categories} onAdd={addCategory} onRename={renameCategory} onDelete={deleteCategory} />

      <ClientBillingSection project={project} expenses={expenses} updateProject={updateProject} studioSettings={studioSettings} />
    </div>
  );
}

function ProfitBreakdownRow({ label, value, bold, subtract }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
      <span style={{ fontSize: bold ? 13.5 : 13, color: bold ? C.text : C.muted, fontWeight: bold ? 700 : 500 }}>{label}</span>
      <span style={{ fontSize: bold ? 14.5 : 13, color: subtract ? C.red : (value < 0 ? C.red : (bold ? C.brass : C.text)), fontFamily: MONO, fontWeight: bold ? 700 : 600 }}>{subtract ? "− " : ""}{fmtEGP(value)}</span>
    </div>
  );
}

/* ── Client Billing (Cost Plus / Unit Price) ──────────────────── */

function ClientBillingSection({ project, expenses, updateProject, studioSettings }) {
  const pid = project.id;
  const [generating, setGenerating] = useState(false);
  const [pdfError, setPdfError] = useState("");

  // Legacy support: projects built before billing method moved per-item may
  // still have a separate project.unitPriceItems[] BOQ table. Fold those in
  // here (read-only merge, never mutated) so nothing from before this change
  // silently disappears — they're tagged Unit Price and treated identically
  // to any expense row using that billing method.
  const legacyUnitPriceItems = project.unitPriceItems || [];
  const legacyRowsAsItems = legacyUnitPriceItems.map(r => ({
    ...r, billingMethod: "Unit Price", billable: r.billable !== false,
    amount: r.actualCost, // legacy field name -> unified "cost" field
  }));
  const allBillableItems = [...expenses, ...legacyRowsAsItems].filter(e => e.billable !== false);

  // One-time migration: convert legacy BOQ rows into real expense records so
  // they become editable through the normal Expenses table (with the same
  // Billing Method field as everything else) instead of staying a permanent,
  // unreachable read-only table.
  const migrateLegacyItems = () => {
    const migrated = legacyUnitPriceItems.map(r => ({
      id: r.id, date: r.date || todayISO(), description: r.description || "",
      category: r.category || "Other", amount: Number(r.actualCost) || 0,
      billingMethod: "Unit Price", quantity: r.quantity, unit: r.unit, unitPrice: r.unitPrice,
      billable: r.billable !== false, notes: r.notes || "",
    }));
    updateProject(pid, { expenses: [...expenses, ...migrated], unitPriceItems: [] });
  };

  // Split by each item's own billing method — a single project can freely
  // mix both, exactly as logged per expense in the Expenses table above.
  const costPlusItems = allBillableItems.filter(e => (e.billingMethod || "Cost Plus") === "Cost Plus").map(e => {
    const { cost, clientPrice, itemProfit } = computeItemBilling(e);
    return { ...e, cost, markup: Number(e.markupPercent) || 0, clientPrice, itemProfit };
  });
  const unitPriceItemsCombined = allBillableItems.filter(e => e.billingMethod === "Unit Price").map(e => {
    const { cost, clientPrice, itemProfit } = computeItemBilling(e);
    return { ...e, cost, quantity: Number(e.quantity) || 0, unitPrice: Number(e.unitPrice) || 0, clientPrice, itemProfit };
  });

  const costPlusTotalCost = costPlusItems.reduce((s, r) => s + r.cost, 0);
  const costPlusTotalClientPrice = costPlusItems.reduce((s, r) => s + r.clientPrice, 0);
  const costPlusTotalMarkupValue = costPlusTotalClientPrice - costPlusTotalCost;

  const unitPriceTotalClientPrice = unitPriceItemsCombined.reduce((s, r) => s + r.clientPrice, 0);
  const unitPriceTotalCost = unitPriceItemsCombined.reduce((s, r) => s + r.cost, 0);
  const unitPriceTotalProfit = unitPriceItemsCombined.reduce((s, r) => s + r.itemProfit, 0);

  const grandClientPrice = costPlusTotalClientPrice + unitPriceTotalClientPrice;

  const runGeneration = async (fn) => {
    setPdfError("");
    setGenerating(true);
    try { await fn(); }
    catch (e) { setPdfError("Could not generate the PDF. Please try again."); }
    finally { setGenerating(false); }
  };

  // One combined PDF: a Cost Plus section (if any items use that method) and
  // a Unit Price section (if any items use that method), each with its own
  // columns per the spec — and Cost is never shown for Unit Price items in
  // the client-facing PDF, only Quantity / Unit / Unit Price / Client Price.
  const generateClientReceiptPDF = () => runGeneration(async () => {
    const sortedCostPlus = [...costPlusItems].sort((a, b) => (toDate(a.date)?.getTime() ?? 0) - (toDate(b.date)?.getTime() ?? 0));
    const sortedUnitPrice = [...unitPriceItemsCombined].sort((a, b) => (toDate(a.date)?.getTime() ?? 0) - (toDate(b.date)?.getTime() ?? 0));

    if (sortedCostPlus.length > 0) {
      await generateReceiptPDF({
        studioName: studioSettings?.name || "Studio",
        logoDataUrl: studioSettings?.logoDataUrl || "",
        projectName: project.name,
        clientName: project.client,
        contractType: "Cost Plus",
        filenameBase: `${(project.name || "project").replace(/[^a-z0-9]+/gi, "-").toLowerCase()}-cost-plus`,
        columns: [
          { key: "description", label: "Description", pct: 45, kind: "text" },
          { key: "dateFmt", label: "Date", pct: 12, kind: "text" },
          { key: "category", label: "Category", pct: 13, kind: "text" },
          { key: "costFmt", label: "Cost", align: "right", pct: 10, kind: "numeric" },
          { key: "markupFmt", label: "Markup %", align: "right", pct: 8, kind: "percent" },
          { key: "clientPriceFmt", label: "Client Price", align: "right", pct: 12, kind: "numeric" },
        ],
        rows: sortedCostPlus.map(r => ({
          description: r.description || r.notes || "—", dateFmt: fmt(r.date), category: r.category || "Other",
          costFmt: fmtEGP(r.cost), markupFmt: `${r.markup}%`, clientPriceFmt: fmtEGP(r.clientPrice),
        })),
        summaryRows: [
          ["Total Cost", fmtEGP(costPlusTotalCost)],
          ["Total Markup Value", fmtEGP(costPlusTotalMarkupValue)],
          ["Total Client Price", fmtEGP(costPlusTotalClientPrice), true],
        ],
      });
    }

    if (sortedUnitPrice.length > 0) {
      // IMPORTANT: internal Cost is never included in these columns — the
      // client sees only Quantity, Unit, Unit Price, and the resulting
      // Client Price, exactly as required for Unit Price items.
      await generateReceiptPDF({
        studioName: studioSettings?.name || "Studio",
        logoDataUrl: studioSettings?.logoDataUrl || "",
        projectName: project.name,
        clientName: project.client,
        contractType: "Unit Price",
        filenameBase: `${(project.name || "project").replace(/[^a-z0-9]+/gi, "-").toLowerCase()}-unit-price`,
        columns: [
          { key: "description", label: "Description", pct: 32, kind: "text" },
          { key: "dateFmt", label: "Date", pct: 12, kind: "text" },
          { key: "category", label: "Category", pct: 13, kind: "text" },
          { key: "quantityFmt", label: "Quantity", align: "right", pct: 11, kind: "numeric" },
          { key: "unit", label: "Unit", pct: 10, kind: "text" },
          { key: "unitPriceFmt", label: "Unit Price", align: "right", pct: 11, kind: "numeric" },
          { key: "clientPriceFmt", label: "Client Price", align: "right", pct: 11, kind: "numeric" },
        ],
        rows: sortedUnitPrice.map(r => ({
          description: r.description || "—", dateFmt: fmt(r.date), category: r.category || "Other",
          quantityFmt: r.quantity || 0, unit: r.unit || "—",
          unitPriceFmt: fmtEGP(r.unitPrice), clientPriceFmt: fmtEGP(r.clientPrice),
        })),
        summaryRows: [
          ["Total Client Price", fmtEGP(unitPriceTotalClientPrice), true],
        ],
      });
    }
  });

  const hasAnyItems = costPlusItems.length > 0 || unitPriceItemsCombined.length > 0;

  return (
    <div style={{ marginTop: 32 }}>
      <div style={{ fontSize: 15, fontWeight: 600, color: C.text, fontFamily: SERIF, marginBottom: 4 }}>Client billing</div>
      <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 16 }}>
        Automatically generated from the Expenses table above — each item bills as Cost Plus or Unit Price according to its own Billing Method, so a single project can freely mix both.
      </div>
