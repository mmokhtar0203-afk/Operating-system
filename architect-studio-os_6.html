/* ── Project Stages UI ─────────────────────────────────────────── */

function StageModal({ open, onClose, stage, stages, save, remove, supplierContacts }) {
  const [f, setF] = useState({});
  useEffect(() => {
    if (open) {
      setF(stage ? { ...stage } : {
        name: "", description: "", color: STAGE_COLORS[0], duration: "", notes: "",
        dependsOn: [], status: "Not Started", locked: false,
        startDate: "", plannedFinishDate: "", actualFinishDate: "",
        assignedTeam: "", assignedSupplierId: "",
      });
    }
  }, [open, stage]);
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const submit = () => { if (!f.name) return; save(f); onClose(); };
  const isLocked = !!f.locked && !!stage; // lock only restricts editing on an *existing* stage

  const otherStages = stages.filter(s => !stage || s.id !== stage.id);
  const toggleDep = (depId) => {
    const current = f.dependsOn || [];
    set("dependsOn", current.includes(depId) ? current.filter(id => id !== depId) : [...current, depId]);
  };

  return (
    <Modal open={open} onClose={onClose} title={stage ? "Edit stage" : "Add stage"} width={620}
      footer={<>
        {stage && !isLocked && <Btn variant="danger" icon={<Icon.trash size={14} />} onClick={() => { remove(stage.id); onClose(); }} style={{ marginRight: "auto" }}>Delete</Btn>}
        <Btn onClick={onClose}>Cancel</Btn>
        <Btn variant="primary" onClick={submit} disabled={isLocked}>{stage ? "Save changes" : "Add stage"}</Btn>
      </>}>
      {isLocked && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", background: C.surface2, border: `1px solid ${C.border2}`, borderRadius: 8, marginBottom: 16, fontSize: 12.5, color: C.muted }}>
          <Icon.lock size={14} style={{ color: C.brass }} /> This stage is locked. Unlock it below to rename, delete, move, or edit its dependencies.
        </div>
      )}
      <Field label="Stage name" required><TInput autoFocus value={f.name || ""} onChange={e => set("name", e.target.value)} disabled={isLocked} placeholder="e.g. Marble Installation" /></Field>
      <Field label="Description"><TArea value={f.description || ""} onChange={e => set("description", e.target.value)} disabled={isLocked} placeholder="What does this stage cover?" /></Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Duration"><TInput value={f.duration || ""} onChange={e => set("duration", e.target.value)} placeholder="e.g. 5 days" /></Field>
        <Field label="Status">
          <TSelect value={f.status || "Not Started"} onChange={e => set("status", e.target.value)}>
            {STAGE_STATUSES.map(s => <option key={s}>{s}</option>)}
          </TSelect>
        </Field>
        <Field label="Start date"><TInput type="date" value={f.startDate || ""} onChange={e => set("startDate", e.target.value)} /></Field>
        <Field label="Planned finish"><TInput type="date" value={f.plannedFinishDate || ""} onChange={e => set("plannedFinishDate", e.target.value)} /></Field>
        <Field label="Actual finish"><TInput type="date" value={f.actualFinishDate || ""} onChange={e => set("actualFinishDate", e.target.value)} /></Field>
        <Field label="Assigned team"><TInput value={f.assignedTeam || ""} onChange={e => set("assignedTeam", e.target.value)} placeholder="e.g. In-house crew" /></Field>
        <Field label="Assigned supplier">
          <TSelect value={f.assignedSupplierId || ""} onChange={e => set("assignedSupplierId", e.target.value)}>
            <option value="">None</option>
            {(supplierContacts || []).map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </TSelect>
        </Field>
        <Field label="Color">
          <div style={{ display: "flex", gap: 6, alignItems: "center", height: 38 }}>
            {STAGE_COLORS.map(c => (
              <button key={c} onClick={() => set("color", c)} style={{ width: 22, height: 22, borderRadius: "50%", background: c, border: f.color === c ? `2px solid ${C.text}` : "2px solid transparent", cursor: "pointer" }} />
            ))}
          </div>
        </Field>
      </div>

      <Field label="Depends on" hint={isLocked ? undefined : "This stage cannot start until every selected stage is Completed."}>
        {otherStages.length === 0 ? (
          <div style={{ fontSize: 12.5, color: C.dim }}>No other stages yet to depend on.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 160, overflowY: "auto", padding: "8px 10px", background: C.surface2, borderRadius: 8, border: `1px solid ${C.border}` }}>
            {otherStages.map(s => (
              <label key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, cursor: isLocked ? "default" : "pointer", fontSize: 13 }}>
                <CheckCircle checked={(f.dependsOn || []).includes(s.id)} onToggle={() => !isLocked && toggleDep(s.id)} color={C.brass} />
                <span style={{ color: C.text }}>{s.name}</span>
              </label>
            ))}
          </div>
        )}
      </Field>

      <Field label="Notes"><TArea value={f.notes || ""} onChange={e => set("notes", e.target.value)} placeholder="Additional notes..." /></Field>

      <Field label="Lock status">
        <label style={{ display: "flex", alignItems: "center", gap: 8, height: 38, cursor: "pointer" }}>
          <CheckCircle checked={!!f.locked} onToggle={() => set("locked", !f.locked)} color={C.brass} />
          <span style={{ fontSize: 13, color: C.text, display: "flex", alignItems: "center", gap: 6 }}>
            {f.locked ? <><Icon.lock size={13} /> Locked — cannot be reordered, deleted, or renamed</> : <><Icon.unlock size={13} /> Unlocked</>}
          </span>
        </label>
      </Field>
    </Modal>
  );
}

function CurrentStageBanner({ graph }) {
  const { currentStage, nextStage, blockedStages } = graph;
  if (!currentStage) {
    return (
      <Card style={{ marginBottom: 20, borderColor: C.brassLine, background: C.brassDim }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <Icon.check size={18} style={{ color: C.green }} />
          <div style={{ fontSize: 14, fontWeight: 600, color: C.text }}>All stages complete or cancelled</div>
        </div>
      </Card>
    );
  }
  const blockedInfo = blockedStages.find(s => s.id === currentStage.id);
  return (
    <Card style={{ marginBottom: 20, borderColor: C.brassLine, background: C.brassDim }}>
      <div className="responsive-grid-3" style={{ display: "grid", gridTemplateColumns: nextStage ? "1fr 1fr 1fr" : "1fr 1fr", gap: 16 }}>
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 6 }}>Current Stage</div>
          <div style={{ fontSize: 16, fontWeight: 600, color: C.text, fontFamily: SERIF }}>{currentStage.name}</div>
          <Badge color={STAGE_STATUS_COLOR[currentStage.effectiveStatus]}>{currentStage.effectiveStatus}</Badge>
        </div>
        {nextStage && (
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 6 }}>Next Stage</div>
            <div style={{ fontSize: 16, fontWeight: 600, color: C.text, fontFamily: SERIF }}>{nextStage.name}</div>
          </div>
        )}
        {blockedInfo && blockedInfo.blockedByName && (
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 6 }}>Blocked By</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: C.yellow }}>{blockedInfo.blockedByName} Completion</div>
          </div>
        )}
      </div>
    </Card>
  );
}

/* The Actions Section required inside every stage — a real, live slice of
   the single global action database (data.actions[] filtered by stageId),
   never a separate/duplicate list. Add/Edit/Delete/Complete all happen
   without leaving the stage screen: this section opens the exact same
   ActionModal used everywhere else in the app (pre-filled with this
   project+stage), so an action created here is indistinguishable from one
   created via the global Actions dashboard — because it's the same record. */
function StageActionsSection({ stageActions, onToggleComplete, onEdit, onAdd }) {
  const sorted = [...stageActions].sort((a, b) => {
    if (!!a.dueDate !== !!b.dueDate) return a.dueDate ? -1 : 1;
    return (a.dueDate ? toDate(a.dueDate).getTime() : 0) - (b.dueDate ? toDate(b.dueDate).getTime() : 0);
  });
  return (
    <div style={{ padding: "4px 14px 14px 42px", borderTop: `1px solid ${C.border}` }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "10px 0 8px" }}>
        <div style={{ fontSize: 11.5, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em" }}>Actions</div>
        <Btn size="sm" icon={<Icon.plus size={13} />} onClick={onAdd}>Add action</Btn>
      </div>
      {sorted.length === 0 ? (
        <div style={{ fontSize: 12.5, color: C.dim, padding: "6px 0" }}>No actions linked to this stage yet.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          {sorted.map(a => {
            const done = a.status === "Completed";
            return (
              <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 4px" }}>
                <CheckCircle checked={done} onToggle={() => onToggleComplete(a)} color={C.brass} />
                <span onClick={() => onEdit(a)} style={{ flex: 1, fontSize: 13, color: done ? C.dim : C.text, textDecoration: done ? "line-through" : "none", cursor: "pointer" }}>{a.title}</span>
                <Badge color={PRIORITY_COLOR[a.priority]}>{a.priority}</Badge>
                <Badge color={STATUS_COLOR[a.status]}>{a.status}</Badge>
                <span style={{ fontSize: 11.5, color: C.muted, fontFamily: MONO, minWidth: 60, textAlign: "right" }}>{a.dueDate ? relDay(a.dueDate) : "—"}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function StageRow({ stage, index, graph, stageActions, onEdit, onDelete, onToggleLock, onDuplicate, onDragStart, onDragOver, onDrop, isDragging, expanded, onToggleExpand, onToggleActionComplete, onEditAction, onAddAction }) {
  const overdueInfo = graph.overdue.find(o => o.id === stage.id);
  const actionProgress = stage.actionProgress;
  return (
    <div style={{ marginBottom: 6, background: isDragging ? C.surface3 : C.surface, border: `1px solid ${C.border}`, borderLeft: `3px solid ${stage.color || C.brass}`, borderRadius: 8, opacity: isDragging ? 0.5 : 1 }}>
      <div
        draggable={!stage.locked}
        onDragStart={() => onDragStart(stage.id)}
        onDragOver={(e) => { e.preventDefault(); onDragOver(index); }}
        onDrop={(e) => { e.preventDefault(); onDrop(index); }}
        style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", cursor: stage.locked ? "default" : "grab" }}>
        <span style={{ color: stage.locked ? C.dim : C.muted, display: "flex", cursor: stage.locked ? "not-allowed" : "grab" }}><Icon.grip size={14} /></span>
        <button onClick={onToggleExpand} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", padding: 2, display: "flex" }}>
          <Icon.chevRight size={14} style={{ transform: expanded ? "rotate(90deg)" : "none", transition: "transform .15s ease" }} />
        </button>
        <div style={{ flex: 1, minWidth: 0, cursor: "pointer" }} onClick={onToggleExpand}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ fontSize: 14, fontWeight: 600, color: C.text }}>{stage.name}</span>
            {stage.locked && <Icon.lock size={12} style={{ color: C.brass }} />}
            <Badge color={STAGE_STATUS_COLOR[stage.effectiveStatus]}>{stage.effectiveStatus}</Badge>
            {actionProgress && actionProgress.totalActions > 0 && (
              <span style={{ fontSize: 11, color: C.dim, fontFamily: MONO }}>{actionProgress.completedActions}/{actionProgress.totalActions} actions ({actionProgress.pct}%)</span>
            )}
            {overdueInfo && (
              <span style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, color: C.red, fontWeight: 600 }}>
                <Icon.alert size={12} /> Overdue by {overdueInfo.overdueDays} day{overdueInfo.overdueDays === 1 ? "" : "s"}
              </span>
            )}
          </div>
          {stage.plannedFinishDate && <div style={{ fontSize: 11.5, color: C.dim, marginTop: 3 }}>Planned finish: {fmt(stage.plannedFinishDate)}</div>}
        </div>
        <button onClick={() => onToggleLock(stage)} title={stage.locked ? "Unlock stage" : "Lock stage"} style={{ background: "none", border: "none", color: stage.locked ? C.brass : C.muted, cursor: "pointer", padding: 4 }}>
          {stage.locked ? <Icon.lock size={15} /> : <Icon.unlock size={15} />}
        </button>
        <button onClick={() => onDuplicate(stage.id)} title="Duplicate stage" style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", padding: 4 }}><Icon.copy size={14} /></button>
        <button onClick={() => onEdit(stage)} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", padding: 4 }}><Icon.edit size={14} /></button>
        <button onClick={() => !stage.locked && onDelete(stage.id)} disabled={stage.locked} style={{ background: "none", border: "none", color: stage.locked ? C.dim : C.dim, cursor: stage.locked ? "not-allowed" : "pointer", padding: 4, opacity: stage.locked ? 0.4 : 1 }}><Icon.trash size={14} /></button>
      </div>
      {expanded && (
        <StageActionsSection stageActions={stageActions}
          onToggleComplete={onToggleActionComplete} onEdit={onEditAction} onAdd={onAddAction} />
      )}
    </div>
  );
}

function StagesTab({ stages, addStage, editStage, removeStage, reorderStage, cloneStage, applyStageTemplate, supplierContacts, projectId, projectActions, data, addAction, updateAction, removeAction }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [draggingId, setDraggingId] = useState(null);
  const [dragOverIndex, setDragOverIndex] = useState(null);
  const [expandedStageId, setExpandedStageId] = useState(null);
  const [actionModalOpen, setActionModalOpen] = useState(false);
  const [editingAction, setEditingAction] = useState(null);
  const [actionModalStageId, setActionModalStageId] = useState("");

  const graph = useMemo(() => computeStageGraph(stages, projectActions), [stages, projectActions]);
  const actionsByStage = useMemo(() => {
    const map = {};
    projectActions.forEach(a => { if (a.stageId) { (map[a.stageId] = map[a.stageId] || []).push(a); } });
    return map;
  }, [projectActions]);

  const handleDrop = (toIndex) => {
    if (draggingId) reorderStage(draggingId, toIndex);
    setDraggingId(null);
    setDragOverIndex(null);
  };

  const handleToggleLock = (stage) => editStage(stage.id, { locked: !stage.locked });
  const openAddActionForStage = (stageId) => { setEditingAction(null); setActionModalStageId(stageId); setActionModalOpen(true); };
  const openEditAction = (action) => { setEditingAction(action); setActionModalStageId(action.stageId || ""); setActionModalOpen(true); };
  const toggleActionComplete = (action) => {
    const done = action.status === "Completed";
    updateAction(action.id, { status: done ? "Open" : "Completed", completedAt: done ? "" : new Date().toISOString() });
  };

  const actionModal = (
    <ActionModal open={actionModalOpen} onClose={() => setActionModalOpen(false)} action={editingAction} data={data}
      save={(f) => editingAction ? updateAction(editingAction.id, f) : addAction(f)} remove={removeAction}
      defaultProjectId={projectId} defaultStageId={actionModalStageId} />
  );

  if (stages.length === 0) {
    return (
      <div>
        <EmptyState icon={<Icon.timeline size={20} />} title="No stages yet"
          body="Start from the default finishing template, or build a custom workflow from scratch — either way, stages gate on their dependencies automatically."
          action={
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "center" }}>
              <Btn variant="primary" icon={<Icon.plus size={15} />} onClick={() => applyStageTemplate(DEFAULT_FINISHING_TEMPLATE)}>Use default finishing template</Btn>
              <Btn icon={<Icon.plus size={15} />} onClick={() => { setEditing(null); setModalOpen(true); }}>Add a custom stage</Btn>
            </div>
          } />
        <StageModal open={modalOpen} onClose={() => setModalOpen(false)} stage={editing} stages={stages}
          save={(f) => editing ? editStage(editing.id, f) : addStage(f)} remove={removeStage} supplierContacts={supplierContacts} />
      </div>
    );
  }

  return (
    <div>
      <CurrentStageBanner graph={graph} />

      <div className="responsive-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 12, marginBottom: 20 }}>
        <StatChip label="Progress" value={`${graph.progressPct}%`} color={C.brass} />
        <StatChip label="Completed stages" value={graph.completed.length} color={C.green} />
        <StatChip label="Remaining stages" value={graph.remaining} />
        <StatChip label="Overdue stages" value={graph.overdue.length} color={graph.overdue.length ? C.red : C.text} />
      </div>

      <div style={{ height: 8, background: C.surface2, borderRadius: 4, overflow: "hidden", marginBottom: 24 }}>
        <div style={{ height: "100%", width: `${graph.progressPct}%`, background: C.brass, borderRadius: 4, transition: "width .3s ease" }} />
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
        <div style={{ fontSize: 15, fontWeight: 600, color: C.text, fontFamily: SERIF }}>Stages</div>
        <Btn size="sm" variant="primary" icon={<Icon.plus size={14} />} onClick={() => { setEditing(null); setModalOpen(true); }}>Add stage</Btn>
      </div>

      <div>
        {graph.stages.map((s, i) => (
          <StageRow key={s.id} stage={s} index={i} graph={graph} stageActions={actionsByStage[s.id] || []}
            onEdit={(st) => { setEditing(st); setModalOpen(true); }}
            onDelete={removeStage} onToggleLock={handleToggleLock} onDuplicate={cloneStage}
            onDragStart={setDraggingId} onDragOver={setDragOverIndex} onDrop={handleDrop}
            isDragging={draggingId === s.id}
            expanded={expandedStageId === s.id} onToggleExpand={() => setExpandedStageId(prev => prev === s.id ? null : s.id)}
            onToggleActionComplete={toggleActionComplete} onEditAction={openEditAction}
            onAddAction={() => openAddActionForStage(s.id)} />
        ))}
      </div>

      <StageModal open={modalOpen} onClose={() => setModalOpen(false)} stage={editing} stages={stages}
        save={(f) => editing ? editStage(editing.id, f) : addStage(f)} remove={removeStage} supplierContacts={supplierContacts} />
      {actionModal}
    </div>
  );
}

function ProjectDetail({ project, data, derived, back, editProject, addAction, updateAction, removeAction, updateMeeting, updateProject, addNote, openEntity, studioSettings, onAddSupplier }) {
  const [tab, setTab] = useState("Overview");
  const pid = project.id;
  const actions = data.actions.filter(a => a.projectId === pid);
  const meetings = data.meetings.filter(m => m.projectId === pid);
  const suppliers = data.supplierItems.filter(s => s.projectId === pid);
  // Supplier Database contacts (type: "Supplier") — distinct from the
  // Procurement tab's `suppliers` above, which tracks BOQ-style items, not
  // vendor records. This feeds the Expense form's Supplier dropdown.
  const supplierContacts = data.contacts.filter(c => c.type === "Supplier");
  const notes = data.notes.filter(n => n.projectId === pid);
  const openActions = actions.filter(a => !["Completed", "Cancelled"].includes(a.status));
  const overdue = actions.filter(a => a.dueDate && toDate(a.dueDate) < TODAY() && !["Completed", "Cancelled"].includes(a.status));

  const payments = project.payments || [];
  const expenses = project.expenses || [];
  const revenue = project.revenue || [];

  const addPayment = (record) => updateProject(pid, { payments: [...payments, { id: uid(), ...record }] });
  const editPayment = (id, patch) => updateProject(pid, { payments: payments.map(p => p.id === id ? { ...p, ...patch } : p) });
  const removePayment = (id) => updateProject(pid, { payments: payments.filter(p => p.id !== id) });

  const addExpense = (record) => updateProject(pid, { expenses: [...expenses, { id: uid(), ...record }] });
  const editExpense = (id, patch) => updateProject(pid, { expenses: expenses.map(e => e.id === id ? { ...e, ...patch } : e) });
  const removeExpense = (id) => updateProject(pid, { expenses: expenses.filter(e => e.id !== id) });

  // Revenue lives in its own array — project.revenue — entirely separate from
  // expenses, satisfying "Revenue and Expenses must never be stored in the same table."
  const addRevenue = (record) => updateProject(pid, { revenue: [...revenue, { id: uid(), ...record }] });
  const editRevenue = (id, patch) => updateProject(pid, { revenue: revenue.map(r => r.id === id ? { ...r, ...patch } : r) });
  const removeRevenue = (id) => updateProject(pid, { revenue: revenue.filter(r => r.id !== id) });

  // Project Stages — a dependency-graph workflow engine (see the shared
  // functions above: isStageSatisfied, computeStageGraph, etc.). Stages live
  // on the project itself, same storage pattern as payments/expenses/revenue,
  // so they're automatically included in backup/restore and import/export.
  const stages = project.stages || [];
  const addStage = (record) => updateProject(pid, { stages: [...stages, { id: uid(), order: stages.length, dependsOn: [], status: "Not Started", locked: false, attachments: [], photos: [], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), ...record }] });
  const editStage = (id, patch) => updateProject(pid, { stages: stages.map(s => s.id === id ? { ...s, ...patch, updatedAt: new Date().toISOString() } : s) });
  const removeStage = (id) => updateProject(pid, { stages: removeStageSafely(stages, id) });
  const reorderStage = (fromId, toIndex) => updateProject(pid, { stages: reorderStagesSafely(stages, fromId, toIndex) });
  const cloneStage = (id) => updateProject(pid, { stages: duplicateStage(stages, id) });
  const applyStageTemplate = (template) => updateProject(pid, { stages: [...stages, ...instantiateStageTemplate(template)] });
  // Used by the Project Stage Summary widget on the Overview tab.
  const stageGraph = useMemo(() => computeStageGraph(stages, actions), [stages, actions]);

  const timelineEvents = useMemo(() => {
    const ev = [];
    actions.forEach(a => ev.push({ date: a.dueDate || a.createdAt, kind: "Action", title: a.title, sub: a.status }));
    meetings.forEach(m => ev.push({ date: m.date, kind: "Meeting", title: m.title || m.type, sub: m.type }));
    suppliers.forEach(s => ev.push({ date: s.updatedAt?.slice(0, 10) || s.submissionDate, kind: "Supplier", title: s.itemName, sub: s.stage }));
    notes.forEach(n => ev.push({ date: n.createdAt?.slice(0, 10), kind: "Note", title: n.text?.slice(0, 60), sub: "" }));
    return ev.filter(e => e.date).sort((a, b) => toDate(b.date) - toDate(a.date));
  }, [actions, meetings, suppliers, notes]);

  const kindColor = { Action: C.blue, Meeting: C.brass, Supplier: C.purple, Note: C.muted };

  return (
    <div className="studio-content" style={{ padding: 28, maxWidth: 1180 }}>
      <button onClick={back} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: C.muted, fontSize: 12.5, cursor: "pointer", marginBottom: 14, padding: 0 }}>
        <Icon.chevRight size={13} style={{ transform: "rotate(180deg)" }} /> All projects
      </button>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
        <div>
          <div style={{ fontSize: 26, fontWeight: 600, fontFamily: SERIF, color: C.text }}>{project.name}</div>
          <div style={{ fontSize: 13, color: C.muted, marginTop: 4 }}>{project.client || "No client set"} · Started {fmt(project.startDate)}</div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <Badge color={project.status === "Active" ? C.green : project.status === "On Hold" ? C.purple : C.muted} size="md">{project.status}</Badge>
          <Btn icon={<Icon.edit size={14} />} onClick={() => editProject(project)}>Edit</Btn>
        </div>
      </div>

      <div style={{ display: "flex", gap: 4, borderBottom: `1px solid ${C.border}`, margin: "22px 0 0", overflowX: "auto" }}>
        {PROJECT_TABS.map(t => (
          <button key={t} onClick={() => setTab(t)} style={{
            padding: "10px 14px", background: "none", border: "none", borderBottom: `2px solid ${tab === t ? C.brass : "transparent"}`,
            color: tab === t ? C.brass : C.muted, fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: FONT, whiteSpace: "nowrap",
          }}>{t}</button>
        ))}
      </div>

      <div style={{ paddingTop: 22 }}>
        {tab === "Overview" && (
          <div>
            {stages.length > 0 && (
              <Card style={{ marginBottom: 20, borderColor: C.brassLine, background: C.brassDim }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 12 }}>Project Stage Summary</div>
                <div className="responsive-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 14 }}>
                  <div>
                    <div style={{ fontSize: 10.5, color: C.dim, marginBottom: 3 }}>CURRENT STAGE</div>
                    <div style={{ fontSize: 13.5, fontWeight: 600, color: C.text }}>{stageGraph.currentStage ? stageGraph.currentStage.name : "—"}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 10.5, color: C.dim, marginBottom: 3 }}>NEXT STAGE</div>
                    <div style={{ fontSize: 13.5, fontWeight: 600, color: C.text }}>{stageGraph.nextStage ? stageGraph.nextStage.name : "—"}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 10.5, color: C.dim, marginBottom: 3 }}>BLOCKED STAGES</div>
                    <div style={{ fontSize: 13.5, fontWeight: 600, color: stageGraph.blockedStages.length ? C.yellow : C.text }}>{stageGraph.blockedStages.length}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 10.5, color: C.dim, marginBottom: 3 }}>PROGRESS</div>
                    <div style={{ fontSize: 13.5, fontWeight: 600, color: C.brass }}>{stageGraph.progressPct}%</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 10.5, color: C.dim, marginBottom: 3 }}>COMPLETED STAGES</div>
                    <div style={{ fontSize: 13.5, fontWeight: 600, color: C.green }}>{stageGraph.completed.length}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 10.5, color: C.dim, marginBottom: 3 }}>REMAINING STAGES</div>
                    <div style={{ fontSize: 13.5, fontWeight: 600, color: C.text }}>{stageGraph.remaining}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 10.5, color: C.dim, marginBottom: 3 }}>OVERDUE STAGES</div>
                    <div style={{ fontSize: 13.5, fontWeight: 600, color: stageGraph.overdue.length ? C.red : C.text }}>{stageGraph.overdue.length}</div>
                  </div>
                </div>
              </Card>
            )}
            <div className="responsive-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 12, marginBottom: 20 }}>
              <StatChip label="Open actions" value={openActions.length} />
              <StatChip label="Overdue" value={overdue.length} color={overdue.length ? C.red : C.text} />
              <StatChip label="Meetings" value={meetings.length} />
              <StatChip label="Supplier items" value={suppliers.length} />
              {project.notes && (
                <div style={{ gridColumn: "1 / -1", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18, fontSize: 13.5, color: C.text, lineHeight: 1.6 }}>{project.notes}</div>
              )}
            </div>
          </div>
        )}

        {tab === "Actions" && (actions.length === 0 ? <EmptyState icon={<Icon.actions size={20} />} title="No actions on this project" /> : (
          <Card style={{ padding: 0 }}>
            {actions.map(a => {
              const done = a.status === "Completed";
              return (
                <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 18px", borderBottom: `1px solid ${C.border}` }}>
                  <CheckCircle checked={done} onToggle={() => updateAction(a.id, { status: done ? "Open" : "Completed" })} />
                  <div style={{ flex: 1, fontSize: 13.5, color: done ? C.dim : C.text, textDecoration: done ? "line-through" : "none" }}>{a.title}</div>
                  <Badge color={STATUS_COLOR[a.status]}>{a.status}</Badge>
                  <div style={{ fontSize: 12, color: C.muted, fontFamily: MONO, minWidth: 70, textAlign: "right" }}>{a.dueDate ? relDay(a.dueDate) : "—"}</div>
                </div>
              );
            })}
          </Card>
        ))}

        {tab === "Meetings" && (meetings.length === 0 ? <EmptyState icon={<Icon.meetings size={20} />} title="No meetings logged" /> : (
          <Card style={{ padding: 0 }}>
            {meetings.map(m => (
              <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 18px", borderBottom: `1px solid ${C.border}` }}>
                <CheckCircle checked={!!m.completed} onToggle={() => updateMeeting(m.id, { completed: !m.completed })} color={C.brass} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13.5, color: m.completed ? C.dim : C.text, fontWeight: 500, textDecoration: m.completed ? "line-through" : "none" }}>{m.title || m.type}</div>
                  <Badge color={C.brass}>{m.type}</Badge>
                </div>
                <div style={{ fontSize: 12, color: C.muted, fontFamily: MONO }}>{fmt(m.date)}</div>
              </div>
            ))}
          </Card>
        ))}

        {tab === "Stages" && (
          <StagesTab stages={stages} addStage={addStage} editStage={editStage} removeStage={removeStage}
            reorderStage={reorderStage} cloneStage={cloneStage} applyStageTemplate={applyStageTemplate}
            supplierContacts={supplierContacts} projectId={pid} projectActions={actions} data={data}
            addAction={addAction} updateAction={updateAction} removeAction={removeAction} />
        )}

        {tab === "Finance" && (
          <FinanceTab project={project} payments={payments} expenses={expenses} revenue={revenue}
            addPayment={addPayment} editPayment={editPayment} removePayment={removePayment}
            addExpense={addExpense} editExpense={editExpense} removeExpense={removeExpense}
            addRevenue={addRevenue} editRevenue={editRevenue} removeRevenue={removeRevenue}
            updateProject={updateProject} studioSettings={studioSettings}
            suppliers={supplierContacts} onAddSupplier={onAddSupplier} />
        )}

        {tab === "Suppliers" && (suppliers.length === 0 ? <EmptyState icon={<Icon.suppliers size={20} />} title="No supplier items tracked" /> : (
          <Card style={{ padding: 0 }}>
            {suppliers.map(s => (
              <div key={s.id} style={{ padding: "12px 18px", borderBottom: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ fontSize: 13.5, color: C.text }}>{s.itemName}</div>
                <Badge color={C.purple}>{s.stage}</Badge>
              </div>
            ))}
          </Card>
        ))}

        {tab === "Contacts" && (
          <EmptyState icon={<Icon.contacts size={20} />} title="Linked contacts appear via actions and meetings" body="Assign a contact when creating an action or supplier item on this project." />
        )}

        {tab === "Notes" && (
          <NotesPanel notes={notes} onAdd={(text) => addNote({ projectId: pid, text })} />
        )}

        {tab === "Timeline" && (timelineEvents.length === 0 ? <EmptyState icon={<Icon.timeline size={20} />} title="No activity yet" /> : (
          <div style={{ position: "relative", paddingLeft: 20 }}>
            <div style={{ position: "absolute", left: 5, top: 6, bottom: 6, width: 1, background: C.border2 }} />
            {timelineEvents.map((e, i) => (
              <div key={i} style={{ position: "relative", paddingBottom: 18 }}>
                <div style={{ position: "absolute", left: -20, top: 3, width: 9, height: 9, borderRadius: "50%", background: kindColor[e.kind] || C.muted, border: `2px solid ${C.bg}` }} />
                <div style={{ fontSize: 11.5, color: C.dim, fontFamily: MONO }}>{fmt(e.date)}</div>
                <div style={{ fontSize: 13.5, color: C.text, marginTop: 2 }}>{e.title}</div>
                <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                  <Badge color={kindColor[e.kind] || C.muted}>{e.kind}</Badge>
                  {e.sub && <span style={{ fontSize: 11.5, color: C.muted }}>{e.sub}</span>}
                </div>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

function NotesPanel({ notes, onAdd }) {
  const [text, setText] = useState("");
  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <TInput value={text} onChange={e => setText(e.target.value)} placeholder="Add a note..." onKeyDown={e => { if (e.key === "Enter" && text.trim()) { onAdd(text.trim()); setText(""); } }} />
        <Btn variant="primary" onClick={() => { if (text.trim()) { onAdd(text.trim()); setText(""); } }}>Add</Btn>
      </div>
      {notes.length === 0 ? <EmptyState icon={<Icon.edit size={18} />} title="No notes yet" /> : (
        <div>{notes.slice().reverse().map(n => (
          <div key={n.id} style={{ padding: "10px 0", borderBottom: `1px solid ${C.border}` }}>
            <div style={{ fontSize: 13.5, color: C.text, lineHeight: 1.6 }}>{n.text}</div>
            <div style={{ fontSize: 11, color: C.dim, marginTop: 3, fontFamily: MONO }}>{n.createdAt ? fmt(n.createdAt.slice(0, 10)) : ""}</div>
          </div>
        ))}</div>
      )}
    </div>
  );
}

function ProjectsView({ data, derived, addProject, updateProject, removeProject, openProjectId, setOpenProjectId, addAction, updateAction, removeAction, updateMeeting, addNote, openEntity, studioSettings, onAddSupplier }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [statusFilter, setStatusFilter] = useState("All");

  const openProject = data.projects.find(p => p.id === openProjectId);
  if (openProject) {
    return <ProjectDetail project={openProject} data={data} derived={derived} back={() => setOpenProjectId(null)}
      editProject={(p) => { setEditing(p); setModalOpen(true); }} addAction={addAction} updateAction={updateAction} removeAction={removeAction} updateMeeting={updateMeeting} updateProject={updateProject} addNote={addNote} openEntity={openEntity} studioSettings={studioSettings} onAddSupplier={onAddSupplier} />;
  }

  const filtered = data.projects.filter(p => statusFilter === "All" || p.status === statusFilter);
  const grouped = { Active: filtered.filter(p => p.status === "Active"), "On Hold": filtered.filter(p => p.status === "On Hold"), Completed: filtered.filter(p => p.status === "Completed"), Archived: filtered.filter(p => p.status === "Archived") };

  return (
    <div className="studio-content" style={{ padding: 28, maxWidth: 1180 }}>
      <SectionHead title="Projects" subtitle={`${data.projects.length} total`}
        right={<>
          <TSelect value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={{ width: 150 }}><option>All</option>{PROJECT_STATUSES.map(s => <option key={s}>{s}</option>)}</TSelect>
          <Btn variant="primary" icon={<Icon.plus size={15} />} onClick={() => { setEditing(null); setModalOpen(true); }}>New project</Btn>
        </>} />

      {data.projects.length === 0 ? (
        <EmptyState icon={<Icon.projects size={20} />} title="No projects created yet"
          body="Projects are the top level of Studio OS. Create one to start tracking actions, meetings, site visits, and suppliers."
          action={<Btn variant="primary" icon={<Icon.plus size={15} />} onClick={() => setModalOpen(true)}>Create your first project</Btn>} />
      ) : (
        Object.entries(grouped).map(([status, list]) => list.length > 0 && (
          <div key={status} style={{ marginBottom: 26 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: status === "On Hold" ? C.purple : C.dim, textTransform: "uppercase", letterSpacing: ".06em", marginBottom: 10 }}>{status} ({list.length})</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 14 }}>
              {list.map(p => {
                const actions = data.actions.filter(a => a.projectId === p.id);
                const open = actions.filter(a => !["Completed", "Cancelled"].includes(a.status)).length;
                const overdue = actions.filter(a => a.dueDate && toDate(a.dueDate) < TODAY() && !["Completed", "Cancelled"].includes(a.status)).length;
                return (
                  <Card key={p.id} hover onClick={() => setOpenProjectId(p.id)}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                      <div style={{ fontSize: 15, fontWeight: 600, color: C.text, fontFamily: SERIF }}>{p.name}</div>
                      <Badge color={p.status === "Active" ? C.green : p.status === "On Hold" ? C.purple : C.muted}>{p.status}</Badge>
                    </div>
                    <div style={{ fontSize: 12.5, color: C.muted, marginTop: 4 }}>{p.client || "No client set"}</div>
                    <div style={{ display: "flex", gap: 14, marginTop: 14, paddingTop: 12, borderTop: `1px solid ${C.border}` }}>
                      <div style={{ fontSize: 12, color: C.muted }}>{open} open</div>
                      {overdue > 0 && <div style={{ fontSize: 12, color: C.red }}>{overdue} overdue</div>}
                    </div>
                  </Card>
                );
              })}
            </div>
          </div>
        ))
      )}

      <ProjectModal open={modalOpen} onClose={() => setModalOpen(false)} project={editing}
        save={(f) => editing ? updateProject(editing.id, f) : addProject(f)} remove={removeProject} />
    </div>
  );
}

/* ── Meetings module ──────────────────────────────────────────── */
function MeetingModal({ open, onClose, meeting, data, save, remove, addAction }) {
  const [f, setF] = useState({});
  const [genActionText, setGenActionText] = useState("");
  useEffect(() => { if (open) { setF(meeting ? { ...meeting } : { title: "", type: "Client Meeting", projectId: "", date: todayISO(), time: "", location: "", attendees: "", notes: "", decisions: "", nextMeetingDate: "" }); setGenActionText(""); } }, [open, meeting]);
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const submit = () => { if (!f.title) return; save(f); onClose(); };

  return (
    <Modal open={open} onClose={onClose} title={meeting ? "Edit meeting" : "New meeting"} width={600}
      footer={<>
        {meeting && <Btn variant="danger" icon={<Icon.trash size={14} />} onClick={() => { remove(meeting.id); onClose(); }} style={{ marginRight: "auto" }}>Delete</Btn>}
        <Btn onClick={onClose}>Cancel</Btn><Btn variant="primary" onClick={submit}>{meeting ? "Save changes" : "Create meeting"}</Btn>
      </>}>
      <Field label="Title" required><TInput autoFocus value={f.title || ""} onChange={e => set("title", e.target.value)} placeholder="e.g. ZED East — client review" /></Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Type"><TSelect value={f.type || "Client Meeting"} onChange={e => set("type", e.target.value)}>{MEETING_TYPES.map(t => <option key={t}>{t}</option>)}</TSelect></Field>
        <Field label="Project"><TSelect value={f.projectId || ""} onChange={e => set("projectId", e.target.value)}><option value="">No project</option>{data.projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</TSelect></Field>
        <Field label="Date"><TInput type="date" value={f.date || ""} onChange={e => set("date", e.target.value)} /></Field>
        <Field label="Time"><TInput type="time" value={f.time || ""} onChange={e => set("time", e.target.value)} /></Field>
        <Field label="Location"><TInput value={f.location || ""} onChange={e => set("location", e.target.value)} /></Field>
        <Field label="Next meeting date"><TInput type="date" value={f.nextMeetingDate || ""} onChange={e => set("nextMeetingDate", e.target.value)} /></Field>
      </div>
      <Field label="Attendees"><TInput value={f.attendees || ""} onChange={e => set("attendees", e.target.value)} placeholder="Names, comma separated" /></Field>
      <Field label="Meeting notes"><TArea value={f.notes || ""} onChange={e => set("notes", e.target.value)} /></Field>
      <Field label="Decisions"><TArea value={f.decisions || ""} onChange={e => set("decisions", e.target.value)} placeholder='e.g. "Need outdoor pergola"' /></Field>

      {meeting && (
        <div style={{ marginTop: 4, padding: 14, background: C.surface2, border: `1px solid ${C.border2}`, borderRadius: 10 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: C.brass, marginBottom: 8 }}>Generate action from this meeting</div>
          <div style={{ display: "flex", gap: 8 }}>
            <TInput value={genActionText} onChange={e => setGenActionText(e.target.value)} placeholder="e.g. Revise outdoor design" />
            <Btn onClick={() => { if (genActionText.trim()) { addAction({ title: genActionText.trim(), projectId: f.projectId || "", category: "Design", priority: "Medium", dueDate: "", status: "Open", description: `From meeting: ${f.title}`, contactId: "", notes: "" }); setGenActionText(""); } }}>Add action</Btn>
          </div>
        </div>
      )}
    </Modal>
  );
}

function MeetingsView({ data, derived, addMeeting, updateMeeting, removeMeeting, addAction }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [typeFilter, setTypeFilter] = useState("All");
  const { projectById } = derived;

  const filtered = data.meetings.filter(m => typeFilter === "All" || m.type === typeFilter).sort((a, b) => toDate(b.date) - toDate(a.date));
  const typeColor = { "Client Meeting": C.brass, "Supplier Meeting": C.blue, "Contractor Meeting": C.purple };

  return (
    <div className="studio-content" style={{ padding: 28, maxWidth: 1180 }}>

function ContactModal({ open, onClose, contact, save, remove, lockedType, categoryOptions }) {
  const [f, setF] = useState({});
  const [tagInput, setTagInput] = useState("");
  useEffect(() => { if (open) { setF(contact ? { ...contact } : { name: "", type: lockedType || "Contractor", company: "", phone: "", email: "", address: "", category: "", notes: "", tags: [], status: "Active", rating: 0 }); setTagInput(""); } }, [open, contact]);
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const submit = () => { if (!f.name) return; save({ ...f, type: lockedType || f.type }); onClose(); };
  const addTag = () => { if (tagInput.trim()) { set("tags", [...(f.tags || []), tagInput.trim()]); setTagInput(""); } };

  return (
    <Modal open={open} onClose={onClose} title={contact ? `Edit ${lockedType ? lockedType.toLowerCase() : "contact"}` : `New ${lockedType ? lockedType.toLowerCase() : "contact"}`} width={540}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>

        {categoryOptions ? (
          <Field label="Category">
            <TSelect value={f.category || categoryOptions[0] || ""} onChange={e => set("category", e.target.value)}>{categoryOptions.map(c => <option key={c}>{c}</option>)}</TSelect>
          </Field>

function SupplierMiniTrendChart({ series }) {
  const W = 640, H = 140, PAD_L = 50, PAD_B = 22, PAD_T = 10, PAD_R = 10;
  const plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;
  if (series.length === 0) return <div style={{ padding: "20px 0", textAlign: "center", fontSize: 12.5, color: C.dim }}>No supplier payments yet to chart.</div>;
  const maxAbs = Math.max(1, ...series.map(s => s.amount));
  const bandW = plotW / series.length;
  const barW = Math.min(24, bandW * 0.5);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
      <line x1={PAD_L} y1={PAD_T + plotH} x2={W - PAD_R} y2={PAD_T + plotH} stroke={C.border2} strokeWidth="1" />
      {series.map((s, i) => {
        const cx = PAD_L + bandW * i + bandW / 2;
        const h = (s.amount / maxAbs) * plotH;
        return (
          <g key={s.month}>
            <rect x={cx - barW / 2} y={PAD_T + plotH - h} width={barW} height={Math.max(1, h)} rx="2" fill={C.brass} opacity="0.85" />
            <text x={cx} y={H - 6} fontSize="8" fill={C.dim} textAnchor="middle">{MONTH_LABEL_FMT(s.month)}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* Builds the standard backup filename: studio-os-backup-YYYY-MM-DD.json */
function backupFilename() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `studio-os-backup-${y}-${m}-${day}.json`;
}

function mergeData(current, incoming) {
  // Merge by id per collection: incoming records win on id collision, others are appended.
  // Non-list keys (e.g. studioSettings) are shallow-merged instead, with incoming values winning.
  const result = { ...emptyData() };
  Object.keys(result).forEach(key => {
    const base = emptyData()[key];
    if (Array.isArray(base)) {
      const currentList = Array.isArray(current[key]) ? current[key] : [];
      const incomingList = Array.isArray(incoming[key]) ? incoming[key] : [];
      const byId = new Map(currentList.map(item => [item.id, item]));
      incomingList.forEach(item => byId.set(item.id, item));
      result[key] = Array.from(byId.values());
    } else {
      const currentVal = (current[key] && typeof current[key] === "object") ? current[key] : {};
      const incomingVal = (incoming[key] && typeof incoming[key] === "object") ? incoming[key] : {};
      result[key] = { ...base, ...currentVal, ...incomingVal };
    }
  });
  return result;
}

/* Data migration: historical expenses recorded a free-text "Paid To" field
   before the Supplier Database existed. This scans every project's expenses
   for unlinked paidTo text, creates one supplier contact per distinct name
   (case-insensitive match so "ElectroCo" and "electroco" become the same
   supplier), and links each historical expense to it via supplierId — all
   non-destructively: paidTo itself is left in place, nothing is deleted, and
   expenses that already have a supplierId are skipped entirely. Safe to run
   more than once; already-linked or already-matched expenses are untouched. */
function migrateSuppliersFromPaidTo(data) {
  const existingSuppliers = data.contacts.filter(c => c.type === "Supplier");
  const nameToId = new Map(existingSuppliers.map(s => [s.name.trim().toLowerCase(), s.id]));
  const newSuppliers = [];
  let linkedCount = 0;

  const projects = data.projects.map(project => {
    const expenses = project.expenses || [];
    let projectChanged = false;
    const nextExpenses = expenses.map(e => {
      if (e.supplierId || !e.paidTo || !e.paidTo.trim()) return e;
      const key = e.paidTo.trim().toLowerCase();
      let supplierId = nameToId.get(key);
      if (!supplierId) {
        supplierId = uid();
        nameToId.set(key, supplierId);
        newSuppliers.push({
          id: supplierId, name: e.paidTo.trim(), type: "Supplier", status: "Active", tags: [],
          company: "", phone: "", email: "", address: "", category: "", notes: "Auto-created from historical expense records.",
          createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
        });
      }
      projectChanged = true;
      linkedCount++;
      return { ...e, supplierId };
    });
    return projectChanged ? { ...project, expenses: nextExpenses } : project;
  });

  return {
    data: { ...data, projects, contacts: [...data.contacts, ...newSuppliers] },
    newSupplierCount: newSuppliers.length,
    linkedExpenseCount: linkedCount,
  };
}

/* Data migration: Project Stages originally stored their subtasks as an
   embedded stage.actions[] array (shape: {id, text, done}) — a second,
   separate action-like structure living inside each stage object. Now that
   Actions are a single global database (data.actions[]) with an optional
   stageId link, this converts every legacy embedded subtask into a real
   action record, linked to its project and stage, and clears the embedded
   array afterward so the data genuinely lives in exactly one place — not
   copied into two. Purely additive to data.actions; nothing is deleted, and
   running this twice is safe (a stage with an already-empty actions[] array
   is left untouched, so already-migrated projects contribute nothing further). */
function migrateStageActionsToGlobalActions(data) {
  const newActions = [];
  let migratedStageCount = 0;

  const projects = data.projects.map(project => {
    const stages = project.stages || [];
    let projectChanged = false;
    const nextStages = stages.map(stage => {
      const legacy = stage.actions || [];
      if (legacy.length === 0) return stage;
      legacy.forEach(subtask => {
        newActions.push({
          id: uid(),
          title: subtask.text || "Untitled action",
          description: "",
          projectId: project.id,
          stageId: stage.id,
          category: "Design",
          priority: "Medium",
          status: subtask.done ? "Completed" : "Open",
          dueDate: "",
          contactId: "",
          assignedTo: "",
          notes: "Migrated from a legacy stage subtask.",
          resourceStage: "",
          createdAt: new Date().toISOString(),
          completedAt: subtask.done ? new Date().toISOString() : "",
        });
      });
      projectChanged = true;
      migratedStageCount++;
      // The embedded array is cleared, not left stale — the real records
      // now live in data.actions, so keeping a copy here would recreate
      // exactly the duplicate-database problem this migration exists to fix.
      const { actions, ...stageWithoutActions } = stage;
      return stageWithoutActions;
    });
    return projectChanged ? { ...project, stages: nextStages } : project;
  });

  return {
    data: { ...data, projects, actions: [...data.actions, ...newActions] },
    migratedActionCount: newActions.length,
    migratedStageCount,
  };
}

function SettingsView({ data, setData, clearAll, saveNow }) {
  const [confirmOpen, setConfirmOpen] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const [importMode, setImportMode] = useState("merge");
  const [importError, setImportError] = useState("");
  const [pendingImport, setPendingImport] = useState(null);
  const [backups, setBackups] = useState(null);
  const [restoreOpen, setRestoreOpen] = useState(false);
  const [restoreTarget, setRestoreTarget] = useState(null);
  const fileInputRef = useRef(null);
  const logoInputRef = useRef(null);

  // PWA install state: Chrome/Edge/Android expose a native prompt captured
  // in index.html (window.__studioInstallPrompt); iOS Safari has no such
  // API, so we detect platform instead and show manual instructions.
  const [installPromptReady, setInstallPromptReady] = useState(typeof window !== "undefined" && !!window.__studioInstallPrompt);
  const [installed, setInstalled] = useState(typeof window !== "undefined" && window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  const isIOS = typeof navigator !== "undefined" && /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandaloneCapable = typeof window !== "undefined" && "serviceWorker" in navigator;

  useEffect(() => {
    const onAvailable = () => setInstallPromptReady(true);
    const onInstalled = () => { setInstalled(true); setInstallPromptReady(false); };
    window.addEventListener("studio-install-available", onAvailable);
    window.addEventListener("studio-install-completed", onInstalled);
    return () => {
      window.removeEventListener("studio-install-available", onAvailable);
      window.removeEventListener("studio-install-completed", onInstalled);
    };
  }, []);

  const triggerInstall = async () => {
    const promptEvent = window.__studioInstallPrompt;
    if (!promptEvent) return;
    promptEvent.prompt();
    try { await promptEvent.userChoice; } catch (e) { /* user dismissed */ }
    window.__studioInstallPrompt = null;
    setInstallPromptReady(false);
  };

  const studioSettings = data.studioSettings || { name: "Two Architects", logoDataUrl: "" };
  const setStudioName = (name) => setData(prev => ({ ...prev, studioSettings: { ...(prev.studioSettings || {}), name } }));
  const setStudioLogo = (dataUrl) => setData(prev => ({ ...prev, studioSettings: { ...(prev.studioSettings || {}), logoDataUrl: dataUrl } }));
  const handleLogoChosen = (file) => {
    if (!file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = () => setStudioLogo(reader.result);
    reader.readAsDataURL(file);
  };

  const [supplierMigrationResult, setSupplierMigrationResult] = useState(null);
  const unlinkedPaidToCount = useMemo(() => {
    let count = 0;
    data.projects.forEach(p => (p.expenses || []).forEach(e => { if (!e.supplierId && e.paidTo && e.paidTo.trim()) count++; }));
    return count;
  }, [data.projects]);
  const runSupplierMigration = () => {
    const { data: migrated, newSupplierCount, linkedExpenseCount } = migrateSuppliersFromPaidTo(data);
    setData(migrated);
    setSupplierMigrationResult({ newSupplierCount, linkedExpenseCount });
    saveNow();
  };

  const [stageActionMigrationResult, setStageActionMigrationResult] = useState(null);
  const legacyStageActionCount = useMemo(() => {
    let count = 0;
    data.projects.forEach(p => (p.stages || []).forEach(s => { count += (s.actions || []).length; }));
    return count;
  }, [data.projects]);
  const runStageActionMigration = () => {
    const { data: migrated, migratedActionCount, migratedStageCount } = migrateStageActionsToGlobalActions(data);
    setData(migrated);
    setStageActionMigrationResult({ migratedActionCount, migratedStageCount });
    saveNow();
  };

  const counts = [
    ["Projects", data.projects.length], ["Actions", data.actions.length], ["Meetings", data.meetings.length],
    ["Contacts", data.contacts.length], ["Supplier items", data.supplierItems.length], ["Notes", data.notes.length],
  ];

  const exportJSON = () => {
    const payload = { exportedAt: new Date().toISOString(), app: "architect-studio-os", version: 1, data };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = backupFilename();
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleFileChosen = (file) => {
    setImportError("");
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const incoming = parsed.data ? parsed.data : parsed;
        if (typeof incoming !== "object" || incoming === null) throw new Error("File does not contain valid studio data.");
        setPendingImport(incoming);
        setImportOpen(true);
      } catch (e) {
        setImportError("Could not read that file. Make sure it's a Studio OS backup JSON file.");
      }
    };
    reader.readAsText(file);
  };

  const confirmImport = () => {
    if (!pendingImport) return;
    if (importMode === "replace") {
      setData({ ...emptyData(), ...pendingImport });
    } else {
      setData(prev => mergeData(prev, pendingImport));
    }
    setImportOpen(false);
    setPendingImport(null);
    saveNow();
  };

  const openRestorePanel = async () => {
    setRestoreOpen(true);
    setBackups(await listAutoBackups());
  };

  const doRestore = () => {
    if (!restoreTarget) return;
    setData({ ...emptyData(), ...restoreTarget.data });
    setRestoreOpen(false);
    setRestoreTarget(null);
    saveNow();
  };

  return (
    <div className="studio-content" style={{ padding: 28, maxWidth: 720 }}>
      <SectionHead title="Settings" subtitle="Studio configuration and data" />
      <Card style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 12 }}>Studio profile</div>
        <div style={{ fontSize: 12, color: C.muted, marginBottom: 14, lineHeight: 1.6 }}>Used on Client Receipt PDFs generated from any project's Finance tab.</div>
        <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
          <div onClick={() => logoInputRef.current?.click()} style={{
            width: 64, height: 64, borderRadius: 12, background: C.surface2, border: `1px dashed ${C.border2}`,
            display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, overflow: "hidden",
          }}>
            {studioSettings.logoDataUrl ? (
              <img src={studioSettings.logoDataUrl} alt="Studio logo" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
            ) : (
              <Icon.image size={20} style={{ color: C.dim }} />
            )}
          </div>
          <div style={{ flex: 1 }}>
            <TInput value={studioSettings.name || ""} onChange={e => setStudioName(e.target.value)} placeholder="Studio name" style={{ marginBottom: 8 }} />
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <input ref={logoInputRef} type="file" accept="image/*" style={{ display: "none" }}
                onChange={e => { if (e.target.files[0]) handleLogoChosen(e.target.files[0]); e.target.value = ""; }} />
              <Btn size="sm" icon={<Icon.upload size={13} />} onClick={() => logoInputRef.current?.click()}>{studioSettings.logoDataUrl ? "Change logo" : "Upload logo"}</Btn>
              {studioSettings.logoDataUrl && <Btn size="sm" variant="subtle" onClick={() => setStudioLogo("")}>Remove</Btn>}
            </div>
          </div>
        </div>
      </Card>

      <Card style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 6 }}>Install app</div>
        {installed ? (
          <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: C.green }}>
            <Icon.check size={15} /> Installed and running as an app.
          </div>
        ) : isIOS ? (
          <div style={{ fontSize: 12.5, color: C.muted, lineHeight: 1.6 }}>
            On iPhone or iPad: tap the <strong style={{ color: C.text }}>Share</strong> button in Safari, then <strong style={{ color: C.text }}>Add to Home Screen</strong>. Studio OS will open full-screen, work offline, and keep all your data.
          </div>
        ) : installPromptReady ? (
          <>
            <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 12, lineHeight: 1.6 }}>Install Architect Studio OS for a full-screen app experience with offline access, on this device's home screen or app list.</div>
            <Btn variant="primary" icon={<Icon.upload size={14} style={{ transform: "rotate(180deg)" }} />} onClick={triggerInstall}>Install Architect Studio OS</Btn>
          </>
        ) : isStandaloneCapable ? (
          <div style={{ fontSize: 12.5, color: C.muted, lineHeight: 1.6 }}>
            Your browser will offer an install option (often in the address bar, or under its menu as "Install app…" / "Add to Home screen") once this page has been visited over a secure connection.
          </div>
        ) : (
          <div style={{ fontSize: 12.5, color: C.muted, lineHeight: 1.6 }}>
            Installation isn't available in this browser. Studio OS still works fully as a regular web page — your data is unaffected either way.
          </div>
        )}
      </Card>

      <Card style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 12 }}>Data overview</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {counts.map(([label, count]) => (
            <div key={label} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "6px 0", borderBottom: `1px solid ${C.border}` }}>
              <span style={{ color: C.muted }}>{label}</span><span style={{ color: C.text, fontFamily: MONO }}>{count}</span>
            </div>
          ))}
        </div>
      </Card>

      {unlinkedPaidToCount > 0 && (
        <Card style={{ marginBottom: 18, borderColor: C.brassLine, background: C.brassDim }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: C.text, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 6 }}>Migrate to Supplier Database</div>
          <div style={{ fontSize: 12.5, color: C.text, marginBottom: 14, lineHeight: 1.6 }}>
            {unlinkedPaidToCount} historical expense{unlinkedPaidToCount === 1 ? "" : "s"} still {unlinkedPaidToCount === 1 ? "has" : "have"} a free-text "Paid To" name with no linked supplier record. This creates one supplier per distinct name and links every matching expense — nothing is deleted or overwritten, and it's safe to run more than once.
          </div>
          <Btn variant="primary" onClick={runSupplierMigration}>Create suppliers from historical expenses</Btn>
          {supplierMigrationResult && (
            <div style={{ fontSize: 12.5, color: C.green, marginTop: 10 }}>
              Created {supplierMigrationResult.newSupplierCount} new supplier{supplierMigrationResult.newSupplierCount === 1 ? "" : "s"} and linked {supplierMigrationResult.linkedExpenseCount} expense{supplierMigrationResult.linkedExpenseCount === 1 ? "" : "s"}.
            </div>
          )}
        </Card>
      )}

      {legacyStageActionCount > 0 && (
        <Card style={{ marginBottom: 18, borderColor: C.brassLine, background: C.brassDim }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: C.text, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 6 }}>Migrate Stage Actions to the Global Action Database</div>
          <div style={{ fontSize: 12.5, color: C.text, marginBottom: 14, lineHeight: 1.6 }}>
            {legacyStageActionCount} action{legacyStageActionCount === 1 ? "" : "s"} still {legacyStageActionCount === 1 ? "lives" : "live"} inside a stage's older embedded list instead of the single global Actions database. This moves {legacyStageActionCount === 1 ? "it" : "them"} into Actions — linked to the same project and stage — so {legacyStageActionCount === 1 ? "it" : "they"}'ll appear on the Actions dashboard, in search, and in every widget. Nothing is deleted, and it's safe to run more than once.
          </div>
          <Btn variant="primary" onClick={runStageActionMigration}>Migrate stage actions</Btn>
          {stageActionMigrationResult && (
            <div style={{ fontSize: 12.5, color: C.green, marginTop: 10 }}>
              Migrated {stageActionMigrationResult.migratedActionCount} action{stageActionMigrationResult.migratedActionCount === 1 ? "" : "s"} across {stageActionMigrationResult.migratedStageCount} stage{stageActionMigrationResult.migratedStageCount === 1 ? "" : "s"}.
            </div>
          )}
        </Card>
      )}

      <Card style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.dim, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 6 }}>JSON backup</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14, lineHeight: 1.6 }}>Export a full backup of your studio data, or import a previous backup file. Imports can replace everything or merge into your current data.</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <Btn icon={<Icon.upload size={14} style={{ transform: "rotate(180deg)" }} />} onClick={exportJSON}>Export JSON</Btn>
          <input ref={fileInputRef} type="file" accept="application/json,.json" style={{ display: "none" }}
            onChange={e => { if (e.target.files[0]) handleFileChosen(e.target.files[0]); e.target.value = ""; }} />
          <Btn icon={<Icon.upload size={14} />} onClick={() => fileInputRef.current?.click()}>Import JSON</Btn>
          <Btn icon={<Icon.clock size={14} />} onClick={openRestorePanel}>Restore backup</Btn>
        </div>
        {importError && <div style={{ fontSize: 12, color: C.red, marginTop: 10 }}>{importError}</div>}
      </Card>

      <Card style={{ borderColor: "rgba(196,104,90,.3)" }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, color: C.red, marginBottom: 6 }}>Reset all data</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14, lineHeight: 1.6 }}>Permanently deletes every project, action, meeting, contact, and supplier item from this Studio OS instance. This cannot be undone.</div>
        <Btn variant="danger" onClick={() => setConfirmOpen(true)}>Reset everything</Btn>
      </Card>

      <Modal open={confirmOpen} onClose={() => setConfirmOpen(false)} title="Reset all data" width={440}
        footer={<><Btn onClick={() => setConfirmOpen(false)}>Cancel</Btn><Btn variant="danger" onClick={() => { clearAll(); setConfirmOpen(false); }}>Yes, delete everything</Btn></>}>
        <div style={{ fontSize: 13.5, color: C.text, lineHeight: 1.6 }}>This will permanently remove all projects, actions, meetings, contacts, suppliers, and notes. This action cannot be undone. Consider exporting a JSON backup first.</div>
      </Modal>

      <Modal open={importOpen} onClose={() => { setImportOpen(false); setPendingImport(null); }} title="Import backup" width={460}
        footer={<><Btn onClick={() => { setImportOpen(false); setPendingImport(null); }}>Cancel</Btn><Btn variant="primary" onClick={confirmImport}>Import</Btn></>}>
        <div style={{ fontSize: 13.5, color: C.text, lineHeight: 1.6, marginBottom: 16 }}>Choose how to bring this file into your studio data.</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <label style={{ display: "flex", gap: 10, padding: 12, border: `1px solid ${importMode === "merge" ? C.brassLine : C.border2}`, borderRadius: 10, cursor: "pointer", background: importMode === "merge" ? C.brassDim : "transparent" }}>
            <input type="radio" checked={importMode === "merge"} onChange={() => setImportMode("merge")} style={{ marginTop: 2 }} />
            <div>
              <div style={{ fontSize: 13.5, fontWeight: 600, color: C.text }}>Merge</div>
              <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>Add records from the file into your current data. Matching IDs are overwritten with the file's version.</div>
            </div>
          </label>
          <label style={{ display: "flex", gap: 10, padding: 12, border: `1px solid ${importMode === "replace" ? "rgba(196,104,90,.4)" : C.border2}`, borderRadius: 10, cursor: "pointer", background: importMode === "replace" ? C.redDim : "transparent" }}>
            <input type="radio" checked={importMode === "replace"} onChange={() => setImportMode("replace")} style={{ marginTop: 2 }} />
            <div>
              <div style={{ fontSize: 13.5, fontWeight: 600, color: C.text }}>Replace</div>
              <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>Discard all current data and replace it entirely with the contents of this file.</div>
            </div>
          </label>
        </div>
      </Modal>

      <Modal open={restoreOpen} onClose={() => { setRestoreOpen(false); setRestoreTarget(null); }} title="Restore automatic backup" width={480}
        footer={<><Btn onClick={() => { setRestoreOpen(false); setRestoreTarget(null); }}>Cancel</Btn><Btn variant="danger" disabled={!restoreTarget} onClick={doRestore}>Restore this backup</Btn></>}>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14, lineHeight: 1.6 }}>Studio OS automatically keeps your last {MAX_AUTO_BACKUPS} saves. Restoring replaces your current data with the selected backup.</div>
        {backups === null ? (
          <div style={{ fontSize: 13, color: C.dim }}>Loading backups...</div>
        ) : backups.length === 0 ? (
          <div style={{ fontSize: 13, color: C.dim }}>No automatic backups yet. They're created shortly after every save.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {backups.map(b => {
              const d = new Date(b.savedAt);
              const label = isNaN(d.getTime()) ? b.savedAt : d.toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
              const selected = restoreTarget && restoreTarget.key === b.key;
              return (
                <div key={b.key} onClick={() => setRestoreTarget(b)} style={{ padding: 12, borderRadius: 10, border: `1px solid ${selected ? C.brassLine : C.border2}`, background: selected ? C.brassDim : "transparent", cursor: "pointer", fontSize: 13, color: C.text }}>
                  {label}
                </div>
              );
            })}
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ── Root App ──────────────────────────────────────────────────── */
/* Catches any error thrown during render anywhere in the component tree
   below it. Without this, React 18 silently unmounts the whole app on an
   uncaught render error — the exact "white screen with no error visible to
   the user" failure mode. This is deliberately a class component: error
   boundaries have no hook equivalent in React. */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    // Surfaced to the console for real debugging; the UI below shows a
    // calmer, non-technical message with the same underlying detail.
    console.error("Architect Studio OS crashed:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#0b0b0c", color: "#e9e5dc", fontFamily: "system-ui, -apple-system, sans-serif", padding: 24, textAlign: "center" }}>
          <div style={{ maxWidth: 480 }}>
            <div style={{ fontSize: 18, fontWeight: 600, marginBottom: 10 }}>Something went wrong</div>
            <div style={{ fontSize: 13.5, color: "#918d84", lineHeight: 1.6, marginBottom: 16 }}>
              The app hit an unexpected error and couldn't continue. Your data is safe in this browser's storage — reloading usually resolves it.
            </div>
            <div style={{ fontSize: 11.5, color: "#5c5953", fontFamily: "monospace", background: "#141416", border: "1px solid #28282c", borderRadius: 8, padding: "10px 12px", marginBottom: 16, wordBreak: "break-word" }}>
              {String(this.state.error && this.state.error.message || this.state.error)}
            </div>
            <button onClick={() => location.reload()} style={{ background: "#c8a96e", color: "#171310", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>Reload</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App() {
  const { data, setData, loaded, saveStatus, saveNow } = useStudioData();
  const [view, setView] = useState("dashboard");
  const [openProjectId, setOpenProjectId] = useState(null);
  const [quickAddOpen, setQuickAddOpen] = useState(false);
  const derived = useDerived(data);
  const rollup = useFinanceRollup(data);

  const withTimestamp = (obj) => ({ ...obj, createdAt: obj.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() });

  const makeCRUD = (key) => ({
    add: (obj) => setData(prev => ({ ...prev, [key]: [...prev[key], withTimestamp({ id: uid(), ...obj })] })),
    update: (id, patch) => setData(prev => ({ ...prev, [key]: prev[key].map(x => x.id === id ? { ...x, ...patch, updatedAt: new Date().toISOString() } : x) })),
    remove: (id) => setData(prev => ({ ...prev, [key]: prev[key].filter(x => x.id !== id) })),
  });

  const projectsCRUD = makeCRUD("projects");
  const actionsCRUD = makeCRUD("actions");
  const meetingsCRUD = makeCRUD("meetings");
  const contactsCRUD = makeCRUD("contacts");
  const suppliersCRUD = makeCRUD("supplierItems");
  const notesCRUD = makeCRUD("notes");

  // Unlike the generic CRUD helpers, this generates the id up front and
  // returns it synchronously — the "+ Create new supplier…" flow inside the
  // expense form needs the new supplier's id immediately so it can select it
  // in the same action, before the next render.
  const addSupplierAndGetId = (name) => {
    const newId = uid();
    setData(prev => ({
      ...prev,
      contacts: [...prev.contacts, {
        id: newId, name, type: "Supplier", status: "Active", tags: [],
        company: "", phone: "", email: "", address: "", category: "", notes: "",
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
      }],
    }));
    return newId;
  };

  const clearAll = () => setData(emptyData());

  const openEntity = (kind, obj) => {
    if (kind === "project") { setView("projects"); setOpenProjectId(obj.id); }
    else if (kind === "action") { setView("actions"); }
    else if (kind === "meeting") { setView("meetings"); }
    else { setView(kind + "s"); }
  };

  const onSearchResult = (cat, item) => {
    const map = { projects: "project", actions: "action", meetings: "meeting", contacts: "contacts", suppliers: "suppliers" };
    if (cat === "projects") { setView("projects"); setOpenProjectId(item.id); }
    else if (cat === "contacts") { setView("contacts"); }
    else setView(map[cat] || "dashboard");
  };

  if (!loaded) {
    return (
      <div style={{ height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.bg, color: C.muted, fontFamily: FONT, fontSize: 13 }}>
        Loading studio data...
      </div>
    );
  }

  return (
    <div style={{ display: "flex", background: C.bg, minHeight: "100vh", color: C.text, fontFamily: FONT }}>
      <style>{`
        * { box-sizing: border-box; }
        body { margin: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: ${C.border2}; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        select option { background: ${C.surface2}; color: ${C.text}; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
      `}</style>
      <Sidebar view={view} setView={(v) => { setView(v); setOpenProjectId(null); }} followUpCount={derived.followUps.length} />
      <div className="studio-main" style={{ flex: 1, minWidth: 0 }}>
        <TopBar data={data} onOpenResult={onSearchResult} onQuickAdd={() => setQuickAddOpen(true)} saveStatus={saveStatus} onSaveNow={saveNow} />

        {view === "dashboard" && <DashboardView data={data} derived={derived} openEntity={openEntity} onQuickAdd={() => setQuickAddOpen(true)}
          addAction={actionsCRUD.add} updateAction={actionsCRUD.update} updateMeeting={meetingsCRUD.update} />}
        {view === "projects" && <ProjectsView data={data} derived={derived} addProject={projectsCRUD.add} updateProject={projectsCRUD.update} removeProject={projectsCRUD.remove}
          openProjectId={openProjectId} setOpenProjectId={setOpenProjectId} addAction={actionsCRUD.add} updateAction={actionsCRUD.update} removeAction={actionsCRUD.remove} updateMeeting={meetingsCRUD.update} addNote={notesCRUD.add} openEntity={openEntity} studioSettings={data.studioSettings} onAddSupplier={addSupplierAndGetId} />}
        {view === "financeDashboard" && <FinanceDashboardView data={data} rollup={rollup} openEntity={openEntity} />}
        {view === "actions" && <ActionsView data={data} derived={derived} addAction={actionsCRUD.add} updateAction={actionsCRUD.update} removeAction={actionsCRUD.remove} />}
        {view === "meetings" && <MeetingsView data={data} derived={derived} addMeeting={meetingsCRUD.add} updateMeeting={meetingsCRUD.update} removeMeeting={meetingsCRUD.remove} addAction={actionsCRUD.add} />}
        {view === "contacts" && <ContactsView data={data} addContact={contactsCRUD.add} updateContact={contactsCRUD.update} removeContact={contactsCRUD.remove} />}
        {view === "procurement" && <SuppliersView data={data} derived={derived} addSupplierItem={suppliersCRUD.add} updateSupplierItem={suppliersCRUD.update} removeSupplierItem={suppliersCRUD.remove} />}
        {view === "suppliers" && <SupplierDatabaseView data={data} setData={setData} openEntity={openEntity} />}
        {view === "settings" && <SettingsView data={data} setData={setData} clearAll={clearAll} saveNow={saveNow} />}
      </div>

      <QuickAddModal open={quickAddOpen} onClose={() => setQuickAddOpen(false)} data={data}
        addAction={actionsCRUD.add} addMeeting={meetingsCRUD.add}
        addContact={contactsCRUD.add} addSupplierItem={suppliersCRUD.add} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
// Reaching this line means React successfully committed the initial render —
// from here on, the early boot-error handlers step aside and let the app's
// own error boundary / normal operation take over.
window.__STUDIO_BOOT_OK = true;
</script>
</body>
</html>
