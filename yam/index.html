<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F1EB" />
  <title>YAM — Construction Documentation</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231E1C19'/%3E%3Ctext x='16' y='21' font-family='Georgia' font-size='13' fill='%23F4F1EB' text-anchor='middle' letter-spacing='1'%3EYAM%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
  <link rel="stylesheet" href="assets/css/print.css" />
</head>
<body>
  <div id="app" class="app" aria-live="polite">
    <div class="boot">
      <div class="boot-mark">YAM</div>
      <div class="boot-text" id="boot-text">Loading documentation system…</div>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="print-root"></div>

  <script>
    // Modules cannot load from file:// — explain how to run instead of showing a blank page.
    setTimeout(function () {
      if (window.__YAM_BOOTED) return;
      var t = document.getElementById('boot-text');
      if (!t) return;
      if (location.protocol === 'file:') {
        t.innerHTML = 'YAM must be served by a local web server.<br><br>' +
          'Open a terminal in the <b>yam</b> folder and run:<br>' +
          '<code>python3 -m http.server 8080</code><br>then open <code>http://localhost:8080</code>' +
          '<br><br>(or double-click <b>start.command</b> / <b>start.bat</b>)';
      } else {
        t.textContent = 'Still loading… If this persists, check the browser console for errors.';
      }
    }, 2500);
  </script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
